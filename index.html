-15 yoki 15-20 burchak ostida qiya qilib o'rnatiladi.", "Gorizont tekisligiga nisbatan 50-60 yoki 65-75 burchak ostida qiya qilib o'rnatiladi.", "Gorizont tekisligiga nisbatan 80-85 yoki 85-90 burchak ostida qiya qilib o'rnatiladi."], ["G'alvirlarning ishchi yuzalari (panjaralari) asosan qanday metall materiallardan shtamplanadi?", "Rudalarning xossalariga bog'liq holda cho'yan, bronza yoki po'lat listlardan tayyorlanadi.", "Rudalarning xossalariga bog'liq holda alyuminiy, rux yoki qo'rg'oshin listlardan tayyorlanadi.", "Rudalarning xossalariga bog'liq holda titan, volfram yoki molibden qotishmasidan tayyorlanadi.", "Rudalarning xossalariga bog'liq holda faqat yumshoq mis hamda qalay listlaridan tayyorlanadi."], ["G'alvirlash yuzasi ko'zg'aluvchan-mexanik bo'lgan konstruksiyalar guruhiga qaysilar kiradi?", "Barabansimon, juvali, tebranma tekislikli hamda titratma mexanizmga ega g'alvirlar kiradi.", "Yoysimon ko'zg'almas, qiya novsimon, to'g'ri burchakli hamda konusli statik g'alvirlar kiradi.", "Faqat gidrotsiklonlar, spiral klassifikatorlar hamda sentrifugal separatorlar tizimi kiradi.", "Gidravlik cho'kindi kamerasi, gravitatsion stollar hamda tindirgich chuqurlar tizimi kiradi."], ["Nima sababdan sanoat korxonalarida boshqa konstruksiyalarga nisbatan titratma g'alvirlar ko'proq ishlatiladi?", "Chunki ularning ish unumdorligi hamda elash samaradorligi boshqa g'alvirlarga qaraganda ancha yuqoridir.", "Chunki ularning elektr energiyasi sarfi kam bo'lib, o'rnatilish burchagi 90 gradus qiyalikni talab etadi.", "Chunki ularning yuzasi faqat yirik bo'lakli toshko'mirlarni navlarga ajratish imkoniyatini beradi.", "Chunki ularning tayyorlanish konstruksiyasi ko'zg'almas elaklarga qaraganda ancha sodda tuzilgandir."], ["Boyitish jarayonida komponentning miqdori tushunchasiga qaysi javobda to'g'ri ta'rif berilgan?", "Mahsulotdagi komponent og'irligining butun mahsulot og'irligiga bo'lgan nisbatiga aytiladi.", "Dastlabki xomashyo og'irligining boyitish natijasida olingan boyitma og'irligiga nisbatidir.", "Boyitmadagi foydali komponent og'irligining chiqindi tarkibidagi og'irligiga nisbatidir.", "Chiqindi tarkibidagi komponent og'irligining dastlabki ruda og'irligiga bo'lgan nisbatidir."], ["Boyitish darajasi texnologik ko'rsatkichi nimani ifodalaydi va qanday aniqlanadi?", "Boyitmadagi komponent miqdorining dastlabki rudadagi miqdoriga bo'lgan nisbatini ko'rsatadi.", "Chiqindi tarkibidagi komponent miqdorining dastlabki rudadagi miqdoriga bo'lgan nisbatidir.", "Dastlabki ruda massasining olingan tayyor konsentrat mahsuloti massasiga nisbatini bildiradi.", "Foydali mahsulot tarkibidagi qimmatbaho komponentning umumiy yo'qotilish darajasini bildiradi."], ["Boyitish mahsulotlarining chiqishi (γ) deb quyidagilarning qaysi biriga aytiladi?", "Olingan mahsulot og'irligining dastlabki xomashyo og'irligiga bo'lgan nisbatiga aytiladi.", "Dastlabki xomashyo og'irligining olingan toza mahsulot og'irligiga bo'lgan nisbatiga aytiladi.", "Chiqindi tarkibidagi metall massasining boyitmadagi metall massasiga bo'lgan nisbatidir.", "Komponentning umumiy massasining dastlabki rudaning hajmiga bo'lgan o'zaro nisbatiga aytiladi."], ["Birlik ulushlarda ifodalangan chiqishga teskari o'lcham qanday amaliy ma'noga ega?", "Bir tonna tayyor mahsulot olish uchun zarur bo'ladigan dastlabki xomashyoning tonnalar sonini ko'rsatadi.", "Bir tonna rudadan ajratib olinadigan sof qimmatbaho foydali komponentning umumiy miqdorini ifodalaydi.", "Bir soatda ishlab chiqariladigan yakuniy konsentrat mahsulotining belgilangan massasini ifodalaydi.", "Bir tonna chiqindi hosil bo'lishi jarayonida yo'qotilgan foydali komponentning foizdagi ulushini beradi."], ["Foydali komponentning boyitmaga ajralishi (ε) tushunchasiga keltirilgan to'g'ri ta'rifni toping.", "Mahsulotdagi komponent og'irligining shu komponentning dastlabki rudadagi og'irligiga bo'lgan nisbatidir.", "Dastlabki ruda umumiy og'irligining olingan konsentratdagi qimmatbaho metall og'irligiga nisbatidir.", "Chiqindi tarkibidagi metall miqdorining boyitmadagi qimmatbaho metall miqdoriga bo'lgan nisbatidir.", "Boyitma massasining texnologik jarayonga kelib tushayotgan dastlabki ma'dan massasiga nisbatidir."], ["Boyitish jarayonida mahsulotlar bo'yicha moddiy muvozanat tenglamasi qaysi javobda to'g'ri ko'rsatilgan?", "Q = C + T", "C = Q + T", "T = Q + C", "Q = C − T"], ["Komponent bo'yicha moddiy muvozanat tenglamasining to'g'ri yozilgan ifodasini aniqlang.", "Q · α = C · β + T · θ", "Q · β = C · α + T · θ", "Q · θ = C · β + T · α", "Q · α = C · θ + T · β"], ["Dastlabki mahsulot og'irligi Q, boyitma og'irligi C bo'lganda boyitmaning chiqishi qanday hisoblanadi?", "γ_b = (C / Q) · 100 %", "γ_b = (Q / C) · 100 %", "γ_b = (T / Q) · 100 %", "γ_b = (C / T) · 100 %"], ["Chiqindining chiqishi γ_ch dastlabki mahsulot (Q) va chiqindi (T) og'irliklari orqali qanday topiladi?", "γ_ch = (T / Q) · 100 %", "γ_ch = (Q / T) · 100 %", "γ_ch = (C / Q) · 100 %", "γ_ch = (T / C) · 100 %"], ["Oxirgi boyitish mahsulotlari chiqishlarining o'zaro munosabati uchun qaysi tenglik to'g'ri?", "γ_b + γ_ch = 100 %", "γ_b − γ_ch = 100 %", "γ_b · γ_ch = 100 %", "γ_b + γ_ch = 50 %"], ["Komponent miqdorlari (α, β, θ) orqali boyitmaning chiqishini (γ_b) hisoblash formulasi qaysi?", "γ_b = ((α − θ) / (β − θ)) · 100 %", "γ_b = ((β − α) / (β − θ)) · 100 %", "γ_b = ((α − β) / (θ − β)) · 100 %", "γ_b = ((β − θ) / (α − θ)) · 100 %"], ["Komponent miqdorlari (α, β, θ) orqali chiqindining chiqishini (γ_ch) hisoblash formulasini toping.", "γ_ch = ((β − α) / (β − θ)) · 100 %", "γ_ch = ((α − θ) / (β − θ)) · 100 %", "γ_ch = ((β − θ) / (β − α)) · 100 %", "γ_ch = ((α − β) / (α − θ)) · 100 %"], ["Boyitmaning chiqishi γ_b va boyitmadagi miqdor β orqali ajralish ε_b qanday ifodalanadi?", "ε_b = (γ_b · β) / α", "ε_b = (γ_b · α) / β", "ε_b = (γ_b · θ) / α", "ε_b = (γ_b · β) / θ"], ["Chiqindidagi komponentning ajralishi ε_ch texnologik formulasi qaysi javobda to'g'ri berilgan?", "ε_ch = (γ_ch · θ) / α", "ε_ch = (γ_ch · α) / θ", "ε_ch = (γ_ch · β) / α", "ε_ch = (γ_ch · θ) / β"], ["Boyitish mahsulotlariga foydali komponent ajralishlarining yig'indisi nechaga teng deb qabul qilinadi?", "ε_b + ε_ch = 100 %", "ε_b + ε_ch = 50 %", "ε_b − ε_ch = 100 %", "ε_b + ε_ch = 0 %"], ["1-misolda α = 1,2 %, β = 22 %, θ = 0,1 % bo'lganda boyitmaning chiqishi (γ_b) qanchaga teng bo'lgan?", "5,02%", "8,15%", "3,09%", "6,40%"], ["1-misolda unumdorlik Q = 420 t/soat va γ_b = 5,02 % bo'lsa, boyitma miqdori C qanchaga teng?", "21,08 t/soat", "35,12 t/soat", "18,45 t/soat", "42,00 t/soat"], ["1-misol shartiga ko'ra chiqindining chiqishi γ_ch qiymati qaysi qatorda to'g'ri ko'rsatilgan?", "94,98%", "89,50%", "96,91%", "92,15%"], ["2-misolda α = 2 %, β = 55 %, ε_b = 85 % bo'lganda boyitmaning chiqishi γ_b qanchaga teng bo'ladi?", "3,09%", "5,02%", "4,18%", "2,55%"], ["2-misolda ε_b = 85 % bo'lsa, komponentning chiqindiga ajralishi ε_ch qiymati qanchaga teng bo'ladi?", "15%", "25%", "10%", "20%"], ["Boyitish dastgohlarini texnologik talablar asosida tanlashda qaysi asosiy masalalarni hal etish talab etiladi?", "Dastgoh unumdorligini, uning konstruktiv turini, zarur geometrik o'lchamlari hamda talab etiladigan sonini aniqlash", "Dastgoh tannarxini, tayyorlovchi zavod litsenziyasini, elektr yuritmasining to'liq quvvatini va joylashuvini aniqlash", "Ruda qattiqligini, o'rnatish maydoni chuqurligini, poydevor yuk ko'tarish chegarasini va transport turini aniqlash", "Sex ish rejimini, xizmat ko'rsatuvchi xodimlar sonini, dastgoh metall sarfini va ta'mirlash davriyligini aniqlash"], ["Qo'zg'almas panjarali elaklar qanday texnologik sharoitlarda va qaysi samaradorlik darajasida qo'llaniladi?", "Elash samaradorligi past (60-70%) bo'lishiga yo'l qo'yilganda va birinchi bosqich maydalashdan oldin yirik elashda", "Elash samaradorligi yuqori (85-95%) bo'lishi talab etilganda va uchinchi bosqich maydalashdan oldin nozik elashda", "Elash samaradorligi o'rtacha (75-80%) darajada bo'lganda va suvsizlantirish jarayonida oraliq mahsulotni ajratishda", "Elash samaradorligi mutlaq (95-98%) bo'lishi shart bo'lganda hamda gravitatsion boyitish jarayonidan keyin tozalashda"], ["Maydalashning birinchi bosqichidan oldin qo'llaniladigan panjarali elaklarda panjaralar orasidagi masofa qancha qilib belgilanadi?", "Panjaralar oralig'i texnologik me'yorga ko'ra 60-70 mm dan ortiqroq qilib tanlanadi", "Panjaralar oralig'i texnologik me'yorga ko'ra 10-25 mm dan kichikroq qilib tanlanadi", "Panjaralar oralig'i texnologik me'yorga ko'ra 30-45 mm oralig'ida qat'iy qilib tanlanadi", "Panjaralar oralig'i texnologik me'yorga ko'ra 150-200 mm dan kengroq qilib tanlanadi"], ["Panjarali elaklarda panjaraning talab etiladigan umumiy ishchi yuzasi (m²) qaysi empirik ifoda yordamida hisoblanadi?", "F = Q / (2.4 · a) empirik formulasi orqali aniqlanadi", "F = Q · a / 2.4 empirik formulasi orqali aniqlanadi", "F = 2.4 · Q / a empirik formulasi orqali aniqlanadi", "F = 2.4 · a / Q empirik formulasi orqali aniqlanadi"], ["Dastlabki ruda tarkibida yirik bo'laklar ko'p bo'lgan sharoitda elak kengligi (B) qanday o'lchamda qabul qilinadi?", "Ruda tarkibidagi eng katta bo'lak o'lchamidan kamida 3 marta ortiq bo'lishi shart", "Ruda tarkibidagi eng katta bo'lak o'lchamidan kamida 5 marta ortiq bo'lishi shart", "Ruda tarkibidagi eng katta bo'lak o'lchamidan kamida 2 marta ortiq bo'lishi shart", "Ruda tarkibidagi eng katta bo'lak o'lchamiga aynan 500 mm qo'shilganiga teng bo'ladi"], ["Dastlabki ruda tarkibidagi yirik bo'laklarning miqdori uncha ko'p bo'lmaganda elak kengligi qanday hisoblanadi?", "Eng katta bo'lak o'lchamining 2 baravar miqdoriga qo'shimcha 100 mm qo'shib belgilanadi", "Eng katta bo'lak o'lchamining 3 baravar miqdoriga qo'shimcha 200 mm qo'shib belgilanadi", "Eng katta bo'lak o'lchamining 1.5 baravar miqdoriga teng qilib to'g'ridan to'g'ri olinadi", "Eng katta bo'lak o'lchamining 4 baravar miqdoridan aynan 150 mm ayirib hisoblab topiladi"], ["Panjarali elakning uzunligi (L) va uning amaldagi o'lchamlari haqidagi qaysi qoida to'g'ri keltirilgan?", "Uzunligi kengligidan 2 barobar katta (L=2B) bo'lib, amalda 3.5 m dan 6 m gachani tashkil etadi", "Uzunligi kengligidan 3 barobar katta (L=3B) bo'lib, amalda 1.5 m dan 3 m gachani tashkil etadi", "Uzunligi kengligiga teng (L=B) deb olinib, amalda 2.0 m dan 4.5 m gachani tashkil etadi", "Uzunligi kengligidan 4 barobar katta (L=4B) bo'lib, amalda 6.0 m dan 9 m gachani tashkil etadi"], ["Panjarali elakning qiyalik burchagi quruq hamda yopishqoq nam rudalarni elashda qanday qiymatlarda o'rnatiladi?", "Ruda uchun qiyalik 30-35° bo'lib, yopishib qoluvchi nam rudalarda yana 5-10° ga oshirilishi mumkin", "Ruda uchun qiyalik 15-20° bo'lib, yopishib qoluvchi nam rudalarda yana 2-4° ga oshirilishi mumkin", "Ruda uchun qiyalik 45-50° bo'lib, yopishib qoluvchi nam rudalarda yana 10-15° ga oshirilishi mumkin", "Ruda uchun qiyalik 20-25° bo'lib, yopishib qoluvchi nam rudalarda yana 1-3° ga oshirilishi mumkin"], ["Yengil turdagi vibratsion inersion elaklar qaysi fraksiyadagi va qanday xossali materiallarni elash uchun qo'llaniladi?", "Teshiklari 40 mm gacha bo'lgan o'rtacha va mayda, zichligi kichik mahsulotlar hamda ko'mir uchun", "Teshiklari 100 mm dan katta bo'lgan o'ta yirik va zichligi yuqori temir rudalarini dastlabki elashda", "Teshiklari 1 mm dan kichik bo'lgan o'ta mayda shlamlar va gravitatsion boyitilgan konsentratlar uchun", "Teshiklari 70 mm dan katta bo'lgan og'ir flyuslar va yuqori zichlikdagi polimetall birikmalarida"], ["Og'ir turdagi vibratsion va inersion elaklar qanday zichlikka ega bo'lgan mahsulotlarni elash uchun tavsiya qilinadi?", "Sochma zichligi 1.6 t/m³ dan ortiq bo'lgan yirik va o'rtacha yiriklikdagi mahsulotlarni elash uchun", "Sochma zichligi 0.8 t/m³ dan past bo'lgan o'ta yengil changsimon va donador mahsulotlarni elashda", "Sochma zichligi 1.0-1.2 t/m³ gacha bo'lgan faqat quruq organik materiallar va ko'mir kukunlarida", "Sochma zichligi 0.5 t/m³ bo'lgan torf hamda yog'och qirindilarini saralash jarayonlarida qo'llanadi"], ["Aglomeratni elashda qo'llaniladigan gorizontal vibratsion o'z-o'zini balanslovchi elaklarning parametrlari qanday bo'ladi?", "Elash yuzasi 18 m² gacha va teshiklari 20 mm gacha bo'lgan o'ta og'ir turda tayyorlanadi", "Elash yuzasi 25 m² gacha va teshiklari 50 mm gacha bo'lgan yengil turda tayyorlanadi", "Elash yuzasi 8 m² gacha va teshiklari 10 mm gacha bo'lgan o'rtacha turda tayyorlanadi", "Elash yuzasi 30 m² gacha va teshiklari 5 mm gacha bo'lgan nozik turda tayyorlanadi"], ["Giratsion va vibratsion elaklarning ishlab chiqarish unumdorligini aniqlash formulasida qaysi parametr solishtirma unumdorlikni bildiradi?", "q parametri - elakning 1 m² yuzasiga to'g'ri keladigan solishtirma unumdorlik (m³/soat)", "F parametri - elakning nominal o'lchamlari bo'yicha hisoblangan to'liq maydoni (m²)", "k parametri - elak to'rining geometrik shakliga bog'liq bo'lgan empirik koeffitsient", "p parametri - elak tebranish chastotasi hamda uning amplitudasini ifodalovchi koeffitsient"], ["Rudalar uchun to'rning jonli kesimi (j.k.) bo'yicha tuzatish koeffitsienti qaysi formula orqali hisoblanadi?", "kj.k. = j.k. / 50 ifodasi yordamida hisoblab topiladi", "kj.k. = j.k. / 60 ifodasi yordamida hisoblab topiladi", "kj.k. = 50 / j.k. ifodasi yordamida hisoblab topiladi", "kj.k. = j.k. · 50 ifodasi yordamida hisoblab topiladi"], ["Ko'mir uchun to'rning jonli kesimi (j.k.) bo'yicha tuzatish koeffitsienti qanday formula orqali aniqlanadi?", "kj.k. = j.k. / 60 ifodasi orqali hisoblab aniqlanadi", "kj.k. = j.k. / 50 ifodasi orqali hisoblab aniqlanadi", "kj.k. = 60 / j.k. ifodasi orqali hisoblab aniqlanadi", "kj.k. = j.k. · 60 ifodasi orqali hisoblab aniqlanadi"], ["Ishchi yuza teshiklarining shakliga bog'liq holda tuzatish koeffitsienti (kt) kvadrat va dumaloq shakllar uchun qanday qabul qilinadi?", "Kvadrat teshiklar uchun kt = 1 bo'lib, dumaloq shakldagi teshiklar uchun kt = 0.8 ga teng", "Kvadrat teshiklar uchun kt = 0.8 bo'lib, dumaloq shakldagi teshiklar uchun kt = 1 ga teng", "Kvadrat teshiklar uchun kt = 1.2 bo'lib, dumaloq shakldagi teshiklar uchun kt = 0.5 ga teng", "Kvadrat teshiklar uchun kt = 0.9 bo'lib, dumaloq shakldagi teshiklar uchun kt = 1.1 ga teng"], ["To'rtburchak shakldagi teshiklar uchun tomonlar nisbati 3:1 bo'lganda kt koeffitsientining qiymati nechaga teng bo'ladi?", "Tomonlar nisbati 3:1 bo'lgan teshiklarda tuzatish koeffitsienti kt = 1.20 deb olinadi", "Tomonlar nisbati 3:1 bo'lgan teshiklarda tuzatish koeffitsienti kt = 1.15 deb olinadi", "Tomonlar nisbati 3:1 bo'lgan teshiklarda tuzatish koeffitsienti kt = 1.25 deb olinadi", "Tomonlar nisbati 3:1 bo'lgan teshiklarda tuzatish koeffitsienti kt = 1.00 deb olinadi"], ["Val uzatmasining aylanish yo'nalishiga qarab ky koeffitsientining qiymatlari qanday qabul qilinadi?", "Elak qiyaligi yo'nalishi bo'ylab ky = 1, elak qiyaligiga teskari aylanganda ky = 0.9 qabul qilinadi", "Elak qiyaligi yo'nalishi bo'ylab ky = 0.9, elak qiyaligiga teskari aylanganda ky = 1 qabul qilinadi", "Elak qiyaligi yo'nalishi bo'ylab ky = 1.2, elak qiyaligiga teskari aylanganda ky = 0.8 qabul qilinadi", "Elak qiyaligi yo'nalishi bo'ylab ky = 0.5, elak qiyaligiga teskari aylanganda ky = 1.5 qabul qilinadi"], ["Bo'shatish tomonida mahsulot qatlami qalinligi ruda va ko'mir uchun qanday maksimal chegaralardan oshmasligi shart?", "Ruda uchun umumiy qalinlik 100 mm dan va ko'mir uchun 150 mm dan kichik bo'lishi talab etiladi", "Ruda uchun umumiy qalinlik 150 mm dan va ko'mir uchun 100 mm dan kichik bo'lishi talab etiladi", "Ruda uchun umumiy qalinlik 200 mm dan va ko'mir uchun 250 mm dan kichik bo'lishi talab etiladi", "Ruda uchun umumiy qalinlik 50 mm dan va ko'mir uchun 80 mm dan kichik bo'lishi talab etiladi"], ["Elakning bo'shatish tomonidagi mahsulot qatlamining qalinligini (h, mm) hisoblash formulasi to'g'ri ko'rsatilgan javobni aniqlang.", "h = P / (3.6 · δ · B · ʋm) ko'rinishidagi formuladan foydalanib hisoblab topiladi", "h = 3.6 · P / (δ · B · ʋm) ko'rinishidagi formuladan foydalanib hisoblab topiladi", "h = P · δ / (3.6 · B · ʋm) ko'rinishidagi formuladan foydalanib hisoblab topiladi", "h = 3.6 · δ · B · ʋm / P ko'rinishidagi formuladan foydalanib hisoblab topiladi"], ["Aylanma harakatli elaklarda chastota, tebranish diametri va material harakat tezligi qanday ko'rsatkichlarga ega?", "Chastota 750-900 daq⁻¹, tebranish diametri 8-11 mm hamda harakat tezligi ʋm = 0.5-0.63 m/s bo'ladi", "Chastota 850-900 daq⁻¹, tebranish diametri 2-5 mm hamda harakat tezligi ʋm = 0.2-0.23 m/s bo'ladi", "Chastota 500-650 daq⁻¹, tebranish diametri 15-20 mm hamda harakat tezligi ʋm = 0.8-1.10 m/s bo'ladi", "Chastota 300-450 daq⁻¹, tebranish diametri 4-6 mm hamda harakat tezligi ʋm = 0.1-0.18 m/s bo'ladi"], ["Laboratoriya mashg'ulotining asosiy maqsadi qaysi javobda to'liq va to'g'ri ko'rsatilgan?", "Ruda bo'laklarining geometrik o'lchamlarini aniqlab, ularning shartli o'rtacha diametrini hisoblash usullarini o'rganish.", "Foydali qazilmalarni boyitish texnologiyasining optimal parametrlarini tajriba yo'li bilan mukammal aniqlashga erishish.", "Shtangensirkul yordamida tog' jinslarining zichligi va mineralogik xususiyatlarini chuqur laboratoriya tahlilidan o'tkazish.", "Rudani maydalash jarayonida energiya sarfini minimal darajaga tushirishning yangi hisoblash usullarini ishlab chiqish."], ["Ruda bo'laklarining o'rtacha diametrini aniqlash amaliyotda qaysi asosiy maqsadlar uchun xizmat qiladi?", "Elash, maydalash, yanchish uskunalarini to'g'ri tanlash hamda ularning ish samaradorligini to'liq hisoblash uchun.", "Kon massasidagi foydali komponentlarning massaviy ulushini va boyitish darajasini aniq belgilab olish uchun.", "Ruda tarkibidagi namlik miqdorini aniqlash va quritish apparatlarining umumiy issiqlik balansini tekshirish uchun.", "Kon qazish jarayonida hosil bo'ladigan texnogen chiqindilarning umumiy xavflilik darajasini baholab borish uchun."], ["Qanday shakldagi bo'laklarning yirikligini faqat bitta o'lcham orqali to'liq aniqlash imkoni mavjud?", "Faqat to'g'ri sferik geometrik shaklga ega bo'lgan bo'laklar uchun yagona o'lcham orqali aniqlash mumkin.", "Faqat kubik piramidal qirralarga ega bo'lgan bir xil donador qattiq tog' jinsi bo'laklari uchun mumkin.", "Faqat noto'g'ri cho'ziq ko'rinishdagi prizmatik kristallar va yassi ruda fragmentlari uchun mumkin.", "Faqat konus shaklidagi parchalangan tog' jinslari hamda silindrsimon tosh massalari uchun mumkin."], ["Noto'g'ri shakldagi ruda bo'laklarining o'rtacha diametri qaysi uchta chiziqli parametrga bevosita bog'liq?", "Ruda bo'lagining uzunligi (l), eni (b) hamda uning balandligi (h) kabi o'lcham parametrlariga bog'liq bo'ladi.", "Ruda bo'lagining massasi (m), hajmi (V) hamda uning moddiy tarkibining zichligi (ρ) kabi kattaliklariga bog'liq.", "Ruda bo'lagining perimetri (P), asos yuzi (S) hamda materialning qattiqlik koeffitsiyenti (k) kabi omillariga bog'liq.", "Ruda bo'lagining diametri (d), kesim radiusi (r) hamda zarrachaning fazoviy og'irlik markaziga bevosita bog'liq."], ["Uzunligi va eni bo'yicha o'rtacha arifmetik kattalikni hisoblash qaysi ifoda yordamida amalga oshiriladi?", "D = (l + b) / 2 formulasi orqali ikkita chiziqli o'lchamning arifmetik o'rtacha qiymati hisoblanadi.", "D = (l · b) / 2 formulasi orqali ikkita chiziqli o'lchamning ko'paytmasi asosida diametr topiladi.", "D = (l + b + h) / 3 formulasi orqali uchta chiziqli o'lchamning yig'indisi asosida diametr topiladi.", "D = (l - b) / 2 formulasi orqali ikkita chiziqli o'lchamning ayirmasi hisobga olingan holda topiladi."], ["Uzunligi va enining o'rtacha geometrik kattaligi matnda qaysi formula orqali berilgan?", "D = √(l · b) ko'rinishidagi kvadrat ildiz ostidagi ko'paytma munosabati orqali ifodalanadi.", "D = ∛(l · b) ko'rinishidagi kubik ildiz ostidagi ikkita o'lcham munosabati orqali ifodalanadi.", "D = √(l + b) ko'rinishidagi o'lchamlarning yig'indisi ildiz ostiga olingan munosabat orqali bo'ladi.", "D = 2 · √(l · b) ko'rinishidagi ko'paytuvchi koeffitsiyent kiritilgan munosabat orqali beriladi."], ["Uchta o'lcham (uzunlik, en va balandlik) bo'yicha o'rtacha arifmetik kattalik matnda qanday ifodalangan?", "D = (l + b + h) / 2 ko'rinishidagi amaliy hisoblash formulasi orqali keltirilgan.", "D = (l + b + h) / 3 ko'rinishidagi amaliy hisoblash formulasi orqali keltirilgan.", "D = (l · b · h) / 2 ko'rinishidagi amaliy hisoblash formulasi orqali keltirilgan.", "D = (l · b · h) / 3 ko'rinishidagi amaliy hisoblash formulasi orqali keltirilgan."], ["Uzunligi, eni va balandligining o'rtacha geometrik kattaligini hisoblash (2.4) formulasida qaysi ifoda keltirilgan?", "D = √((lb + lh + bh) / (l · b · h)) ifodasi orqali bo'lakning o'rtacha diametri hisoblanadi.", "D = ∛((l · b · h) / (lb + lh + bh)) ifodasi orqali bo'lakning o'rtacha diametri hisoblanadi.", "D = √((l · b · h) / (l + b + h)) ifodasi orqali bo'lakning o'rtacha diametri hisoblanadi.", "D = ∛((lb + lh + bh) / 3) ifodasi orqali bo'lakning o'rtacha diametri hisoblanadi."], ["Laboratoriya ishini bajarish uchun keltirilgan asbob va materiallar ro'yxatiga nimalar kiradi?", "Noto'g'ri shakldagi ruda bo'laklari, o'lchov chizg'ichi hamda shtangensirkul asbobi.", "Turli fraksiyali standart elaklar to'plami, analitik tarozi va laboratoriya maydalagichi.", "Mikrometr, gidravlik press qurilmasi hamda maydalash kamerasiga ega bo'lgan yanchgich.", "Elektron tarozi, quritish shkafi hamda mineralogik optik mikroskop apparaturalari."], ["Laboratoriya ishining bajarilish tartibiga binoan dastlabki rudadan nechta bo'lak ajratib olinadi?", "Tahlil qilish va o'lchov ishlarini bajarish maqsadida aniq 3 ta ruda bo'lagi ajratib olinadi.", "Tahlil qilish va o'lchov ishlarini bajarish maqsadida aniq 5 ta ruda bo'lagi ajratib olinadi.", "Tahlil qilish va o'lchov ishlarini bajarish maqsadida aniq 10 ta ruda bo'lagi ajratib olinadi.", "Tahlil qilish va o'lchov ishlarini bajarish maqsadida aniq 1 ta ruda bo'lagi ajratib olinadi."], ["Ruda bo'laklarining o'lchash natijalari (uzunligi, eni, balandligi) laboratoriya rejasida qaysi jadvalga kiritiladi?", "Bo'laklarning chiziqli o'lchamlari (l, b, h) qiymatlari to'g'ridan-to'g'ri 2.1-jadvalga yoziladi.", "Bo'laklarning chiziqli o'lchamlari (l, b, h) qiymatlari to'g'ridan-to'g'ri 2.2-jadvalga yoziladi.", "Bo'laklarning chiziqli o'lchamlari (l, b, h) qiymatlari to'g'ridan-to'g'ri 1.1-jadvalga yoziladi.", "Bo'laklarning chiziqli o'lchamlari (l, b, h) qiymatlari to'g'ridan-to'g'ri 1.2-jadvalga yoziladi."], ["O'lchangan uch o'lcham qiymatlari 2.1-jadvalda qaysi o'lchov birligida qayd etilishi ko'rsatilgan?", "Barcha chiziqli parametrlar jadvallarda millimetr (mm) birligida ko'rsatilishi belgilangan.", "Barcha chiziqli parametrlar jadvallarda santimetr (sm) birligida ko'rsatilishi belgilangan.", "Barcha chiziqli parametrlar jadvallarda metr (m) o'lchov birligida ko'rsatilishi belgilangan.", "Barcha chiziqli parametrlar jadvallarda mikrometr (mkm) birligida ko'rsatilishi belgilangan."], ["Har qaysi formula (2.1–2.4) bo'yicha aniqlangan o'rtacha diametr hisob-kitoblari qaysi jadvalga yoziladi?", "Hisoblangan to'rtta o'rtacha diametr qiymatlarining barchasi 2.2-jadvalga kiritib boriladi.", "Hisoblangan to'rtta o'rtacha diametr qiymatlarining barchasi 2.1-jadvalga kiritib boriladi.", "Hisoblangan to'rtta o'rtacha diametr qiymatlarining barchasi 3.1-jadvalga kiritib boriladi.", "Hisoblangan to'rtta o'rtacha diametr qiymatlarining barchasi 1.3-jadvalga kiritib boriladi."], ["Nazorat savollarida keltirilgan 'Maydalash' tushunchasining umumiy texnologik mohiyati nima hisoblanadi?", "Tashqi mexanik kuchlar ta'sirida qattiq material bo'laklarining o'lchamlarini kichraytirish jarayoni.", "Foydali minerallarni turli reagentlar vositasida bir-biridan zichligi bo'yicha ajratish jarayoni.", "Material zarrachalarini o'lchamlari bo'yicha elaklar to'plamida sinflarga saralash jarayoni.", "Ruda tarkibidagi ortiqcha namlikni yuqori harorat ostida to'liq bug'lantirish jarayoni."], ["Nazorat savollarida tilga olingan 'Maydalash darajasi' kattaligi amaliyotda nimani ifodalaydi?", "Boshlang'ich material o'rtacha diametrining maydalangan mahsulot o'rtacha diametriga nisbatini.", "Maydalash mashinasining bir soat davomida qayta ishlagan rudasining umumiy massaviy miqdorini.", "Rudani maydalash paytida sarf bo'lgan sof elektr energiyasining material hajmiga nisbatini.", "Maydalangan mahsulot tarkibidagi foydali komponentning umumiy ajralib chiqish foiz miqdorini."], ["Agar ruda bo'lagining uzunligi l = 40 mm va eni b = 10 mm bo'lsa, (2.1) formula bo'yicha diametr nechaga teng?", "Hisoblash natijasida o'rtacha diametr qiymati D = (40 + 10) / 2 = 25 mm ga teng bo'ladi.", "Hisoblash natijasida o'rtacha diametr qiymati D = (40 + 10) / 2 = 20 mm ga teng bo'ladi.", "Hisoblash natijasida o'rtacha diametr qiymati D = (40 + 10) / 2 = 30 mm ga teng bo'ladi.", "Hisoblash natijasida o'rtacha diametr qiymati D = (40 + 10) / 2 = 50 mm ga teng bo'ladi."], ["Agar ruda bo'lagining uzunligi l = 16 mm va eni b = 4 mm bo'lsa, (2.3) formula bo'yicha diametr nechaga teng?", "Hisoblash natijasida o'rtacha diametr qiymati D = √(16 · 4) = 8 mm ga teng bo'ladi.", "Hisoblash natijasida o'rtacha diametr qiymati D = √(16 · 4) = 10 mm ga teng bo'ladi.", "Hisoblash natijasida o'rtacha diametr qiymati D = √(16 · 4) = 6 mm ga teng bo'ladi.", "Hisoblash natijasida o'rtacha diametr qiymati D = √(16 · 4) = 12 mm ga teng bo'ladi."], ["Agar ruda bo'lagining l = 30 mm, b = 20 mm va h = 10 mm bo'lsa, (2.2) formula bo'yicha hisoblangan D nechaga teng?", "Matndagi (2.2) ifodaga muvofiq diametr D = (30 + 20 + 10) / 2 = 30 mm ga teng bo'ladi.", "Matndagi (2.2) ifodaga muvofiq diametr D = (30 + 20 + 10) / 2 = 20 mm ga teng bo'ladi.", "Matndagi (2.2) ifodaga muvofiq diametr D = (30 + 20 + 10) / 2 = 40 mm ga teng bo'ladi.", "Matndagi (2.2) ifodaga muvofiq diametr D = (30 + 20 + 10) / 2 = 60 mm ga teng bo'ladi."], ["Dastlabki ruda massasi qanday xarakterli xususiyatga ega bo'lganligi sababli o'rtacha diametr shartli hisoblanadi?", "Ruda noto'g'ri geometrik shaklga ega bo'lib, har xil yiriklikdagi bo'laklardan tashkil topganligi sababli.", "Ruda bo'laklari o'ta mo'rt bo'lib, o'lchash jarayonida o'z shaklini doimiy ravishda yo'qotishi sababli.", "Ruda zarralari o'zaro zich jipslashib, alohida mustaqil bo'laklarga ajralish xususiyatiga ega emasligi sababli.", "Ruda bo'laklarining yuzasi doimo bir xil sferik shaklga ega bo'lib, qirralari deyarli ko'rinmasligi sababli."], ["Noto'g'ri shakldagi bo'laklarning chiziqli o'lchamlarini aniqlashda laboratoriyada qaysi o'lchov asbobi asosiy hisoblanadi?", "Yuqori aniqlikdagi shtangensirkul asbobi bo'laklarning chiziqli parametrlarini o'lchashda ishlatiladi.", "Pyezoelektrik datchikli avtomatlashtirilgan elektron profilometr asbobi laboratoriyada ishlatiladi.", "Optik tolali lazerli skaner apparati tog' jinsining chiziqli o'lchamlarini aniqlashda qo'llaniladi.", "Aylanuvchi barabanli elash qurilmasi bo'laklarning aniq chiziqli uzunligini o'lchashda ishlatiladi."]]}, {"name": "Hayot faoliyati xavfsizligi", "q": [["Hayot faoliyati xavfsizligini ta'minlash asoslari (HFX) tushunchasining mazmuni qaysi javobda to'g'ri ko'rsatilgan?", "Insonni uning barcha faoliyat turlarida har qanday xavf-xatarlardan himoya qilish tizimidir.", "Mehnat unumdorligini oshirish maqsadida ishlab chiqarish jarayonlarini to'liq avtomatlashtirishdir.", "Favqulodda vaziyatlar yuzaga kelgan paytda faqat moddiy mulklarni asrashga qaratilgan choralardir.", "Aholini tabiiy ofatlar paytida oziq-ovqat mahsulotlari bilan uzluksiz ta'minlash dasturidir."], ["Hayot faoliyati xavfsizligini ta'minlash fanining 'Insonparvarlik' prinsipi nimani nazarda tutadi?", "Har qanday texnologik yoki iqtisodiy yutuqdan inson hayoti va salomatligining ustuvor turishini.", "Ishlab chiqarish hajmini keskin oshirish orqali korxonaning sof iqtisodiy foydasini ko'paytirishni.", "Atrof-muhit musaffoligini saqlash maqsadida sanoat tarmoqlarini bosqichma-bosqich qisqartirishni.", "Mehnat jamoalarida ma'naviy muhitni yaxshilash va xodimlar o'rtasida intizomni kuchaytirishni."], ["HFX fanining 'Xavfning muqarrarligi' aksiomasining tub mohiyati nimadan iborat?", "Har qanday insoniy faoliyat potentsial xavfga ega ekani va mutlaq xavfsiz faoliyat yo'qligidan.", "Barcha texnogen halokatlar faqatgina insonlarning e'tiborsizligi tufayli yuzaga kelishidan.", "Tabiiy ofatlarning oldini zamonaviy muhandislik texnologiyalari orqali to'liq olib bo'lishidan.", "Xavf darajasini maxsus asboblar yordamida har doim nol ko'rsatkichgacha tushirib bo'lishidan."], ["Hayot faoliyati xavfsizligida 'Tizimlilik' prinsipi qanday mezonlarning uyg'unligiga asoslanadi?", "Ekologiya, texnika, tibbiyot va huquqiy normalarning o'zaro chambarchas bog'liqligiga.", "Faqatgina davlat xavfsizlik organlarining qat'iy nazorati va ko'rsatmalariga bo'ysunishga.", "Korxonalardagi texnologik liniyalarning uzluksiz elektr energiyasi bilan ta'minlanishiga.", "Sanoat tarmoqlarida iqtisodiy tejamkorlik va yangi xomashyo bazalarini shakllantirishga."], ["Modulning vazifalaridan biri bo'lgan xavflarni identifikatsiya qilish nimani anglatadi?", "Atrof-muhit, ishlab chiqarish va texnogen jarayonlardagi yashirin xavflarni oldindan ko'rishni.", "Favqulodda vaziyat ro'y bergandan so'ng yetkazilgan moddiy zararni iqtisodiy hisoblab chiqishni.", "Zararlangan hududlardagi barcha jabrlangan fuqarolarni zudlik bilan shifoxonalarga yetkazishni.", "Kasalxonalarda sanitariya-epidemiologik nazorat tadbirlarini reja asosida tashkillashtirishni."], ["Tibbiy muhofaza (tibbiy himoya) tizimining asosiy maqsadi qaysi javobda to'g'ri ifodalangan?", "Inson hayotiga tahdid soluvchi omillarni kamaytirish va jabrlanganlarga o'z vaqtida yordam berish.", "Aholi o'rtasida ommaviy sport turlarini targ'ib qilish hamda sog'lom turmush tarzini yaratish.", "Ishlab chiqarish korxonalarida texnika xavfsizligi qoidalarining buzilish hollarini kamaytirish.", "Tabiiy ofat oqibatida zararlangan bino va inshootlarni tezkorlik bilan qayta tiklab berish."], ["Tibbiy muhofaza tizimidagi 'Evakuatsiya va saralash (Triaj)' vazifasining mohiyati nima?", "Jabrlanganlarni jarohat darajasiga qarab ajratish va ularni xavfsiz shifoxonalarga yetkazish.", "Aholi o'rtasida sanitariya-gigiyena qoidalariga rioya etilishini to'liq nazorat ostiga olish.", "Hududlarda yuqumli kasalliklar tarqalishining oldini olish uchun suv tozaligini tekshirish.", "Tibbiy muassasalarni favqulodda vaziyatlarga tayyorlash uchun tibbiy zaxiralarni yaratish."], ["Shaxsiy tibbiy muhofaza vositalaridan biri bo'lgan AI-2 ning asosiy tarkibi nimalardan iborat?", "Radiatsiya, kimyoviy zaharlanish va bakterial vositalarga qarshi maxsus dorilar majmuasidan.", "Qon ketishini to'xtatish va jarohatlangan joyni bog'lash uchun ishlatiladigan bint va paxtadan.", "Kiyimga tekkan tomchi-suyuq zaharli moddalarni degazatsiya qiluvchi kimyoviy eritmalardan.", "Nafas olish a'zolarini zaharli tutun va changlardan to'liq muhofaza qiluvchi maxsus filtrlardan."], ["IPP-8/11 (Individual kimyoviy paket) qanday vaziyatlarda qo'llanilishi lozim?", "Teriga yoki kiyimga tekkan tomchi-suyuq holatdagi zaharli moddalarni zararsizlantirish uchun.", "Ochiq jarohatlardan kuchli qon ketishini to'xtatish hamda mikroblardan himoyalash uchun.", "Kuchli og'riq paydo bo'lganda asab tizimini tinchlantirish va og'riqni zudlik bilan yo'qotish uchun.", "Suv va oziq-ovqat mahsulotlarini radioaktiv changlar bilan zararlanishdan saqlab qolish uchun."], ["PPM (Individual bog'lov paketi) asosan qanday maqsadlar uchun xizmat qiladi?", "Qon ketishini to'xtatish va jarohatlangan joyni infeksiyadan asrash maqsadida bintlash uchun.", "Zaharli bug'lar ta'sirida bo'lgan kiyimlarni maxsus eritmalar yordamida tozalash va yuvish uchun.", "Bakterial kasalliklarga chalingan bemorlarning haroratini pasaytirish va quvvatlantirish uchun.", "Nafas yo'llarini radioaktiv zarrachalar va zaharli gazlar ta'siridan himoya qilib turish uchun."], ["Tibbiy muhofaza tadbirlarining 'Xavf tug'ilishidan oldin'gi bosqichiga qaysi harakat kiradi?", "Aholini birinchi yordamga o'rgatish va shaxsiy himoya vositalari zaxirasini yaratib qo'yish.", "Qutqaruv ishlarida ishtirok etib, jabrlanganlarga sun'iy nafas berish va xavfdan olib chiqish.", "Kasalxonalarda malakali tibbiy yordam ko'rsatish va zarur psixologik reabilitatsiyani o'tkazish.", "Yuz bergan halokat oqibatlarini tugatish maqsadida ommaviy dezinfeksiya ishlarini boshlash."], ["Halokat oqibatlari tugatilganda qaysi tibbiy muhofaza tadbirlari amalga oshiriladi?", "Kasalxonalarda malakali yordam ko'rsatish, epidemiyaga qarshi kurash va ruhiy reabilitatsiya.", "Aholiga sanitariya qoidalarini o'rgatish hamda tibbiy muassasalarni favqulodda holatga shaylash.", "Zudlik bilan qidiruv-qutqaruv ishlarini olib borish va qon ketayotgan joyni tezkor bog'lash.", "Zararlangan hududda qolib ketgan odamlarni maxsus transportlarda xavfsiz yerlarga olib chiqish."], ["Xavf (Hazard) tushunchasining asosiy xususiyati qaysi ta'rifda aniq ifodalangan?", "Insonga, mulkka yoki tabiatga zarar yetkazishi mumkin bo'lgan ob'ektiv mavjud manba yoki holat.", "Insonning ruhiy holatiga bog'liq holda o'zgarib turadigan noaniq his-tuyg'ular va qo'rquvlar.", "Faqatgina sanoat korxonalarida texnik nosozlik oqibatida yuzaga keladigan favqulodda holat.", "Moliyaviy operatsiyalarda mablag'larning yo'qotilish ehtimolini ifodalovchi iqtisodiy mezon."], ["Xavfsizlik nazariyasida 'Risk' (Risk) ko'rsatkichi qanday hisoblab chiqiladi?", "Xavfli hodisa yuz berish ehtimolining kelib chiqadigan zarar og'irligiga ko'paytmasi orqali.", "Zararlangan hududdagi aholi sonining mavjud tibbiy xodimlar soniga nisbatini topish orqali.", "Texnogen avariya oqibatida yetkazilgan umumiy iqtisodiy zararning hajmini baholash orqali.", "Tabiiy ofat sodir bo'lgan vaqt davomiyligini qutqaruv ishlari sarf-xarajatiga bo'lish orqali."], ["Xavf va risk tushunchalarining tabiatiga ko'ra o'zaro farqi nimadan iborat?", "Xavf ob'ektiv va statik bo'lishi mumkin, risk esa inson harakatiga bog'liq holda dinamikdir.", "Xavf doimo miqdor jihatdan o'lchanadi, risk esa faqat sifat ko'rsatkichlari bilan belgilanadi.", "Xavfni kamaytirish va sug'urtalash mumkin, riskni esa tabiatdan butunlay yo'q qilib bo'lmaydi.", "Xavf faqat inson omiliga tayanadi, risk esa mutlaqo tashqi tabiiy jarayonlarga bog'liqdir."], ["Qabul qilinadigan (tizimli) risk darajasi nimaga asoslanadi?", "Jamiyat iqtisodiy-ijtimoiy jihatdan rozi bo'ladigan, minimal darajadagi xavfsiz risk mezoniga.", "Ishlab chiqarish maydonida xavf darajasini mutlaq nol ko'rsatkichiga keltirish talabiga.", "Xavfsizlik uchun sarflanadigan barcha xarajatlarni to'liq qisqartirish zaruriyatiga.", "Faqat xalqaro tashkilotlar tomonidan belgilangan ekologik standartlarga mos kelishiga."], ["Antropogen xavf manbalariga qaysi holatlar misol bo'la oladi?", "Ish joyida texnika xavfsizligini buzish, e'tiborsizlik va stress holatidagi xatolar.", "Zilzilalar, kuchli suv toshqinlari, ko'chkilar hamda anomal sovuq iqlim hodisalari.", "Mashinalar nosozligi, gaz quvurlaridagi portlashlar va kimyoviy moddalar sizishi.", "Iqtisodiy tanglik, ommaviy ishsizlik, jamiyatdagi beqarorlik va turli epidemiyalar."], ["Texnogen xavf manbalarining asosiy xususiyati qaysi javobda to'g'ri ko'rsatilgan?", "Inson yaratgan texnika, texnologiyalar va ishlab chiqarish ob'ektlaridan kelib chiqishi.", "Inson irodasiga mutlaqo bog'liq bo'lmagan tabiat hodisalari natijasida sodir bo'lishi.", "Faqat xodimning charchog'i, bilimsizligi va ruhiy zo'riqishi tufayli yuzaga kelishi.", "Jamiyatdagi ijtimoiy-siyosiy to'qnashuvlar va iqtisodiy inqirozlar ta'sirida paydo bo'lishi."], ["Xavflarning ta'sir ko'rsatish xarakteriga ko'ra 'Xavfli omillar' qanday ta'riflanadi?", "Insonga to'satdan ta'sir qilib, keskin jarohatlanishga yoki o'limga olib keladigan omillar.", "Insonga uzoq vaqt davomida sekin ta'sir qilib, surunkali kasalliklarga olib keladigan omillar.", "Korxonada ish unumdorligini oshirishga yordam beradigan texnik va tashkiliy sharoitlar.", "Atrof-muhitdagi tabiiy muvozanatni saqlashga xizmat qiladigan biosfera elementlari."], ["Mehnat sharoitidagi 'Zararli omillar'ga qaysi qatorda to'g'ri misollar keltirilgan?", "Doimiy kuchli shovqin, zaharli gazlar bilan uzoq nafas olish va xonada yoritishning pastligi.", "Ochiq qolgan elektr simiga teginish va katta balandlikdan pastga qulab tushish holatlari.", "Kuchli zilzila to'lqinlari, yer silkinishlari va to'satdan keluvchi sel-suv toshqinlari.", "Sanoat qozonlarining to'satdan yorilishi hamda ombordagi yonilg'ining tezkor chaqnashi."], ["Fuqaro muhofazasi tibbiyot xizmatining (FMTX) asosiy vazifasi qaysi javobda to'liq ko'rsatilgan?", "Aholini muhofaza qilish, tibbiy yordam ko'rsatish va evakuatsiyani amalga oshirishdir", "Harbiy harakatlar zonasida faqat mudofaa istehkomlari va xavfsiz blindajlarni qurishdir", "Zararlangan hududlardagi sanoat korxonalarining moddiy ishlab chiqarishini ta'minlashdir", "Xalq xo'jaligi ob'yektlarini modernizatsiya qilish va texnik qayta qurollantirishdir"], ["FMTX faoliyatining tashkiliy tamoyillariga kirmaydigan qoida qaysi bandda ifodalangan?", "Qutqaruv kuchlari va vositalarining faqat yakka tartibdagi avtonom faoliyat yuritishi", "Tuzilmalarni ham hududiy ma'muriy birliklar, ham tarmoq idoralari bo'yicha tuzish", "Zararlanganlarni bosqichma-bosqich ko'chirib, yo'l-yo'lakay tibbiy yordam ko'rsatish", "Favqulodda vaziyat oqibatlariga har qanday daqiqada tezkor munosabat bildirish"], ["Korxona va muassasalarda tuziladigan sanitariya postlari (SP) va drujinalarining (SD) o'ziga xosligi nimada?", "Ular tarkibi shifokor bo'lmagan xodimlardan iborat ko'ngilli jamoalardan tashkil topadi", "Ular tarkibi faqat yuqori toifali shifokorlar va harbiy jarrohlardan tashkil topadi", "Ular faqatgina davlat sanitariya-epidemiologiya nazorati markazi xodimlaridan tuziladi", "Ular favqulodda vaziyatlar o'chog'ida faqat kimyoviy razvedka ishlarini olib boradi"], ["Qonunchilikka muvofiq xalq xo'jaligi ob'yektlarida (korxona, zavod) Fuqaro muhofazasi boshliqlari kimlar hisoblanadi?", "Mazkur korxona, zavod va tashkilotlarning bevosita birinchi rahbarlari (direktorlar)", "Hu sh", "Ag‘darma yo‘lining umumiy mustahkamligini tekshirish"], ["Karyerning qoplovchi tog‘ jinsi bo‘yicha smenalik unumdorligi (Pᴮₛₘ) qaysi formula bo‘yicha hisoblanadi?", "Pᴮₛₘ = Pᴮ꜀ₕ · Tₛₘ ko‘rinishida aniqlanadi", "Pᴮₛₘ = Pᴮ꜀ₕ / Tₛₘ ko‘rinishida aniqlanadi", "Pᴮₛₘ = Pᴮ꜀ₕ · kₕ ko‘rinishida aniqlanadi", "Pᴮₛₘ = Pᴮ꜀ₕ · 1,4 ko‘rinishida aniqlanadi"], ["Buldozer bilan bajariladigan ishlar hajmini hisoblashdagi «kᴢᴀᴃ» koeffitsiyenti nimani ifodalaydi?", "Tog‘ jinsining to‘kilish koeffitsiyenti", "Karyer ishining tengsizlik koeffitsiyenti", "Buldozer pichog‘ining to‘lish koeffitsiyenti", "Kon jinsining parchalanish koeffitsiyenti"], ["Ag‘darmada ishdagi buldozerlar soni (Nᵦ) qaysi parametrlar nisbati orqali hisoblab topiladi?", "Qᵦ / Pᵦ nisbati orqali aniqlanadi", "Pᵦ / Qᵦ nisbati orqali aniqlanadi", "Pᴮₛₘ / Pᵦ nisbati orqali aniqlanadi", "Qᵦ / Pᴮ꜀ₕ nisbati orqali aniqlanadi"], ["Bitta uchastka fronti uzunligi lᵧ = 60 m va uchastkalar soni Nᵤ = 6 bo‘lsa, umumiy front uzunligi (Lₒ) qancha bo‘ladi?", "360 metrga teng bo‘ladi", "420 metrga teng bo‘ladi", "300 metrga teng bo‘ladi", "480 metrga teng bo‘ladi"], ["Pᴮₛₘ = 4800 m³/smena, kₕ = 1,1 va kᴢᴀᴃ = 0,9 bo‘lsa, buldozer bilan bajariladigan ishlar hajmi (Qᵦ) qancha bo‘ladi?", "4752 m³/smenaga teng bo‘ladi", "5280 m³/smenaga teng bo‘ladi", "4320 m³/smenaga teng bo‘ladi", "4950 m³/smenaga teng bo‘ladi"], ["Hozirgi kunda avtomobil transporti yordamida ag‘darma hosil qilishda asosan qaysi mashina qo‘llaniladi?", "Kuchli quvvatga ega buldozerlar qo‘llaniladi", "G‘ildirakli og‘ir skreperlar keng ishlatiladi", "Maxsus zanjirli draglaynlar jalb qilinadi", "Ko‘p cho‘michli ekskavatorlar foydalaniladi"], ["Ag‘darmaning bo‘shatish frontidagi ishchi uchastkada qanday asosiy texnologik jarayon bajariladi?", "Keltirilgan yukni bo‘shatish ishlari olib boriladi", "Yer osti qazilmalarini dastlabki saralash qilinadi", "Kon maydonini loyihalash va geologik o‘lchov o‘tadi", "Mashinalarni rejali ta’mirlash ishlari o‘tkaziladi"], ["Ag‘darmaning bo‘shatish frontidagi rezerv uchastkaning asosiy texnologik vazifasi nima?", "Ishchi uchastkani almashtirish uchun saqlanadi", "Doimiy ravishda ortiqcha yukni saralab to‘kadi", "Buldozerlarga yonilg‘i quyish maydoni hisoblanadi", "Foydali qazilmalarni vaqtincha saqlab boyitadi"], ["Ag‘darmaning loyihalash uchastkasida qanday asosiy ishlar amalga oshiriladi?", "Ag‘darmani shakllantirish va rejalashtirish ishlari", "Yuk tashuvchi og‘ir avtosamosvallarni tozalash ishi", "Faqat kon jinslarini navlarga ajratish faoliyati", "Transport yo‘llarini butunlay demontaj qilish ishi"], ["Buldozer bilan bajariladigan ishlar hajmini aniqlashda qo‘llaniladigan formula qaysi?", "Q_b = P_B^sm · k_H · k_ZAB shaklidagi formula", "Q_b = P_B^ch · T_sm / k_H shaklidagi formula", "Q_b = P_B^sm / (k_H · k_ZAB) formulasi bo‘ladi", "Q_b = P_b · N_u · k_ZAB ko‘rinishidagi ifoda"], ["Texnologik jarayonda bevosita ishdagi buldozerlar soni (N_b) qanday aniqlanadi?", "N_b = Q_b / P_b nisbati orqali hisoblanadi", "N_b = Q_b · P_b ko‘paytmasi orqali topiladi", "N_b = P_b / Q_b bo‘linmasi orqali aniqlanadi", "N_b = Q_b / (1,4 · P_b) ifodasi bilan olinadi"], ["Agar P_B^ch = 600 m³/soat va T_sm = 8 soat bo‘lsa, smenalik unumdorlik (P_B^sm) qanchaga teng bo‘ladi?", "4800 m³/smena hajmiga teng bo‘ladi", "4200 m³/smena hajmiga teng bo‘ladi", "5400 m³/smena hajmiga teng bo‘ladi", "3600 m³/smena hajmiga teng bo‘ladi"]]}, {"name": "Metrologiya va standartlashtirish", "q": [["Metrologiya fani asosan qanday faoliyat sohasi bilan bogʻliq deb taʼriflanadi?", "Oʻlchashlar, oʻlchash birliklari, usullari, vositalari, natija aniqligi va kuzatiluvchanligini ta'minlash bilan.", "Mahsulotlarni ishlab chiqarish jarayonida sifat nazorati va mahsulotlarning xavfsizligini tekshirish bilan.", "Fizik kattaliklarning nazariy asoslarini yaratish va ularning amaliy qoʻllanishini oʻrganish bilan.", "Ishlab chiqarish jarayonlarida energiyani tejash va resurslardan samarali foydalanishni tahlil qilish bilan."], ["Matnda \"o'lchash\" tushunchasi qanday jarayon sifatida taʼriflangan?", "Fizik kattalik qiymatini oʻlchash vositasi va tegishli usul yordamida aniqlash jarayoni.", "Kattaliklarning etalon qiymatlarga nisbatan ogʻishini hisoblash va tasniflash tizimi.", "Amaliyotda ishlatiladigan vositalarni standartlashtirish va ularning to'g'riligini tasdiqlash.", "Ilmiy tadqiqotlar natijasida olingan ma'lumotlarni tahlil qilish va umumlashtirish."], ["Metrologiyaning asosiy tarkibiy qismlaridan biri sifatida qaysi tushuncha keltirilgan?", "Oʻlchash natijalarining aniqligi va metrologik kuzatiluvchanlik.", "Ishlab chiqarish texnologiyalarining doimiy ravishda takomillashtirilishi.", "Mahsulotlarning ekologik xavfsizligini ta'minlash mexanizmlari.", "Ishlab chiqarish jarayonlarida xavfsizlik choralarini nazorat qilish."], ["Oʻlchash birligi qanday qilib ta'riflangan?", "Fizik kattalikning miqdorini taqqoslash uchun qabul qilingan etalon miqdor.", "Oʻlchash vositalarining aniqlik darajasini ifodalovchi universal koeffitsiyent.", "Har bir oʻlchash jarayonida yuzaga keladigan xatolikning statistik qiymati.", "Oʻlchash natijalarini qayta ishlashda qoʻllaniladigan matematik formula."], ["Matnda sanab oʻtilgan oʻlchash usullaridan qaysi biri toʻgʻri berilgan?", "Toʻgʻridan-to'g'ri, bilvosita, taqqoslash, differensial va integral usullar.", "Nazariy, amaliy, eksperimental, matematik va statistik usullar.", "Kvant, lazerli, optik, akustik va mexanik usullar.", "Sistematik, tasodifiy, qo'pol, texnologik va inson omili usullari."], ["Qaysi oʻlchash vositasi oʻlchanayotgan kattalik bilan toʻgʻri juftlikni tashkil etadi?", "Manometr bosimni, termometr haroratni, tarozi esa massani oʻlchaydi.", "Multimetr masofani, ruletka gaz konsentratsiyasini, gaz analizatori esa tokni oʻlchaydi.", "Lazerli o'lchagich haroratni, tarozi bosimni, termometr massani oʻlchaydi.", "Gaz analizatori elektr tokini, manometr massani, termometr masofani oʻlchaydi."], ["Oʻlchash natijasi deb matnda nimaga ta'rif berilgan?", "Oʻlchash jarayonida olingan fizik kattalik qiymati, ma'lum noaniqlik bilan ifodalanadi.", "Oʻlchash vositasining koʻrsatkichlari va uning texnik xususiyatlariga mos keladigan raqam.", "Har qanday oʻlchashda yuzaga keladigan xatoliklarning umumiy miqdori.", "Oʻlchash birliklari tizimida qabul qilingan etalonning qiymati."], ["Matnda koʻrsatilgan xatoliklarning uch asosiy turi qaysilar?", "Sistematik xatolik, tasodifiy xatolik va qo'pol xatolik.", "Texnik xatolik, uslubiy xatolik va dasturiy xatolik.", "Asbobiy xatolik, insoniy xatolik va muhitiy xatolik.", "Dinamik xatolik, statik xatolik va progressiv xatolik."], ["Kalibrlash jarayoni matnda qanday ta'riflangan?", "Oʻlchash vositasining koʻrsatishlari va etalon qiymatlar bog'liqligini aniqlash jarayoni.", "Oʻlchash vositasining belgilangan talablarga muvofiqligini tasdiqlash jarayoni.", "Fizik kattaliklarning qiymatini aniqlash uchun ishlatiladigan usullar yigʻindisi.", "Oʻlchash natijalarini statistik tahlil qilish va ularni hujjatlashtirish amali."], ["Tekshirish (verifikatsiya) nima degani?", "Oʻlchash vositasining belgilangan talablarga muvofiqligini aniqlash va yaroqliligini tasdiqlash.", "Oʻlchash vositasining koʻrsatkichlarini etalon qiymatlarga solishtirish va hujjatlashtirish.", "Oʻlchash natijalarini qayta ishlashda statistik usullardan foydalanish texnikasi.", "Oʻlchash jarayonida yuzaga kelgan xatoliklarni hisoblash va ularni kamaytirish usuli."], ["Oʻlchash usulini tanlashda qaysi omillar hisobga olinishi lozimligi ta'kidlangan?", "Oʻlchanayotgan kattalikning xususiyatlari, aniqlik darajasi va iqtisodiy samaradorlik.", "Oʻlchash vositasining ishlab chiqarilgan sanasi va kafolat muddati.", "Oʻlchovni bajaruvchi xodimning tajribasi va malaka darajasi.", "Oʻlchashni amalga oshirish joyining geografik joylashuvi va iqlimi."], ["Standartlashtirish faoliyati qanday ta'riflangan?", "Takroran qoʻllaniladigan masalalar boʻyicha qoidalar, talablar va xususiyatlarni ishlab chiqish.", "Mahsulotlarning sifatini baholash va ularning belgilangan talablarga muvofiqligini tasdiqlash.", "Oʻlchash vositalarining aniqligini doimiy ravishda ta'minlash va nazorat qilish tizimi.", "Ishlab chiqarish jarayonlarida xavfsizlik choralarini joriy etish va ularga rioya qilish."], ["Metrologiyaning asosiy tarkibiy qismlari qaysilaridan iborat?", "Fizik kattaliklarni oʻlchash, oʻlchash birliklari, oʻlchash usullari va natijalarning aniqligi hamda kuzatiluvchanlik.", "Texnik reglamentlar, sertifikatlash tartiblari va mahsulot sifati boʻyicha xalqaro kelishuvlar.", "Ilmiy-tadqiqot ishlari, konstruktorlik loyihalar va ularni amaliyotga tatbiq etish usullari.", "Ishlab chiqarish jarayonlarini avtomatlashtirish, sifat nazorati va resurslarni tejash mexanizmlari."], ["O'lchash tushunchasining aniq ta'rifi qaysi javobda keltirilgan?", "Fizik kattalik qiymatini oʻlchash vositasi va tegishli usul yordamida aniqlash jarayonidir.", "Ma'lum bir obyektning xususiyatlarini nazariy jihatdan o'rganish va ularning modelini yaratishdir.", "Texnologik jarayonlarni optimallashtirish uchun dasturiy ta'minotni ishlab chiqish faoliyatidir.", "Standartlashtirishga oid talablarni belgilash va ularga rioya etilishini ta'minlash yo'nalishidir."], ["Quyidagi misollarning qaysi biri oʻlchashning amaliy holatiga mos kelmaydi?", "Xavfsizlik qoidalarini ishlab chiqish va ularga rioya etilishini ta'minlash jarayoni.", "Bosimni manometr bilan aniqlash va haroratni termometr bilan oʻlchash faoliyati.", "Tok kuchi va kuchlanishni elektr oʻlchash vositalari yordamida belgilash.", "Masofani ruletka yoki lazerli oʻlchagich bilan aniqlash kabi amaliyot."], ["Oʻlchash birligi deb nimaga aytiladi?", "Fizik kattalikning miqdorini taqqoslash uchun qabul qilingan etalon miqdordir.", "O'lchash jarayonida foydalaniladigan har qanday texnik vositaning xususiyatidir.", "Ma'lum bir ob'ektning hajmini aniqlash uchun ishlatiladigan matematik formuladir.", "Sifatni baholashda qoʻllaniladigan standart qiymat va uning ruxsat etilgan ogʻishidir."], ["Konchilikda gaz konsentratsiyasi qaysi birliklarda ifodalanishi mumkin?", "Foiz (%) yoki ppm (parts per million) kabi birliklarda ifodalanishi mumkin.", "Metr (m) yoki kilometr (km) kabi uzunlik birliklarida ifodalanadi.", "Amper (A) yoki volt (V) kabi elektr kattaliklarining birliklarida.", "Kilogramm (kg) yoki tonna (t) kabi massa birliklarida ifodalanadi."], ["Bilvosita oʻlchash usuliga qaysi misol mos keladi?", "Zichlikning massa va hajm orqali hisoblanishi usuli bilvosita o'lchashga misoldir.", "Haroratning termometr yordamida to'g'ridan-to'g'ri ko'rsatkichlar orqali aniqlanishi.", "Bosimning manometr shkalasi bo'yicha bevosita qiymatini o'qish jarayoni.", "Masofani lazerli o'lchagich orqali aniqlash va uning natijasini qayd etish."], ["Oʻlchash vositalari qoʻllanish sohasiga koʻra qanday turlarga bo'linadi?", "Laboratoriya, sanoat, konchilik, atrof-muhit monitoringi, nazorat va sinov vositalari.", "Faqatgina analog va raqamli koʻrsatish usullari boʻyicha ajratilgan mexanizmlar to'plami.", "Asosan elektr, optik va mexanik prinsiplarda ishlaydigan turli xil asboblar tizimi.", "Masofa, harorat va bosim kabi ma'lum kattaliklarni oʻlchashga ixtisoslashgan uskunalar."], ["Oʻlchash natijasi deb nimaga aytiladi?", "O'lchash jarayonida olingan fizik kattalik qiymati boʻlib, ma'lum noaniqlik bilan ifodalanadi.", "Oʻlchov vositasining texnik pasportida koʻrsatilgan maksimal ruxsat etilgan xatolik.", "Standartlashtirish talablariga muvofiqligini tasdiqlovchi rasmiy sertifikat.", "Ishlab chiqarish jarayonining samaradorligini baholash uchun ishlatiladigan iqtisodiy ko'rsatkich."], ["Absolyut xatolik qaysi formula orqali ifodalanadi?", "∆X = X_oʻlchangan - X_haqiqiy formulasi bilan ifodalanadi.", "∆X = (X_oʻlchangan / X_haqiqiy) * 100% formulasi orqali hisoblanadi.", "∆X = √(Σ(Xᵢ - X̄)² / n) matematik ifodasi bilan belgilanadi.", "∆X = F * m * a / t kabi fizik kattaliklar munosabati orqali topiladi."], ["Oʻlchash xatoliklarini kamaytirish uchun qanday chora-tadbirlar tavsiya etiladi?", "Oʻlchash vositalarini muntazam kalibrlash, tashqi muhitni nazorat qilish va oʻlchashlarni takrorlash.", "Faqat eng qimmat va zamonaviy oʻlchash asboblaridan foydalanishni qat'iy talab qilish.", "Standartlarni toʻliq e'tiborsiz qoldirib, faqat amaliy tajribaga asoslanib ish ko'rish.", "Oʻlchash jarayonini toʻliq avtomatlashtirish, inson aralashuvini mutlaqo cheklash."], ["Oʻlchash natijalarini qayta ishlashning asosiy maqsadi nimadan iborat?", "Olingan natijalarni tahlil qilish, xatoliklarni baholash va ishonchli natijani aniqlashdir.", "Yangi o'lchash vositalarini ishlab chiqish uchun texnik talablarni shakllantirish.", "Standartlarni qayta ko'rib chiqish va ularga o'zgartirishlar kiritish jarayonini boshqarish.", "Konchilik sanoatida ishlab chiqarish samaradorligini oshirish bo'yicha strategiyalarni belgilash."], ["Kalibrlash jarayonining ta'rifi qaysi javobda eng aniq berilgan?", "Oʻlchash vositasining koʻrsatishlari va ma'lum etalon qiymatlar oʻrtasidagi bog'liqlikni aniqlash jarayonidir.", "Oʻlchash vositasining belgilangan talablarga muvofiqligini tasdiqlash uchun o'tkaziladigan sinov.", "Maxsus sertifikatlar berish orqali mahsulot sifatini kafolatlash tizimining muhim qismidir.", "Ishlab chiqarish jarayonida xavfsizlikni ta'minlashga qaratilgan majburiy tekshiruvlar."], ["Metrologik kuzatiluvchanlikning asosiy xususiyati nimadan iborat?", "O'lchash natijalarining uzluksiz taqqoslash zanjiri orqali milliy yoki xalqaro etalonlarga bog'liqligini ta'minlash.", "Oʻlchash jarayonida faqatgina eng yuqori aniqlikdagi asboblardan foydalanishni talab qilish mexanizmi.", "Standartlashtirish va sertifikatlashtirish jarayonlarini umumiy qoidalarga muvofiq ravishda tashkil etish.", "Ishlab chiqarish mahsulotlarining sifati va xavfsizligini ta'minlashga qaratilgan huquqiy me'yorlar."], ["Standartlashtirish nima va uning asosiy maqsadi qaysi javobda keltirilgan?", "Takroran va koʻp martalik qoʻllaniladigan masalalar boʻyicha qoidalar ishlab chiqish hamda sifatni ta'minlash faoliyatidir.", "Faqatgina oʻlchash vositalarining aniqligini tekshirish va ularga sertifikat berish jarayonidir.", "Mahsulotning narxini pasaytirish va bozorlardagi raqobatbardoshligini oshirishga qaratilgan harakatdir.", "Ilmiy-tadqiqot ishlarini muvofiqlashtirish va yangi texnologiyalarni amaliyotga joriy etish usuli."], ["Mazkur ma'ruzaning asosiy maqsadi O'zbekiston Respublikasidagi qaysi sohalarning qonunchilik asoslarini tushuntirishdan iborat?", "Metrologiya, standartlashtirish va mahsulotlarning muvofiqligini baholash sohalari qamrab olingan.", "Faqat metrologiya va oʻlchash vositalarining ishonchliligini ta'minlash jihatlari muhokama qilingan.", "Asosan standartlashtirish tamoyillari va ularning iqtisodiy ahamiyati koʻrib chiqilgan.", "Mahsulotlar va xizmatlarni sertifikatlashtirishning texnik reglamentlari asosiy mavzudir."], ["1993-yil 28-dekabrda qabul qilingan \"Metrologiya toʻgʻrisida\"gi Qonunning asosiy maqsadi nimadan iborat?", "Metrologiya sohasidagi faoliyat munosabatlarini tartibga solishni ta'minlash asosiy maqsadidir.", "Faqat mahsulotlar va xizmatlarning sertifikatlashtirish jarayonlarini nazorat qilish.", "Texnik reglamentlar boʻyicha majburiy talablarni belgilashga qaratilgan harakat.", "Barcha turdagi oʻlchash vositalarining xalqaro standartlarga mosligini tekshirish."], ["Metrologiya sohasidagi \"O'lchash\" tushunchasining matndagi aniq ta'rifi qaysi javobda keltirilgan?", "Kattalikning qiymatini tajriba yoʻli bilan aniqlash jarayoni deb ta'riflanadi, bu jarayon muhimdir.", "Belgilangan talablarga mahsulotning muvofiqligini tasdiqlovchi hujjatni rasmiylashtirish.", "Oʻlchash vositasining metrologik talablarga mosligini aniqlashga qaratilgan ish.", "Mahsulot sifati va xavfsizligini ta'minlash uchun qoidalar belgilash faoliyati."], ["Metrologiya sohasida \"O'lchash vositasi\" atamasi matnda qanday izohlanadi?", "Bu o'lchashlarni amalga oshirish uchun mo'ljallangan texnik vosita sifatida tushuniladi.", "Bu mahsulotning xavfsizlik talablariga muvofiqligini aniqlovchi texnik jihatdan tartibga solish.", "Bu metrologiya faoliyatining asosiy tamoyillarini oʻz ichiga oluvchi normativ hujjat.", "Bu oʻlchash natijalarining ishonchliligini ta'minlashga qaratilgan nazorat mexanizmi."], ["Matn boʻyicha \"Oʻlchashlarning yagona birlikda boʻlishi\" deganda nimani tushunish kerak?", "Oʻlchash natijalarini belgilangan birliklarda ifodalash hamda ularni taqqoslanuvchanligini ta'minlash.", "O'lchash vositalarining belgilangan standartlarga muvofiqligini tasdiqlovchi faoliyatni.", "Metrologiya sohasidagi huquqiy bazani yangilash jarayonlarini amalga oshirish holati.", "Texnik jihatdan tartibga solish talablariga muvofiq mahsulotlarni sinovdan oʻtkazish."], ["Metrologiya sohasidagi talablarning bajarilishini nazorat qilish bilan bog'liq davlat vakolatlarini amalga oshirish shakllari nimalardan iborat?", "Metrologiya tekshiruvi va davlat metrologiya nazorati asosiy shakllar hisoblanadi.", "Faqat oʻlchash vositalariga muvofiqlik deklaratsiyasini rasmiylashtirish shaklida.", "Faqat mahsulotlarning sifatini tekshirish bo'yicha mustaqil laboratoriya sinovlari.", "Xususiy sektor tomonidan koʻrsatiladigan metrologiya xizmatlarining kengaytirilishi."], ["2023-yildagi OʻRQ-872-sonli Qonun metrologiya xizmatlari sohasiga qanday muhim oʻzgarishlar kiritgan?", "Xususiy sektor ishtirokini kengaytirishga qaratilgan oʻzgarishlar joriy etilgan.", "Davlat metrologiya nazoratining barcha funksiyalarini xususiylashtirishni belgilagan.", "Faqat xalqaro standartlarga mos keladigan oʻlchash vositalaridan foydalanishni talab qilgan.", "Mahsulotlarni majburiy sertifikatlashtirish roʻyxatini toʻliq bekor qilgan qoida."], ["Metrologiyaning amaliy ahamiyati ishlab chiqarish jarayonlarida qanday namoyon bo'ladi?", "Xomashyo miqdorini aniqlash, texnologik jarayonlarni boshqarish kabi amaliyotlarda.", "Faqat tayyor mahsulotlarning estetik koʻrinishini baholashda asosiy rol oʻynaydi.", "Asosan marketing strategiyalarini ishlab chiqish va bozor tahlilini amalga oshirishda.", "Yangi texnik reglamentlarni joriy etish uchun huquqiy asoslar yaratishda yordam beradi."], ["Standartlashtirishning asosiy tamoyillaridan biri matnda qaysi xususiyat bilan belgilangan?", "Manfaatdor tomonlarning ishtiroki va kelishuvga intilishni ta'minlash muhim tamoyildir.", "Faqat milliy ishlab chiqaruvchilarning manfaatlarini ustuvor hisobga olishni belgilaydi.", "Standartlarni har doim oʻzgarmas qilib saqlash va ularni yangilamaslikni kafolatlaydi.", "Barcha standartlashtirish jarayonlarini yashirin va sir saqlashni nazarda tutadi bu tamoyil."], ["Standart va texnik reglament oʻrtasidagi asosiy farq matnda qanday tushuntirilgan?", "Standartlar ko'pincha ixtiyoriy, reglamentlar esa mahsulot xavfsizligi bo'yicha majburiydir.", "Standartlar faqat xalqaro miqyosda qo'llaniladi, texnik reglamentlar milliy darajadadir.", "Texnik reglamentlar mahsulot sifati, standartlar esa faqat xizmatlarga tegishlidir.", "Standartlar davlat tomonidan tasdiqlanadi, reglamentlar esa xususiy tashkilotlar tomonidan."], ["Muvofiqlikni baholash tushunchasi matnda qanday ta'riflangan?", "Obyektning belgilangan talablarga muvofiqligini aniqlashga qaratilgan faoliyat majmui.", "Faqat yangi texnologiyalarni yaratish va ularni patentlash jarayonlarini oʻz ichiga oladi.", "Mahsulotning narxini belgilash va bozor talabini tahlil qilishga qaratilgan ishlar tizimi.", "Metrologiya xizmatlarining samaradorligini oshirish boʻyicha tashkiliy choralar kompleksi."], ["Muvofiqlikni baholash doirasida qaysi jarayonlar ishtirok etishi mumkinligi matnda sanab o'tilgan?", "Muvofiqlikni tasdiqlash, sertifikatlashtirish, deklaratsiyalash, sinash va akkreditatsiya.", "Marketing tadqiqotlari, tovar belgisini roʻyxatdan oʻtkazish va intellektual mulkni himoyalash.", "Ishlab chiqarish quvvatlarini kengaytirish, xomashyo yetkazib beruvchilarni tanlash va nazorat.", "Ishchi xodimlar malakasini oshirish, kadrlar siyosatini boshqarish va mehnat xavfsizligi."], ["Sertifikatlashtirishning umumiy mantiqiy ketma-ketligida birinchi qadam nimalardan iborat?", "Muvofiqlikni baholash obyekti va unga qo'llaniladigan talablarni aniqlash birinchi qadamdir.", "Mahsulotni sinovdan oʻtkazish uchun zarur namunalarni tanlash va laboratoriyaga yuborish.", "Muvofiqlik deklaratsiyasini rasmiylashtirish va keyingi davriy baholashni rejalashtirish.", "Ariza berish va muvofiqlikni baholash organini tanlashdan oldin barcha hujjatlarni yigʻish."], ["Metrologiya, standartlashtirish va muvofiqlikni baholash sohalari o'rtasidagi bog'liqlik matnda qanday izohlangan?", "Ular bir-biridan alohida boʻlmagan, oʻzaro bog'langan yoʻnalishlardir.", "Ular mustaqil ravishda ishlaydigan, bir-biriga ta'sir qilmaydigan tizimlardir.", "Faqat metrologiya standartlashtirishga bog'liq, qolganlari esa mustaqil holda.", "Bog'liqlik faqat mahsulotning yakuniy sertifikatlashtirish bosqichida namoyon boʻladi."], ["Mazkur ma'ruzaning asosiy maqsadi Oʻzbekiston Respublikasida metrologiya, standartlashtirish va mahsulotlarning belgilangan talablarga muvofiqligini baholash bilan bogʻliq qonunchilikni tushuntirishdan iborat. Ushbu ma'ruzaning asosiy maqsadi nimadan iborat?", "Metrologiya, standartlashtirish va muvofiqlikni baholashga oid asosiy qonunchilikni tushuntirishdan iborat.", "Oʻzbekistonda metrologiya xizmatlarining tarixiy rivojlanishini batafsil tahlil qilishdan iborat.", "Mahsulotlarni sertifikatlashtirish uchun texnik spetsifikatsiyalarni aniq belgilashdan iborat.", "Xalqaro va milliy standartlar oʻrtasidagi farqlarni aniq belgilashdan iborat."], ["Oʻzbekiston Respublikasining \"Metrologiya toʻgʻrisida\"gi Qonuni dastlab qaysi sanada qabul qilingan va keyinchalik qaysi hujjatlar bilan oʻzgartirishlar kiritilgan?", "1993-yil 28-dekabrda, 1004-XII-son bilan, keyingi 2020 va 2023-yildagi oʻzgartirishlar bilan.", "2022-yil 3-noyabrda, OʻRQ-800-son bilan, toʻliq yangi tahrirda qayta qabul qilingan hujjat.", "2023-yil 27-fevralda, OʻRQ-819-son bilan, texnik reglamentlar asosida amal qiluvchi qonun.", "2013-yil 4-oktabrda, OʻRQ-354-son bilan, muvofiqlikni baholashga oid asosiy qonun sifatida."], ["Hozirgi kunda amalda boʻlgan \"Standartlashtirish toʻgʻrisida\"gi Oʻzbekiston Respublikasi Qonuni (OʻRQ-800-son) qaysi sanadan boshlab kuchga kirgan?", "2023-yil 5-noyabrda, 2022-yil 3-noyabrda qabul qilingan OʻRQ-800-son asosida.", "1993-yil 28-dekabrda, 1002-XII-son bilan, va 2023-yilda kuchini yoʻqotgan qonun.", "2023-yil 29-avgustda, 2023-yil 27-fevralda qabul qilingan OʻRQ-819-son bilan.", "2013-yil 4-oktabrda, OʻRQ-354-son bilan, va 2023-yilda oʻz kuchini yoʻqotgan."], ["Matnda keltirilgan ma'lumotlarga koʻra, \"Muvofiqlikni baholash toʻgʻrisida\"gi 2013-yil 4-oktabrdagi OʻRQ-354-son Qonuni qaysi sanadan boshlab oʻz kuchini yoʻqotgan?", "2023-yil 29-avgustdan boshlab, \"Texnik jihatdan tartibga solish toʻgʻrisida\"gi Qonun kuchga kirishi bilan.", "2023-yil 5-noyabrdan boshlab, yangi \"Standartlashtirish toʻgʻrisida\"gi Qonun kuchga kirishi bilan.", "2020-yildagi OʻRQ-614-son bilan, Metrologiya Qonuniga kiritilgan oʻzgartirishlar doirasida.", "1993-yil 28-dekabrdan boshlab, \"Mahsulotlar va xizmatlarni sertifikatlashtirish toʻgʻrisida\"gi Qonun."], ["Metrologiya sohasidagi asosiy tushunchalardan biri boʻlgan \"O'lchash\" atamasi nimani anglatadi?", "Kattalikning qiymatini tajriba yoʻli bilan aniqlash jarayonini ifodalaydi.", "Oʻlchash vositasining belgilangan talablarga muvofiqligini tekshirish jarayoni.", "Oʻlchash natijalarini yagona birlikda ifodalashni ta'minlash holatini.", "Davlat metrologiya nazoratini amalga oshirish shakllaridan biridir."], ["\"O'lchash vositasi\" deganda metrologiyada qanday texnik vosita tushuniladi?", "Oʻlchashlarni amalga oshirish uchun maxsus moʻljallangan texnik vosita.", "Kattalik qiymatini empirik usulda aniqlash faoliyati bilan bogʻliq jarayon.", "Oʻlchash natijalarining ishonchliligini ta'minlovchi yagona xizmat turi.", "Metrologik talablarga rioya etishni nazorat qiluvchi barcha jarayonlar majmui."], ["Standartlashtirishning asosiy tamoyillaridan biri sifatida matnda qanday jihat koʻrsatilgan?", "Manfaatdor tomonlarning ishtiroki va kelishuvga intilishni ta'minlashga qaratilganlik.", "Faqat milliy standartlarni ishlab chiqish va ulardan qat'iy foydalanish zaruriyati.", "Oʻlchash natijalarining yagona birligini ta'minlashga qaratilgan asosiy yoʻnalish.", "Texnik reglamentlarning ixtiyoriy qoʻllash uchun asos boʻlishi zaruriyati."], ["\"Muvofiqlikni baholash\" tushunchasi matnda qanday faoliyatlar majmui sifatida belgilangan?", "Mahsulot, xizmat, jarayon, menejment tizimi yoki boshqa obyektning belgilangan talablarga muvofiqligini aniqlashga qaratilgan faoliyatlar majmui.", "Oʻlchash natijalarining ishonchliligini va taqqoslanuvchanligini ta'minlash jarayoni.", "Metrologik xizmatlarning xususiy sektor ishtirokini kengaytirishga qaratilgan oʻzgarishlar majmui.", "Texnik jihatdan tartibga solish sohasida yangi huquqiy bazani qoʻllash usuli."], ["Muvofiqlikni baholash doirasida qaysi jarayonlar ishtirok etishi mumkinligi matnda aniq koʻrsatilgan?", "Muvofiqlikni tasdiqlash, sertifikatlashtirish, muvofiqlikni deklaratsiyalash, sinash va akkreditatsiya.", "Faqatgina oʻlchash vositalarini qiyoslash va ularni davlat metrologiya nazorati qilish.", "Xomashyo miqdorini aniqlash, texnologik jarayonlarni boshqarish va tijorat hisob-kitoblarini amalga oshirish.", "Standartlarning ilmiy-texnik taraqqiyotga mos ravishda doimiy takomillashtirib borilishi."], ["Metrologiya, standartlashtirish va muvofiqlikni baholash oʻrtasidagi oʻzaro bogʻliqlik matnda qanday tushuntirilgan?", "Uchala yoʻnalish bir-biridan alohida boʻlmagan, oʻzaro bog'langan boʻlib, mahsulot sifati va xavfsizligini ta'minlashda bir-birini to'ldiradi.", "Uchala yoʻnalish bir-biriga bogʻliq emas, har biri alohida tartibga solinadi va mustaqil ishlaydi.", "Metrologiya faqat oʻlchashlarni ta'minlaydi, standartlashtirish esa faqat texnik talablarni belgilaydi.", "Uchala soha ham faqat davlat nazorati ostida boʻlib, xususiy sektor ishtirokiga yoʻl qoʻyilmaydi."], ["Hozirgi kunda \"Mahsulotlar va xizmatlarni sertifikatlashtirish toʻgʻrisida\"gi qonun amalda emasligini hisobga olsak, sertifikatlashtirish qaysi yangi qonun doirasida amalga oshiriladi?", "2023-yil 27-fevraldagi OʻRQ-819-son \"Texnik jihatdan tartibga solish toʻgʻrisida\"gi Oʻzbekiston Respublikasi Qonuni.", "1993-yil 28-dekabrdagi 1004-XII-son \"Metrologiya toʻgʻrisida\"gi Oʻzbekiston Respublikasi Qonuni.", "2022-yil 3-noyabrdagi OʻRQ-800-son \"Standartlashtirish toʻgʻrisida\"gi Oʻzbekiston Respublikasi Qonuni.", "2013-yil 4-oktabrdagi OʻRQ-354-son \"Muvofiqlikni baholash toʻgʻrisida\"gi Qonun."], ["Yangi tahrirdagi \"Standartlashtirish toʻgʻrisida\"gi Qonun OʻRQ-800-son qaysi sanada qabul qilinganligi matnda koʻrsatilgan?", "2022-yil 3-noyabrda qabul qilingan va 2023-yil 5-noyabrdan kuchga kirgan.", "1993-yil 28-dekabrda qabul qilingan va 2023-yilda oʻz kuchini yoʻqotgan.", "2023-yil 27-fevralda qabul qilingan va 2023-yil 29-avgustdan kuchga kirgan.", "2013-yil 4-oktabrda qabul qilingan va 2023-yil 29-avgustdan oʻz kuchini yoʻqotgan."], ["Qaysi qonun 2023-yil 29-avgustdan oʻz kuchini yoʻqotgan \"Muvofiqlikni baholash toʻgʻrisida\"gi Qonunning oʻrnini egalladi?", "2023-yil 27-fevraldagi OʻRQ-819-son \"Texnik jihatdan tartibga solish toʻgʻrisida\"gi Qonun.", "2022-yil 3-noyabrdagi OʻRQ-800-son \"Standartlashtirish toʻgʻrisida\"gi Qonun.", "1993-yil 28-dekabrdagi 1004-XII-son \"Metrologiya toʻgʻrisida\"gi Qonun.", "1993-yil 28-dekabrdagi 1006-XII-son \"Mahsulotlar va xizmatlarni sertifikatlashtirish toʻgʻrisida\"gi Qonun."], ["Metrologiya tushunchasining asosiy va eng umumiy ta'rifi qaysi javobda toʻgʻri ifodalangan?", "Oʻlchashlar, ularning yagona birlikda boʻlishini ta'minlash usullari va vositalari hamda aniqlikka erishish yoʻllari haqidagi fandir.", "Fizik kattaliklarni tajriba yoʻli bilan aniqlash jarayoni hamda ularning oʻzaro bogʻliqligini oʻrganuvchi soha hisoblanadi.", "Oʻlchash natijalarining ishonchliligini, xolisligini va solishtiriladigan boʻlishini ta'minlovchi xizmatdir.", "Asosiy o'lchash vositalarining metrologik tavsiflarini aniqlash va ularning ishlatilishini belgilashdir."], ["Metrologiyaning asosiy mazmunini tushunish uchun qaysi uchta oʻzaro bogʻliq masala muhim ahamiyatga ega?", "Kattaliklarni oʻlchash, natijalarning yagona birlikda ifodalanishi va aniqlikka erishish.", "O'lchash obyekti, oʻlchash vositasi va oʻlchash uslubiyotining optimal tanlovini ta'minlash.", "Standartlashtirish tizimini rivojlantirish, sifat menejmentini joriy etish hamda xavfsizlikni ta'minlash.", "Metrologiya qonunchiligini takomillashtirish, xalqaro etalonlar bilan moslashishni hisobga olish."], ["Oʻzbekiston Respublikasining \"Metrologiya toʻgʻrisida”gi Qonunining amaldagi yangi tahriri qaysi sanada qabul qilingan?", "2020-yil 7-apreldagi OʻRQ-614-son Qonun bilan.", "1993-yil 28-dekabrdagi 1004-XII-son Qonun bilan.", "2023-yil 26-oktabrdagi OʻRQ-872-son Qonun bilan.", "2017-yil 12-maydagi OʻRQ-434-son Qonun bilan."], ["\"Oʻlchashlarning yagona birligi\" deganda metrologiyada qanday holat tushuniladi?", "Oʻlchash natijalari qonunlashtirilgan birliklarda aks etgan va xatoliklari berilgan ehtimollikda ma'lum bo'lgan holat.", "Turli oʻlchash vositalaridan foydalanganda ham natijalar bir xil boʻlishini ta'minlovchi tizimning doimiy holati.", "Milliy va xalqaro etalonlar asosida barcha oʻlchash natijalarining bir-biriga bogʻliqligini ta'minlash jarayoni.", "O'lchash natijalarini turli sohalarda qoʻllash uchun zarur boʻlgan standartlar va me'yorlar majmuining mavjudligi."], ["Metrologiyada \"Oʻlchash vositasi\" tushunchasi qanday aniq ta'riflanadi?", "Oʻlchashlar uchun foydalaniladigan va normallangan metrologik xususiyatlarga ega boʻlgan texnika vositasidir.", "Fizik kattaliklarning qiymatini aniqlashga xizmat qiluvchi har qanday asbob-uskuna yoki qurilmaning umumiy nomi.", "Oʻlchash natijalarini toʻgʻri qayta ishlash va ularning ishonchliligini ta'minlashga moʻljallangan tizimli vosita.", "Kattalik birliklarini saqlash va ularni boshqa o'lchash vositalariga uzatishga yordam beradigan texnik qurilma."], ["\"Birlik etaloni\"ning metrologiyadagi asosiy vazifasi qaysi javobda toʻliq ifodalangan?", "Fizik kattalik birligini boshqa o'lchash vositalariga oʻtkazish maqsadida uni qayta hosil qilish va saqlash.", "Oʻlchash vositasining belgilangan talablarga muvofiqligini aniqlash va uni tasdiqlash jarayonini amalga oshirish.", "Oʻlchash vositasining metrologik tavsiflarining haqiqiy qiymatlarini aniqlashni ta'minlash.", "Har qanday oʻlchash natijasining nomukammallik darajasini kamaytirishga xizmat qiladigan texnik qurilma."], ["Oʻzbekiston Respublikasida \"Davlat etaloni\" qanday tartibda tan olinadi?", "Vakolat berilgan milliy organning qarori bilan oʻlchash birligining oʻlchami sifatida e'tirof etilgan etalon.", "Xalqaro metrologiya tashkilotlarining tavsiyasiga asosan tasdiqlangan va qoʻllaniladigan etalon.", "Faqatgina ilmiy-tadqiqot institutlari tomonidan ishlab chiqilgan va sinovdan oʻtkazilgan asosiy etalon.", "Yuqori aniqlikka ega boʻlgan va boshqa etalonlarga nisbatan ustunlikka ega boʻlgan har qanday oʻlchash vositasi."], ["Xalqaro birliklar tizimi (SI) boʻyicha modda miqdorining asosiy birligi qaysi biri hisoblanadi?", "Mol (mol).", "Kilogramm (kg).", "Kandela (cd).", "Amper (A)."], ["Xalqaro birliklar tizimi (SI) boʻyicha termodinamik haroratning asosiy birligi qaysi javobda toʻgʻri koʻrsatilgan?", "Kelvin (K).", "Sekund (s).", "Metr (m).", "Amper (A)."], ["Metrologiyada \"Oʻlchash\" tushunchasi qanday aniqlanadi va uning natijasi nimadan iborat bo'ladi?", "Fizik kattalik qiymatini tajriba yoʻli bilan aniqlash jarayoni boʻlib, natija sonli qiymat va birlik orqali ifodalanadi.", "Texnik vositalar yordamida obyektning xususiyatlarini nazorat qilish hamda ularning oʻzgarishini qayd etish.", "Berilgan talablarga muvofiqligini aniqlash maqsadida oʻlchash vositalarining xususiyatlarini tekshirish.", "Natijalarning ishonchli boʻlishini ta'minlash uchun xatoliklarni kamaytirishga qaratilgan faoliyat."], ["Oʻlchash natijasi metrologiyada odatda qaysi ikki asosiy komponentdan tashkil topadi?", "Sonli qiymat va oʻlchash birligidan.", "Oʻlchash vositasining turi va uning aniqligidan.", "Oʻlchash uslubiyoti va oʻtkazish sharoitlaridan.", "Xatolik darajasi va ishonchliligi koʻrsatkichlaridan."], ["Metrologiyada \"Oʻlchash vositalarini qiyoslash\" nima degan ma'noni anglatadi?", "Oʻlchash vositasining belgilangan talablarga muvofiqligini aniqlash va tasdiqlash.", "Oʻlchash vositasining metrologik tavsiflarining haqiqiy qiymatlarini belgilash jarayoni.", "Turli oʻlchash vositalarining bir-biriga nisbatan aniqlik darajasini solishtirish faoliyati.", "O'lchash vositasining texnik holatini muntazam ravishda tekshirib borish va sozlash."], ["Metrologiyada \"Oʻlchash vositalarini kalibrlash\" tushunchasi nimani anglatadi?", "Oʻlchash vositasining metrologik tavsiflarining haqiqiy qiymatlarini aniqlash va foydalanishga yaroqliligini tasdiqlash.", "Oʻlchash vositasining amaldagi qonunchilik talablariga mos kelishini baholash va rasmiylashtirish.", "Oʻlchash vositasini xalqaro etalonlar bilan taqqoslab, uning aniqligini oshirishga qaratilgan jarayon.", "O'lchash vositasining xatoliklarini toʻgʻrilash va uning ish faoliyatini optimallashtirish boʻyicha tadbirlar majmui."], ["\"Oʻlchash vositasining belgilangan talablarga muvofiqligini aniqlash va tasdiqlash\" jumlasini ta'riflovchi metrologik tushuncha qaysi?", "Qiyoslash.", "Kalibrlash.", "Etalonlashtirish.", "Metrologik tekshiruv."], ["\"Metrologik kuzatiluvchanlik\" deganda metrologiyada nimani tushuniladi?", "Oʻlchash natijasining hujjatlashtirilgan, uzluksiz kalibrlash/qiyoslash zanjiri orqali tegishli etalonga bog'lanishi.", "Oʻlchash vositasining aniqligini boshqa etalonlar yordamida doimiy ravishda tekshirib borish tizimi.", "Turli laboratoriyalardagi oʻlchash natijalarining bir-biriga mos kelishini ta'minlash uchun umumiy standartlar yaratish.", "O'lchash jarayonining har bir bosqichini hujjatlashtirish va uni doimiy nazorat qilish faoliyati."], ["Oʻlchash jarayoniga ta'sir etuvchi asosiy omillar qatoriga qaysilar kiradi?", "Oʻlchash obyekti, vositasi, usuli, operator va atrof-muhit sharoitlari.", "Faqatgina o'lchash vositasining aniqligi va operatorning malakasi.", "Natijalarni qayta ishlash dasturiy ta'minoti va ma'lumotlar bazasi.", "Metrologiya xizmatining samaradorligi va qonunchilikning qat'iyligi."], ["Metrologiyada \"oʻlchash xatoligi\" tushunchasi nimani ifodalaydi va u qanday turlarga bo'linadi?", "Oʻlchash natijasi bilan haqiqiy qiymat oʻrtasidagi farqni ifodalaydi, sistematik va tasodifiy turlari mavjud.", "Oʻlchash jarayonida yuzaga keladigan nazorat qilib boʻlmaydigan tasodifiy oʻzgarishlarni tushuntiradi, faqat tasodifiy turga bo'linadi.", "Oʻlchash vositalarining eskirishi yoki notoʻgʻri sozlanishi natijasida yuzaga keladigan doimiy chetlanishlarni aks ettiradi, faqat sistematik turga bo'linadi.", "O'lchash uslubiyotidagi kamchiliklarni bartaraf etishga qaratilgan harakatlar majmuini tavsiflaydi, doimiy va vaqtinchalik turlarga bo'linadi."], ["\"Sistematik xatolik\"ning asosiy xususiyati qaysi javobda toʻgʻri tasvirlangan?", "Bir xil sharoitlarda takroriy oʻlchashlarda ma'lum qonuniyat bilan namoyon boʻlishi.", "Takroriy oʻlchash natijalarining tasodifiy tarqalishiga sabab boʻlishi.", "Oʻlchash vositasining nosozligi tufayli bir martalik chetlanishni keltirib chiqarishi.", "Operatorning tajribasizligi yoki e'tiborsizligi natijasida yuzaga keladigan xatolik."], ["\"Oʻlchash noaniqligi\" metrologiyada nimani tavsiflaydi va uni baholashda nimalar hisobga olinadi?", "Oʻlchash natijasiga berilgan qiymatlar tarqalishini tavsiflaydi; vosita, kalibrlash ma'lumotlari, sharoitlar hisobga olinadi.", "Oʻlchash jarayonida yuzaga keladigan doimiy xatoliklarni aniqlashni bildiradi; faqatgina vositaning texnik parametrlari hisobga olinadi.", "Oʻlchash natijasining mutlaq aniqligini ifodalaydi; atrof-muhit sharoitlarining maksimal ta'siri baholanadi.", "O'lchash uslubiyotining qanchalik mukammalligini koʻrsatadi; operatorning tajribasi va malakasi asosiy omil boʻladi."], ["Metrologiya fani qaysi boshqa akademik va amaliy sohalar bilan chambarchas bogʻliq?", "Matematika, fizika, kimyo, mexanika, elektrotexnika, avtomatika, standartlashtirish va sifat menejmenti.", "Sotsiologiya, psixologiya, adabiyot, san'atshunoslik, tilshunoslik va madaniyatshunoslik.", "Tarix, geografiya, arxeologiya, geologiya, meteorologiya, astronomiya va paleontologiya.", "Biologiya, botanika, zoologiya, ekologiya, genetika, mikrobiologiya va anatomiya."], ["Oʻzbekiston Respublikasining “Metrologiya toʻgʻrisida”gi Qonuniga koʻra, metrologiyaga oid faoliyatning asosiy vazifalaridan biri nimadan iborat?", "Oʻlchashlarning yagona birlikda boʻlishini ta'minlash va ishonchsiz natijalarning oldini olishni oʻz ichiga oladi.", "Barcha konchilik korxonalarida foydalaniladigan uskunalarni faqatgina davlat standartlariga muvofiq ravishda ishlab chiqarishni ta'minlash.", "Konchilikda xalqaro bozorlarda sotiladigan mahsulotlarning narxini belgilashga xizmat qiladigan xolis narx siyosatini shakllantirish.", "Ishlab chiqarish jarayonida ishlatiladigan barcha materiallarning texnik xususiyatlarini doimiy ravishda yangilab borishni talab etish."], ["Konchilik korxonalarida metrologiya talablarining ayniqsa muhim bo'lishining asosiy sababini ko'rsating.", "Ishlab chiqarish jarayonlari katta hajmdagi xomashyo, energiya, suv va boshqa resurslar bilan bog'liqligi sababli aniqlik juda muhimdir.", "Metrologiya talablari asosan konchilik mahsulotlarini xalqaro bozorga eksport qilishda to'siqlarni bartaraf etishga qaratilganligi uchun.", "Konchilik sohasidagi barcha ishchilarni doimiy ravishda oʻlchash uslubiyotlari boʻyicha malakasini oshirish zarurati doimo mavjudligi.", "Mahsulotlarning sifatini baholashda faqatgina vizual tekshirish usullaridan foydalanish amaliyoti keng tarqalganligi tufayli juda muhim."], ["Konchilikda massa va mahsulot miqdorini oʻlchashdan asosiy maqsad nimadan iborat?", "Qazib olingan yoki jo'natilgan mahsulot hajmini toʻgʻri hisobga olish va nazorat qilish.", "Ishlab chiqarish jarayonlarida ishlatiladigan barcha uskunaning umumiy og'irligini muntazam aniqlash.", "Konchilik sohasidagi barcha mehnat resurslarining umumiy miqdorini doimiy ravishda hisoblash.", "Mahsulotning tarkibidagi kimyoviy elementlarning foiz nisbatini aniqlashga qaratilgan tadqiqotlar."], ["Konchilik mahsulotlarining namligini oʻlchashdan asosiy maqsad nimada?", "Mahsulotning namlik darajasini aniqlash va massa hisobini toʻgʻri yuritishni ta'minlash.", "Uskunalarning zanglash darajasini oldini olish uchun atrof-muhitdagi suv bug'ining miqdorini belgilash.", "Ishlab chiqarish jarayonida ishlatiladigan moylash materiallarining tarkibidagi suv miqdorini nazorat qilish.", "Konchilik mahsulotlarining erish nuqtasini aniqlash va ularning kimyoviy barqarorligini tekshirish."], ["Konchilikda zichlikni oʻlchashdan asosiy maqsad nima?", "Material va pulpa xususiyatlarini baholashda hamda texnologik jarayonlarni nazorat qilishda qoʻllaniladi.", "Uskunalarning og'irligini aniqlash va ularning transport vositalariga ortish hajmini hisoblash uchun asos bo'ladi.", "Konchilik mahsulotlarining yorug'likni qaytarish qobiliyatini tekshirish va ularning estetik xususiyatlarini baholash.", "Ishlab chiqarish joylaridagi havo tarkibidagi zararli gazlarning konsentratsiyasini monitoring qilish usulini shakllantirish."], ["Konchilikda bosimni oʻlchashning asosiy maqsadi nimadan iborat?", "Gidravlik va pnevmatik tizimlar, quvurlar va texnologik uskunalarda nazoratni ta'minlash.", "Ishlab chiqarish jarayonida foydalaniladigan suvning umumiy hajmini aniqlash uchun qo'llaniladi.", "Konchilik korxonasining geografik joylashuvini aniqlashda atmosfera bosimini hisoblash.", "Mahsulotning sirt qismiga ta'sir qiluvchi tashqi kuchlarni baholashda asosiy parametr hisoblanadi."], ["Konchilik korxonasida metrologik ta'minlashning asosiy maqsadlaridan biri qaysi javobda keltirilgan?", "O'lchash natijalarining yagona birlikda ifodalanishini ta'minlash va ishonchsiz natijalarning oldini olish.", "Ishlab chiqarish jarayonida faqatgina qo'lda bajariladigan operatsiyalarning samaradorligini oshirish.", "Konchilik mahsulotlarining narxini belgilashda faqat davlat tomonidan tasdiqlangan usullardan foydalanish.", "Korxona xodimlari orasida metrologiya bo'yicha doimiy malaka oshirish kurslarini tashkil etish."], ["Konchilik korxonasida metrologik ta'minlash obyektlariga quyidagilardan qaysi biri kiritilgan?", "Oʻlchash vositalari va tizimlari, uslubiyotlari, etalonlar hamda oʻlchash sharoitlari.", "Faqatgina ishlab chiqarish jarayonida ishlatiladigan elektr toki iste'moli hisoblagichlari.", "Konchilik hududining umumiy geologik tuzilishini aks ettiruvchi xaritalar va chizmalar.", "Korxona ichki xo'jalik hisob-kitoblariga oid buxgalteriya hujjatlari va balanslari."], ["Metrologik tushunchalarda 'Metrologik kuzatiluvchanlik' nima degani?", "O'lchash natijasining uzluksiz hujjatlashtirilgan zanjir orqali etalonga bog'lanishi.", "O'lchash vositalarining har yili davlat metrologiya xizmatlari tomonidan taftish qilinishi.", "O'lchash jarayonida faqatgina raqamli texnologiyalardan foydalanishni talab qiluvchi yondashuv.", "O'lchash vositasining metrologik xususiyatlarini doimiy ravishda o'zgarib turishini ifodalovchi holat."], ["Oʻlchashlarni bajarish uslubiyotining ahamiyati nimada?", "U o'lchash natijasining sifati faqat asbobning aniqligiga bog'liq emasligini, balki usul, namuna olish va sharoitlar ham muhimligini ko'rsatadi.", "U o'lchash vositalarining ishlab chiqaruvchisi tomonidan berilgan kafolat muddatini uzaytirish imkonini beradi.", "U o'lchash jarayonida inson omilining ta'sirini butunlay istisno qilishga qaratilgan avtomatlashtirish tizimini belgilaydi.", "U o'lchash natijalarini faqatgina laboratoriya sharoitlarida qayta ishlashni talab qiladigan ilmiy yondashuvni ta'minlaydi."], ["«Metrologik ta'minlash» va «mahsulot sifatini nazorat
