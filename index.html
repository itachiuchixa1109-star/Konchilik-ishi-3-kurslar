i to'liq boshqarib bilmaslik usulning eng asosiy kamchiligidir, bu esa aniqlikni pasaytiradi.", "Burgilash va portlatish ishlarining nisbiy qiymatini sezilarli darajada kamaytirish usulning asosiy kamchiligi hisoblanadi, chunki bu ortiqcha xarajatlarga olib keladi.", "Qozonsimon zaryad portlatishi natijasida hosil bo'ladigan xavfli masofani o'rash va qozonsimon zaryadni qayta tiklashning murakkabligi asosiy kamchilikdir.", "Bu usulning asosiy kamchiligi shundaki, u faqat gruntlarda turli xil inshootlarni qurishda qo'llanilib, foydali qazilmalarni ochiq usulda qazib olish uchun yaramaydi."], ["Portlatilgan tog' jinslariga qo'yiladigan asosiy talablar qanday, ayniqsa noulchamlar soni, maydalanish bir tekisligi va bo'lakchalar o'lchamlari bo'yicha?", "Noulchamlar soni minimal bo'lib, maydalanish bir tekisda bo'lishi, bo'lakchalar o'lchamlari yuklovchi va tashuvchi transportga mos kelishi kerak.", "Portlatilgan jinslar joylashuvi to'plami iloji boricha kichik bo'lishi va hosil bo'lgan bloklarning hajmi doimiy ravishda o'lchanishi talab qilinadi.", "Maydoncha va pog'ona qiyaliklari belgilangan qiymat va shaklda bo'lishi shart emas, asosiysi portlovchi moddalar turini hisobga olishdir.", "Portlatish parametrlari va usulini faqat iqtisodiy-texnik ko'rsatkichlar asosida tanlash lozim, xavfsizlik masalalariga e'tibor berilmasdan."], ["Skvajinali zaryadli usulda portlovchi moddalarning joylashtirilishi qanday amalga oshiriladi va ushbu usul qaysi vaziyatlarda qo'llaniladi?", "Maxsus kengaytirgichlar yordamida teshilgan bushliklarda ketma-ket portlatib hosil qilingan qozonsimon bushliklarga joylashtiriladi.", "Portlovchi moddalar to'g'ridan-to'g'ri skvajinalarga yuklanadi, bu esa eng oson va eng tezkor usul hisoblanadi.", "Faqat tog' jinslarini maydalashda, avtomobil va temir yo'l qurilishi ishlarida keng qo'llaniladi, boshqa hollarda emas.", "Ushbu usul faqat shaharlar sharoitidagi tor joylarda va eski temir beton asoslarini portlatish uchun maxsus ishlab chiqilgan."], ["Kamerali zaryadlar usulining og'irligi bir necha yuz tonnadan iborat bo'lgan portlovchi modda joylashtirish tartibi va qo'llanilish sohalari qanday?", "Portlovchi modda yemirilishi kerak bo'lgan ob'ekt ustiga qo'yiladi; bu usul noulcham blok va bo'laklarni maydalashda qo'llaniladi.", "Portlovchi modda yer osti kon laxmlariga joylashtiriladi; bu usul asosan avtomobil va temir yo'l qurilishida qo'llaniladi.", "Portlovchi modda skvajinalarga tushiriladi; bu usul faqat shahardagi eski temir-beton asoslarini portlatishda ishlatiladi.", "Portlovchi modda transheyaga joylashtiriladi; bu usul kanavalar qazish va boshqa gidrotexnik inshootlarni barpo etishda keng qo'llaniladi."], ["Harsangtosh bo'lagining ikkilamchi portlatilishida ichki zaryadlar ta'siri uchun portlovchi modda umumiy og'irligini qaysi formula yordamida aniqlanadi?", "Q = qᵥ ⋅ V (kg), bu yerda qᵥ ichqi zaryadlar ta’siri uchun PM ning hisobiy solishtirma sarfi.", "Q₁ = (πd² / 4) ⋅ Δ ⋅ l_ш ⋅ K (kg), bu yerda d shpur diametri va Δ zaryadlash zichligini bildiradi.", "N = Q / Q₁ (dona), bu yerda Q umumiy og'irlik va Q₁ bitta shpurdagi zaryad og'irligi.", "Q = q_n ⋅ V (kg), bu yerda q_n tashqi zaryadlar ta’siri uchun PM ning hisobiy solishtirma sarfi."], ["Skvajinaning solishtirma siqimini aniqlash formulasi ρ = 7.85 ⋅ d_c² ⋅ Δ (6) da d_c va Δ parametrlarining ma'nosi qanday?", "d_c – skvajina diametri (dm) va Δ – skvajinadagi zaryad zichligi (kg/dm³). Ushbu parametrlar solishtirma siqimni aniqlashda muhim.", "d_c – dolota diametri (mm) va Δ – portlovchi modda sarfi (kg/m³). Bu parametrlar dolota o'lchamlarini va material xususiyatlarini ifodalaydi.", "d_c – burg'ulash chuqurligi (m) va Δ – tog' jinsi qattiqligi. Ushbu parametrlar chuqurlik va qattiqlikni belgilaydi.", "d_c – uyum kengligi (m) va Δ – pog'ona balandligi (m). Bu parametrlar uyumning geometrik xususiyatlarini tushuntiradi."], ["Pog'ona asosi bo'yicha qarshilik chizig'i kattaligi (W) ning W = 0.9 ⋅ √(ρ/q_n) (8) formulasida ρ va q_n parametrlarining ma'nosi qanday?", "ρ – skvajinaning solishtirma siqimi (kg/m), q_n – etalondagi portlovchi moddaning solishtirma sarfi (kg/m³).", "ρ – portlovchi moddaning umumiy og'irligi (kg), q_n – bitta shpurdagi zaryad og'irligi (kg).", "ρ – pog'ona balandligi (m), q_n – pog'ona qiyalik burchagi (grad).", "ρ – zaboyka uzunligi (m), q_n – skvajina uzunligi (m)."], ["Qatordagi skvajinalar orasidagi masofa (a) formulasi a = Q_з / (q_n ⋅ H_y ⋅ W) (12) da Q_з, q_n, H_y, W parametrlarining ma'nosi qanday?", "Q_з – skvajinadagi zaryad massasi (kg), q_n – etalon PM sarfi (kg/m³), H_y – pog'ona balandligi (m), W – qarshilik chizig'i (m).", "Q_з – umumiy PM og'irligi (kg), q_n – portlovchi modda zichligi (kg/m³), H_y – uyum kengligi (m), W – perebur uzunligi (m).", "Q_з – bitta shpurdagi zaryad og'irligi (kg), q_n – ichki zaryadlar sarfi (kg/m³), H_y – shpur diametri (m), W – zaboyka uzunligi (m).", "Q_з – maydalanish darajasi, q_n – to'lish koeffitsienti, H_y – portlash vaqti (ms), W – sekinlashish oralig'i (m/s)."], ["Sekinlashish oralig'i (τ) formulasi τ = K_Т ⋅ W (15) da K_Т koeffitsienti nimani anglatadi va uning o'rtacha qiymati qanday?", "K_Т – tog' jinsini portlanuvchanligiga bog'liq bo'lgan koeffitsient (o'rtacha portlashdagi tog' jinsi uchun K_Т = 3.0-4.0).", "K_Т – portlovchi modda turini hisobga oluvchi koeffitsient (o'rtacha portlashdagi tog' jinsi uchun K_Т = 1.0-1.1).", "K_Т – skvajina diametriga bog'liq bo'lgan koeffitsient (o'rtacha portlashdagi tog' jinsi uchun K_Т = 1.4-1.6).", "K_Т – zaboyka uzunligiga bog'liq bo'lgan koeffitsient (o'rtacha portlashdagi tog' jinsi uchun K_Т = 0.27-0.3)."], ["Bir p.m. skvajinani portlatganda chiqadigan kon massasi (q_гм) formulasi q_гм = (H_y ⋅ a ⋅ W) / l_c (17) qaysi o'lchov birligida aniqlanadi?", "m³/m (kub metr/metr), ya'ni har bir metr skvajinadan chiqadigan kon massasini bildiradi.", "kg/m³ (kilogramm/kub metr), ya'ni bir kub metr tog' jinsidagi portlovchi modda zichligini ko'rsatadi.", "kg (kilogramm), ya'ni portlovchi moddaning umumiy massasini ifodalaydi.", "dona (adad), ya'ni burg'ulangan shpurlar sonini ko'rsatadi."], ["Bino va inshootlar uchun seysmik xavfsiz masofani hisoblashda qaysi formuladan foydalaniladi?", "r_c = k_c · a · ∛Q formulasi orqali aniqlanadi", "r_c = k_c · a · √Q formulasidan foydalaniladi", "r_c = k_c · a · Q² formulasi orqali hisoblanadi", "r_c = k_c · a · Q³ ifodasi asosida topiladi"], ["Inshoot asosidagi tog' jinsi mustahkam qoyatosh bo'lganda k_c koeffitsienti qiymati nechaga teng bo'ladi?", "Ushbu tog' jinsi uchun 3 ga teng qiymat olinadi", "Ushbu tog' jinsi uchun 5 ga teng qiymat olinadi", "Ushbu tog' jinsi uchun 7 ga teng qiymat olinadi", "Ushbu tog' jinsi uchun 9 ga teng qiymat olinadi"], ["Inshoot asosi yoriqli qoyatoshdan iborat bo'lganda grunt xususiyati koeffitsienti (k_c) necha qabul qilinadi?", "Ushbu xususiyat uchun koeffitsient 5 ga teng bo'ladi", "Ushbu xususiyat uchun koeffitsient 3 ga teng bo'ladi", "Ushbu xususiyat uchun koeffitsient 8 ga teng bo'ladi", "Ushbu xususiyat uchun koeffitsient 15 ga teng bo'ladi"], ["Galichnikli va shebinli qumtosh jinslari uchun k_c koeffitsientining me'yoriy qiymati qancha belgilanadi?", "Mazkur toifadagi grunt uchun koeffitsient 7 deb olinadi", "Mazkur toifadagi grunt uchun koeffitsient 3 deb olinadi", "Mazkur toifadagi grunt uchun koeffitsient 9 deb olinadi", "Mazkur toifadagi grunt uchun koeffitsient 20 deb olinadi"], ["Inshoot asosi gilli tog' jinslaridan iborat bo'lgan sharoitda k_c koeffitsienti qanday qabul qilinadi?", "Gilli tog' jinsi asosi hisoblashlarida 9 deb qabul qilinadi", "Gilli tog' jinsi asosi hisoblashlarida 5 deb qabul qilinadi", "Gilli tog' jinsi asosi hisoblashlarida 8 deb qabul qilinadi", "Gilli tog' jinsi asosi hisoblashlarida 15 deb qabul qilinadi"], ["To'kma va tuproqli gruntlar asosida joylashgan inshootlar uchun k_c koeffitsienti nechaga teng bo'ladi?", "To'kma va tuproqli sharoitda mazkur qiymat 15 ga teng bo'ladi", "To'kma va tuproqli sharoitda mazkur qiymat 20 ga teng bo'ladi", "To'kma va  ko‘p komponentli gaz aralashmasining umumiy bosimi nimaga teng bo‘ladi?", "Aralashmadagi barcha komponentlarning parsial bosimlari yig‘indisiga", "Eng yuqori parsial bosimga ega bo‘lgan yetakchi gaz komponentiga", "Aralashma parsial bosimlarining o‘rtacha arifmetik qiymatiga teng", "Barcha gaz komponentlari parsial bosimlarining o‘zaro ko‘paytmasiga"], ["Aralashmadagi gaz komponentining parsial bosimi (Pᵢ) qaysi formula yordamida aniqlanadi?", "Pᵢ = yᵢ · P ifodasi orqali komponentning parsial bosimi topiladi", "Pᵢ = P / yᵢ ifodasi orqali komponentning parsial bosimi topiladi", "Pᵢ = yᵢ / P ifodasi orqali komponentning parsial bosimi topiladi", "Pᵢ = yᵢ + P ifodasi orqali komponentning parsial bosimi topiladi"], ["Umumiy bosimi 120 kPa bo‘lgan gaz aralashmasida bir komponent ulushi 15 % bo‘lsa, uning parsial bosimi qancha bo‘ladi?", "Pᵢ = 18 kPa ga teng bo‘ladi", "Pᵢ = 15 kPa ga teng bo‘ladi", "Pᵢ = 24 kPa ga teng bo‘ladi", "Pᵢ = 12 kPa ga teng bo‘ladi"], ["Misolda keltirilgan 47 °C harorat Kelvin shkalasida qanday qiymatga ega bo‘ladi?", "T = 320,15 K ga teng bo‘ladi", "T = 310,15 K ga teng bo‘ladi", "T = 330,15 K ga teng bo‘ladi", "T = 273,15 K ga teng bo‘ladi"], ["Bajarilgan ish namunasida bosim o‘zgarmas deb olinganda gaz hajmi 4,0 m³ dan qanchagacha oshishi hisoblangan?", "4,69 m³ qiymatgacha oshishi hisoblab topilgan", "5,25 m³ qiymatgacha oshishi hisoblab topilgan", "3,85 m³ qiymatgacha oshishi hisoblab topilgan", "6,12 m³ qiymatgacha oshishi hisoblab topilgan"], ["Keltirilgan namunaviy masalada normal sharoitdagi 4,0 m³ gazning mol miqdori (n) taxminan qanchaga teng bo‘lgan?", "Taxminan 178,6 mol miqdoriga tengligi aniqlangan", "Taxminan 145,2 mol miqdoriga tengligi aniqlangan", "Taxminan 210,8 mol miqdoriga tengligi aniqlangan", "Taxminan 195,4 mol miqdoriga tengligi aniqlangan"], ["Namunada gaz joylashgan bo‘shliq hajmi 20 m³ bo‘lganda ajralgan gazlarning parsial bosimi qancha deb topilgan?", "Taxminan 23,8 kPa (23770 Pa) qiymatni tashkil etadi", "Taxminan 18,5 kPa (18500 Pa) qiymatni tashkil etadi", "Taxminan 34,2 kPa (34200 Pa) qiymatni tashkil etadi", "Taxminan 47,6 kPa (47600 Pa) qiymatni tashkil etadi"], ["Portlatish ishlaridan so‘ng konchilarning ish joyiga xavfsiz qaytishi qanday mezon orqali belgilanadi?", "Gaz analizatorlari va amaldagi xavfsizlik me’yorlari asosida tekshirilib", "Portlash sodir bo‘lgan vaqtdan boshlab ma’lum daqiqa kutish orqali", "Faqat termodinamik formulalarning nazariy hisob-kitoblariga tayanib", "Lahimdagi chang cho‘kishining ko‘z bilan vizual baholanishi asosida"], ["Portlatishdan keyingi gazlar lahim ichidan asosan qaysi mexanizm orqali tashqariga chiqariladi?", "Tashkil etilgan shamollatish havo oqimi yordamida tozalab chiqariladi", "Tabiiy diffuziya yordamida tog‘ jinslari g‘ovaklariga yuttirib yuboriladi", "Suv purkash va bug‘lantirish orqali butunlay suyuqlikka aylantiriladi", "Maxsus kimyoviy reagentlar sepib gazlar havoda butunlay neytrallanadi"]]}, {"name": "Foydali qazilma konlarini noan’anaviy usulda qazib olish", "q": [["Olimlar va konchilik korxonalari so'nggi yillarda foydali qazilmalarni qazib olishda qanday asosiy yo'nalishga e'tibor qaratmoqdalar?", "Foydali qazilmalarni yer ostidan geotexnologik usullar yordamida ajratib olishga, yangi texnologiyalarni qo'llashga.", "An'anaviy ochiq usuldagi konlarni kengaytirish va ularning samaradorligini oshirishga.", "Yuqori haroratda eritib olish uchun maxsus jihozlarni cheklash va optimallashtirishga.", "Kimyoviy boyitish jarayonlarining nazariy asoslarini butunlay o'zgartirishga harakat qilmoqda."], ["Matnga ko'ra, geotexnologik usullarga quyidagilardan qaysilari kiradi, asosan to'liq ro'yxatni toping?", "Metall va fosforitlarni suyuqlik bilan skvajinalar orqali eritib olish, oltingugurtni yuqori haroratda eritish.", "Tuz massivlarini suvda eritish, biologik faol suvli eritmalar bilan minerallarni ajratish, konlarni portlatish.", "Yonuvchi qazilmalarni yer ostida gazga aylantirish va sulfidli minerallarni qizdirib olish.", "Er ostiga skvajinalar o'tkazib misni va uranni tanlab eritish, organik erituvchilar bilan ajratib olish."], ["Mikrobiologik usulda foydali qazilmalarni ajratib olish jarayonida bakteriyalar qanday vazifani bajaradi?", "Bakteriyalar minerallarning erish tezligini sezilarli darajada oshiruvchi samarali katalizator vazifasini bajaradi.", "Bakteriyalar eritmalar tarkibidagi zaruriy metallarni o'zida yig'ib olish qobiliyatini namoyon etadi.", "Bakteriyalar rudani kimyoviy jihatdan barqarorlashtirishga yordam berib, uning parchalanishiga to'sqinlik qiladi.", "Bakteriyalar eritmalar tarkibidagi xavfli kimyoviy moddalarni o'zlashtirib, ularni zararsizlantiradi."], ["Fizik-kimyoviy va mikrobiologik usullar an'anaviy konchilikka nisbatan qanday afzalliklarga ega?", "Er osti og'ir ishidan xalos etadi, yer yuzasini o'pirilishdan saqlaydi, chang va gazga ehtiyojni kamaytiradi.", "Foydali qazilmalarni yuqori konsentratsiyali qatlamlardan faqat tezkorlik bilan ajratib oladi.", "Jarayonlarni to'liq avtomatlashtirish imkonini berib, inson omilini butunlay yo'q qiladi.", "Faoliyat davrida kam harajatli bo'lgani uchun, uzoq muddatli istiqbolga mo'ljallangan hisoblanadi."], ["Navoiy tog'-kon metallurgiya kombinatida tanlab eritish usuli yordamida qaysi metallar ajratib olinadi?", "Uran, oltin va siyrak uchraydigan ba'zi metallar samarali tarzda ajratib olinmoqda.", "Mis, rux va temir kabi keng tarqalgan rangli metallar ajratib olish amaliyotda qo'llaniladi.", "Platina, palladiy va rodiy kabi nodir metallar katta miqdorda qazib olinadi.", "Alyuminiy, titan va magnit kabi engil metallarning ishlab chiqarilishi kengaymoqda."], ["Misni tanlab eritib ajratib olish usuli qanday kimyoviy prinsipga asoslangan holda amalga oshiriladi?", "Maydalangan mis rudasi orqali kislota o'tkazilganda mis minerallari erib, keyin temir bilan cho'ktiriladi.", "Mis rudalari yuqori haroratda oksidlanib, keyin suv bilan yuvish orqali tozalik darajasini oshirishga.", "Misni organik erituvchilar yordamida eritmaga o'tkazib, keyinchalik elektrokimyoviy usul bilan ajratib olishga.", "Misni yuqori bosim ostida bug'lash orqali uning tarkibini ajratib olish va tozalashga."], ["Matnda keltirilgan CuSO₄ + Fe = FeSO₄ + Cu reaksiyasi qaysi jarayonni ifodalaydi?", "Misni tanlab eritishdan so'ng uni eritmadan sementatsiyalash yo'li bilan cho'ktirish jarayonini.", "Temir rudasidan misni ajratib olish jarayonidagi asosiy kimyoviy almashinish reaktsiyasini.", "Sulfat kislotaning temir bilan reaksiyasidan hosil bo'lgan yangi birikmalarni aniqlashni.", "Misni er osti suvlarida erish jarayonini tezlashtiradigan kimyoviy o'zgarishni tasvirlaydi."], ["Oltingugurtni yer osti usulida qazib olish qachondan boshlangan va hozirda uning global miqyosdagi ulushi qancha?", "1904-yildan boshlangan va hozirda dunyo bo'yicha qazib olingan oltingugurtning 83% ini tashkil etadi.", "1950-yillardan boshlab rivojlangan va hozirda 50% dan ortiq oltingugurt ushbu usulda olinadi.", "1890-yillarda ilk bor qo'llanilgan va umumiy ishlab chiqarishning 70% ulushini egallaydi.", "20-asrning boshidan boshlangan bo'lib, hozirgi kunda qariyb 60% oltingugurt shunday qaziladi."], ["Tanlab eritish jarayonida rudani ekspluatatsiya qilinadigan blokni ivitib ajratishdan avvalgi bosqich qanday amallarni o'z ichiga oladi?", "Bug'lash, kommunikatsiyalar bilan bog'lash, tugunlovchi ishchi uskunalarni o'rnatishni o'z ichiga oladi.", "Er ostida portlatish ishlarini amalga oshirish va rudani maydalash uchun maxsus texnikani tayyorlashni.", "Qazib olingan rudani yer yuzasiga chiqarish va dastlabki qayta ishlash joyiga tashishni.", "Metallarni ajratib olish uchun kimyoviy reagentlarni tayyorlash va ularni sinovdan o'tkazishni."], ["Filtratsion sxema reagentlari oqimining doimiy yoki davriy tasvirdan foydalanishiga qanday asoslanadi?", "Rudda massividagi darzliklardan eritmalarni yuborishdagi bosim va chiqarishdagi bosim farqiga.", "Eritmaning yer osti suvlari bilan aralashish darajasini nazorat qilish va minimal yo'qotishlarga.", "Rudaning kimyoviy tarkibiga va uning eruvchanlik xususiyatlariga bevosita bog'liqligiga.", "Reagentlarning rudani mexanik ravishda parchalash qobiliyatiga va granulometrik tarkibiga."], ["Uranli eritmalarni so'rib olish jarayoni asosan qanday usullar bilan amalga oshiriladi va ularning ulushi qanday?", "So'rish nasoslari yordamida (95%) va erliftlar yordamida (5%) amalga oshiriladi.", "Gravitatsion oqimdan foydalanish (80%) va yuqori bosimli siqilgan havo bilan (20%) amalga oshiriladi.", "Faoliyat davrida asosan mexanik pompalash (70%) va ventilyatsiya tizimlari (30%) bilan bajariladi.", "Filtratsiya usullari (60%) va pulsatsion-statik sxemalar (40%) orqali eritmalar yig'iladi."], ["Uranli eritmalarni qayta ishlash uchun ishlatiladigan dastgohning elektr istemoli qanday texnik xususiyatlarga ega?", "380V kuchlanish, 3 fazali tizimda va 50 Gs chastotada quvvatni qabul qiladi, quvvati 5,4 kVt.", "220V kuchlanish, bir fazali tizimda va 60 Gs chastotada, maksimal quvvati 10 kVt ni tashkil etadi.", "500V kuchlanish, 6 fazali tizimda va 40 Gs chastotada, samaradorligi 90% dan yuqori bo'ladi.", "110V kuchlanish, doimiy tok tizimida va 5 Gs chastotada, minimal energiya sarfi bilan ishlaydi."], ["Sorbsiyalash jarayonlari SNK-3 bosimli kalonnalarida qanday printsip asosida amalga oshiriladi?", "Uranli eritma nasos yordamida pastdan yuqoriga beriladi, to'yingan qatron pastki sliv bilan chiqariladi.", "Uranli eritma yuqoridan quyiladi, qatron pastki qismdan joylashtiriladi va yuqoriga harakatlanadi.", "Eritma bilan qatronni statsionar holda aralashtirib, keyin cho'ktirish usuli bilan ajratishga.", "Suyuqlik va qatron o'rtasida filtrlash parda yordamida, reaktivlar bilan ajratib olishga asoslanadi."], ["Uranli eritmaning kunlik sarfi va yillik sarfini hisoblashda qanday qiymatlar qo'llanilgan?", "Kunlik sarf 5166 m³/kun, yillik sarf 1885590 m³/yil (229,6 m³/ch * 22,5 soat = 5166 m³/kun).", "Kunlik sarf 4592 m³/kun, yillik sarf 1675000 m³/yil (200 m³/ch * 23 soat = 4600 m³/kun).", "Kunlik sarf 6000 m³/kun, yillik sarf 2190000 m³/yil (250 m³/ch * 24 soat = 6000 m³/kun).", "Kunlik sarf 4800 m³/kun, yillik sarf 1752000 m³/yil (200 m³/ch * 24 soat = 4800 m³/kun)."], ["Uranli maxsulotlarni qayta ishlash vaqtida inson organizmiga zararli moddalar qanday asosiy usullar orqali o'tishi mumkin?", "Havo yo'llari orqali, oshqozon yo'llari orqali va teri orqali kirib, salbiy ta'sir ko'rsatishi mumkin.", "Faqatgina to'g'ridan-to'g'ri kontakt orqali va teri orqali so'rilishi natijasida kirishi ehtimoli mavjud.", "Faqat yuqori nafas olish yo'llari orqali, suyuqlik tomchilari holatida havo bilan nafas olinganda.", "Suv orqali iste'mol qilinganda va ovqat orqali tana ichiga kirishi mumkin bo'lgan yagona yo'ldir."], ["Sulfat kislota bug'lari inson organizmiga tushganda qanday salbiy ta'sirlarni keltirib chiqaradi?", "Yuqori nafas olish yo'llarini qo'zg'alishi, yo'tal, nafas olishning qiyinlashishi va terining kuyishi.", "Asosan teri allergik reaksiyalari, bosh og'rig'i va qon bosimining o'zgarishini keltirib chiqaradi.", "Ichki organlarga tizimli zarar yetkazish, asab tizimida buzilishlar va yurak urishini o'zgartirish.", "Soch to'kilishi, tirnoqlarning mo'rtlashishi va umumiy immunitet tizimini zaiflashtirishga olib keladi."], ["Ammiak gazlarining binoda yig'ilib qolishi qanday xavfni yuzaga keltiradi?", "Portlash xavfini tug'diradi, chunki ammiak gazlari o'tkir hidli, zaxarli va yonuvchi hisoblanadi.", "Yong'in xavfini sezilarli darajada oshiradi, chunki u havo bilan reaksiyaga kirishib, tez yonuvchi aralashma hosil qiladi.", "Inson salomatligiga jiddiy zarar yetkazadi, asosan nafas olish tizimini butunlay falaj qiladi.", "Elektr tizimlariga salbiy ta'sir ko'rsatadi, ularning izolyatsiyasini buzib, qisqa tutashuvga olib keladi."], ["Elektr toki ta'sirining eng xavfli tomoni nimada va unga qarshi qanday asosiy choralar ko'riladi?", "Xavfni oldindan ko'rish imkoniyati yo'qligi, tashkiliy va texnik chora-tadbirlar, to'siqlar qo'llaniladi.", "Uzoq muddatli ta'sir qilish natijasida yuzaga keladigan sog'liq muammolari, maxsus tibbiy ko'riklar.", "Yuqori kuchlanish ostida ishlaydigan uskunalarning doimiy nosozliklari, muntazam profilaktika.", "Elektr toki ta'sirining bevosita og'riqli sezgilari, shaxsiy himoya vositalarini ta'minlash."], ["Elektr qurilmalarining tok o'tmaydigan metall qismlarini muhofazalashning asosiy usuli qanday?", "Nol sim bilan ulab qo'yish, ya'ni qurilmani nolga ulab muhofazalash, qisqa tutashuvni oldini olish.", "Qurilmalarni maxsus izolyatsion materiallar bilan qoplash va ularni doimiy nazorat ostida saqlash.", "Har bir qurilmaga avtomatik o'chirish tizimini o'rnatish, haddan tashqari yuklanganda tokni uzish.", "Elektr qurilmalarini suv o'tkazmaydigan korpuslar bilan jihozlash va ularni namlikdan himoya qilish."], ["Sanoat korxonalarida yoritishga qo'yiladigan mehnat muhofazasi talablariga qaysilar kiradi?", "Ish joylarining bir tekisda yoritilishi, ko'rishga mosligi, ko'zni qamashtirmasligi, soya tushmasligi.", "Yoritish moslamalarining energiya samaradorligi, ularning texnik xizmat ko'rsatish chastotasi.", "Yoritgichlarning estetik ko'rinishi, interyer dizayni bilan uyg'unligi, ranglarning uyg'unligi.", "Yoritish tizimlarining yuqori bosimga chidamliligi, harorat o'zgarishlariga qarshi chidamliligi."], ["Sun'iy yoritish manbalari sifatida matnda qaysilar keltirilgan?", "Chug'lanish chiroqlari va gazorazryadli (lyuminessent) chiroqlar keng qo'llaniladigan manbalar.", "LED lampalar va optik tolali yoritish tizimlari zamonaviy texnologiyalar asosida.", "Lazerli yoritgichlar va infraqizil nurlanishga asoslangan tizimlar maxsus sohalar uchun.", "Kvartslampalar va ultrabinafsha nurlanishga ega bo'lgan qurilmalar dezinfeksiya uchun."], ["Gazorazryadli chiroqlarning past bosimli (lyuminessent) turlari qanday xususiyatlarga ega?", "Trubka ichidagi bosim 400 Pa ga yaqin, lyuminofor tarkibiga ko'ra turli rangda bo'ladi.", "Yuqori bosim ostida ishlaydi, energiya sarfi yuqori va xizmat muddati qisqa bo'ladi.", "Asosan ultrabinafsha nurlanish hosil qiladi va ko'rish uchun yaroqsiz hisoblanadi.", "Atrof-muhit haroratiga juda sezgir, past haroratlarda ishlamay qolish xavfi mavjud."], ["Tabiiy shamollatish (aeratsiya) jarayoni qanday asosiy prinsipga tayanadi?", "Sovuq havo isib, zichligi kamayib, yuqoriga ko'tarilishi va chiqish teshiklaridan chiqib ketishi.", "Mexanik ventilyatorlar yordamida havoni majburiy ravishda aylantirish va tozalash tizimlari.", "Binoning yuqori qismidagi havoni sovutish va uning og'irligini oshirib, pastga tushirish orqali.", "Kimyoviy reaksiyalar natijasida hosil bo'lgan bosim farqi hisobiga havoning harakatlanishi."], ["Mahalliy shamollatish tizimlarining asosiy vazifasi va iqtisodiy foydasi nimadan iborat?", "Zararli moddalarni manbasida ushlab qolish va binodan chiqarish, atmosferaga chiqariladigan havoni tozalashga ehtiyoj yo'q.", "Umumiy bino havosini to'liq almashtirish, barcha ish joylarida doimiy toza havoni ta'minlashni.", "Binoning energiya samaradorligini oshirish, havoni isitish va sovutish harajatlarini kamaytirishni.", "Ish joylarida haroratni bir xil ushlab turish, ishchilarning ish sharoitini yaxshilashni maqsad qiladi."], ["Shamollatish qurilmalarini sinash va ta'mirlashdan keyin qanday hujjat yuritiladi?", "Qurilmaning texnik pasportiga o'zgarishlar haqida ma'lumotlar yozib qo'yiladi, bu asosiy hujjatdir.", "Har bir ta'mirlash ishidan so'ng yangi ekspluatatsiya qo'llanmasi ishlab chiqiladi va tasdiqlanadi.", "Ishlab chiqarish nazorati jurnaliga faqat tekshiruv natijalari va kamchiliklar ro'yxati qayd etiladi.", "Texnik xavfsizlik aktiga barcha o'zgarishlar kiritiladi va tegishli bo'limlar tomonidan imzolanadi."], ["Elektr qurilmalarining elektr o'tkazgichlarini muhofaza qobiqlari bilan ta'minlashning ahamiyati nimada?", "Ko'p miqdordagi elektr tokini yo'qotishdan saqlaydi, xodimni elektr toki ta'siridan himoyalaydi.", "Elektr tizimlarida kuchlanishni bir xil ushlab turishga yordam beradi va elektr energiya sarfini kamaytiradi.", "Qurilmalarning estetik ko'rinishini yaxshilaydi va ularning ish faoliyatini uzaytirishga yordam beradi.", "Uchqunlar chiqishi natijasida yuzaga keladigan yong'in xavfini yo'qotadi va tizimni barqarorlashtiradi."], ["Yer ostida tanlab eritish usulining afzalligi nimada?", "Foydali qazilmani qazib olish, maydalash va boyitish shartlari bekor bo'ladi.", "Bu usul faqat yuqori sifatli, metallga boy konlar uchun samaralidir.", "Jarayonni amalga oshirish uchun doimiy ravishda yuqori harorat talab etiladi.", "Faol reagentlarning sarfi an'anaviy usullarga qaraganda sezilarli oshadi."], ["Uranli rudalarni yer ostida tanlab eritishda uranni ajratib olishning asosiy sharoiti qanday?", "Eritiluvchi metall ruda tarkibida mineral koʻrinishida boʻlib, kuchsiz suvli eritmada oson parchalanishi shart.", "Tog' jinsi hosil qiluvchi minerallar yuqori kislotali hajmni egallab, eritma bilan qiyin ta'sirlanishi kerak.", "Rudalar faqat sun'iy maydalangandan so'ng emas, balki tabiiy holda ham eritma oʻtkazuvchan boʻlishi lozim.", "Kon qismlari rudaning joylashish sharoitiga asosan, er ostida eritish natijasida ratsional foydalanish imkonini beradi."], ["Yer ostida tanlab eritish jarayonini murakkablashtiradigan omillar qaysilar?", "Ruda tarkibida qoʻshimcha karbonat minerallarining 40% dan oshishi.", "Eritma haroratining doimiy ravishda past darajada saqlanishi.", "Qazib olinayotgan metallning yuzaga chiqish tezligining ortishi.", "Quduqlar orasidagi masofaning qisqarishi va ularning torayishi."], ["Ekstrakstiya jarayonining ta'rifini to'g'ri ko'rsating.", "Erigan metall birikmalarining suvli fazadan, suv bilan aralashmaydigan suyuq organik fazaga oʻtkazilishini anglatadi.", "Qattiq holatdagi minerallarni ma'lum haroratda bugʻga aylantirish, ularni suyuq moddalar bilan aralashtirish jarayoni.", "Metall ionlarining eritmadan qattiq sirtga yopishib qolishini ta'minlovchi, faqat fizik kuchlarga asoslangan jarayon.", "Rudaning tarkibidagi foydali komponentlarni faqat mexanik usulda maydalash, soʻngra ularni turli oʻlchamdagi sinflarga ajratish."], ["Uranli eritmalardan sulfat eritmalari chiqarib turishdan maqsad nima?", "Sulfat ionlarining to'planib qolib normadan oshmasligini va sorbsiya jarayonining samarali kechishini ta'minlash.", "Uran tarkibining eritmadagi konsentratsiyasini sun'iy ravishda oshirish uchun maxsus kimyoviy moddalar qo'shish.", "Eritmadagi boshqa qimmatli metallarning ajralib chiqishini tezlashtirish va ularning yig'ilishiga imkoniyat yaratish.", "Ion almashinish qatronlarining kimyoviy xossalarini oʻzgartirish, ularning yangi reaktivlikka ega bo'lishini ta'minlash."], ["Ishqorlash jarayonining birinchi bosqichi qanday amalga oshiriladi?", "Ishqorlanadigan minerallar yuzasiga eritmani bir maromda yetkazish va taqsimlash.", "Eriydigan tuzlarning hosil bo'lishi uchun kimyoviy reaksiyani boshlash va uning tezligini oshirish.", "Reaksiyada eruvchi moddalarning eritma hajmiga o'tishini nazorat qilish va moddalar o'tkazuvchanligini oshirish.", "Qolgan eritmani filtrlash va uni qayta ishlatish uchun yig'ish, hamda keraksiz aralashmalarni ajratish."], ["Ion almashinish texnologiyasida uranni sorbsiyalashda asosan qaysi turdagi ionitlar qoʻllaniladi?", "Anionitlar, chunki ular uranning manfiy zaryadlangan birikmalarini samarali yutishga qodirdir.", "Kationitlar, uran atomlarining ijobiy zaryadini yutishga qodir bo'lgan maxsus birikmalar.", "Amfoter ionitlar, turli zaryadlangan ionlarni bir vaqtda adsorbsiya qilish uchun ishlatiladi.", "Chelat hosil qiluvchi ionitlar, uran bilan murakkab tuzlar hosil qilish uchun mo'ljallangan."], ["Minerallarni kimyoviy ajratish usuli, ishqorlashga asoslangan holda, qanday maqsadda qoʻllaniladi?", "Foydali komponentlarni rudadan selektiv tarzda ajratib olish va ularning tozaligini oshirish.", "Rudani faqat mexanik yo'l bilan maydalash va sinflarga ajratish orqali keraksiz aralashmalarni olib tashlash.", "Minerallarning suvda eruvchanligini pasaytirish va ularni qattiq holatda, o'zgarmas shaklda saqlab qolish.", "Eritmaning fizik-kimyoviy xossalarini sezilarli darajada oʻzgartirish, uni yangi turdagi jarayonlarga moslashtirish."], ["Uran gidrometallurgik qayta ishlashda ionitlarga qoʻyiladigan talablardan biri emas.", "Yuqori mexanik mustahkamlikka (kamida 97%) ega emasligi va tez buzilishi.", "Optimal donador tarkibga ega bo'lishi, bir xil o'lchamdagi zarrachalardan iborat bo'lishi.", "Yuqori shimuvchanlik xususiyatiga ega bo'lishi, uran ionlarini samarali adsorbsiya qilishi.", "Kimyoviy jihatdan mustahkam va issiqlikka bardoshli bo'lishi, harorat o'zgarishlariga chidamliligi."], ["Tuzlarning kristallash jarayoni qanday sharoitlarda roʻy berishi mumkin?", "Eritma tuz bilan to'yinganda, erituvchi bug'lanishi yoki eritmaning harorati pasayishi natijasida yuzaga keladi.", "Eritma doimiy ravishda yuqori haroratda saqlangan holda va bosim doimiy koʻtarilganda yuzaga keladi.", "Erituvchining uzluksiz qo'shilishi va eritmadagi metallar konsentratsiyasining sezilarli darajada pasayishi bilan.", "Foydali komponentlarning suyuq fazadan qattiq fazaga mexanik ajralishi, ularning shaklini oʻzgartirmasdan."], ["Yer ostida ishqorlash eritmalari uchun qanday talablar qoʻyiladi?", "Foydali komponentning eritmaga to'liq o'tishini ta'minlash, reagentlar tannarxining pastligi va uskunaning korroziyaga bardoshliligi.", "Eritmaning doimiy ravishda yuqori haroratda bo'lishi va reogentlarning qimmat narxda bo'lishi muhim shartdir.", "Faqat bir turdagi foydali komponentni eritish va asbob-uskunalarning korroziyaga sezgirligi hisobga olinadi.", "Ishqorlash jarayonini murakkablashtiradigan, ammo umumiy foydani oshiradigan xususiyatlar ustuvor bo'lishi."], ["Ishqorlash jarayoni tezligiga qanday omillar ta'sir qiladi?", "Eritma konsentratsiyasi, suyuqlikning gidrodinamik harakati, qatlam uzunligi, shakli va rudaning o'lchami.", "Faqat mineralning kimyoviy tarkibi va atrof-muhit bosimi, boshqa omillar ahamiyatsizdir.", "Haroratning keskin o'zgarishi va ishlatiladigan reagentlarning turi, ularning umumiy miqdori.", "Qazib olinayotgan minerallarning yuzasiga tushgan quyosh nuri intensivligi va uning davomiyligi."], ["Ionitga mexanik ta'sir oʻtkazilganda uning zichligi qanday baholanadi?", "Uzoq eyilganda maxsus poʻlat silindirli shar tegirmonida donlarining bulaklarida (granulalar) oʻlchash orqali.", "Faqat uning kimyoviy mustahkamligiga qarab vizual tarzda baholanadi, mexanik xususiyatlari e'tiborga olinmaydi.", "Eritmadagi ionit hajmining oʻzgarishi orqali aniqlanadi, uning suv yutish qobiliyatiga qarab baholanadi.", "Sorbentning sirt qatlamining rang oʻzgarishi bilan aniqlanadi, bu uning kimyoviy tarkibidagi oʻzgarishlarni ko'rsatadi."], ["Sulfat kislotali tanlab eritish natijasida uranni sorbsiyalanishini sekinlashtiradigan asosiy sabab nima?", "50-100g/l gacha sulfat ionlarining yig'ilib qolishi.", "Eritmadagi uran konsentratsiyasining keskin oshishi.", "Ishlatilayotgan ionit qatronlarining haroratga sezgirligi.", "Qazib olinayotgan rudaning mexanik mustahkamligining oshishi."], ["Makroporli ionitlar oʻziga xos xususiyatlari bilan qanday ajralib turadi?", "Yuqori geterogenlikdagi gel fazalari, uch o'lchovli polimer karkasi pardalari zichlashishi hamda eritgich bilan tulgan kanallarga egaligi.", "Faqatgina kichik molekulalarni yutish qobiliyatiga ega bo'lishi, katta ion va molekulalarning kirishini cheklashi bilan boshqa ionitlardan farqlanadi.", "Suvda eruvchanligi past va kimyoviy faolligi kam bo'lishi, shuningdek, harorat o'zgarishlariga juda sezgir bo'lishi bilan ajralib turadi.", "Maxsus filtrativ xususiyatlarga egaligi, rangini oʻzgartirmasligi va jismoniy bosimga mutlaqo chidamsizligi bilan xarakterlanadi."], ["Eritish jarayonini tashkil etuvchi uchta asosiy komponent qaysilar?", "Eriydigan modda sirtiga erituvchining kelib tushishi, erituvchi va eriydigan moddaning o'zaro ta'siri (fazalararo jarayonlar) hamda eritilgan moddaning eriyotgan modda yuzasidan ajralishi (diffusion jarayon).", "Erituvchi reagentning mineral yuzasiga ta'siri, minerallarning kimyoviy tarkibini o'zgartirishi, so'ngra foydali komponentlarning qattiq holatda ajralishi va ularni yig'ish.", "Qattiq holatdagi jismning mexanik maydalanishi, suyuq reagentlar bilan aralashishi, uning konsentratsiyasini oshirib, filtratsiya jarayonlari orqali tozalash.", "Yuqori bosim ostida suyuqlikning minerallar orasiga kirishi, haroratni keskin o'zgartirish, moddalarning yuzasida yangi cho'kmalarning hosil bo'lishi va ularni ajratish."], ["Ion almashinish hajmi (sigʻimi) qanday oʻlchanadi?", "Ionitda metallni sigish hajmi bilan oʻlchanadi, bunda metall quruq yoki suyuq fazada shismish holatida boʻlishi mukin.", "Ionitning umumiy massasi va uning zichligi orqali hisoblanadi, ularning fizik xususiyatlariga asoslangan holda.", "Faqat ionitning granulometrik tarkibiga qarab taxminiy aniqlanadi, uning o'lchamlariga e'tibor beriladi.", "Eritmadagi har bir ionning umumiy zaryadi miqdori bilan, ionitning sirt faolligini inobatga olgan holda."], ["Polimer tovar ionitlari uchun mexanik mustahkamlik (MM) qanday foizni tashkil qiladi?", "Odatda 95-99% (test eyilishidan keyin 90% dan ortiq butun donlar qoladi) miqdorni tashkil etadi.", "Har doim 50% dan oshmaydi, chunki ular juda mo'rt bo'ladi va tez buzilishga moyil bo'ladi.", "Minimal daraja 10-20% ni tashkil qiladi, qolgani parchalanadi va qayta tiklanishga qodir emas.", "100% dan yuqori bo'lishi kerak, aks holda ishlatish mumkin emas va sifat standartlariga javob bermaydi."], ["Ionitning kimyoviy mustahkamligi qanday imkoniyatlarni beradi?", "Eritmalarda qayta qayta ishlash imkonini beradi va desorbsiya jarayonini oson oʻtishini ta'minlaydi.", "Faqat yuqori haroratda ishlash qobiliyatini ta'minlaydi va past haroratlarda ishlamaydi.", "Faol kimyoviy reagentlar bilan ta'sirlashuvini kamaytiradi va ularning samaradorligini oshiradi.", "Mexanik ta'sirlarga chidamliligini oshiradi va uning zichligini pasaytiradi, bu esa kam samarali ishga olib keladi."], ["Foydali qazilmalarni harakatlanadigan holatga o'tkazish, ishchi kurlarini qazib chiqarish joyiga yetkazish, yuza qismiga unumli fluydlarni yetkazib berish qaysi turdagi jarayonlarga kiradi?", "Asosiy jarayonlar.", "Ta'minlovchi jarayonlar.", "Yordamchi jarayonlar.", "Iqtisodiy jarayonlar."], ["Amaliy mashg'ulotning asosiy maqsadi nimadan iboratligi belgilangan?", "Sulfat kislotali rejimda blokni kislotalash parametrlarini aniqlash va hisoblashni o'rganish.", "Rudalarni ekstraktsiya qilish jarayonida yangi texnologiyalarni joriy etish usullarini topish.", "Yer osti yuvish usulida uran rudalarini qazib olish samaradorligini chuqur o'rganish.", "Texnologik quduqlarning ishlash muddatini va mahsuldorligini to'liq optimallashtirish."], ["Eksperimental ishlar paytida aniqlanishi kerak bo'lgan asosiy ko'rsatkichlar qaysilar?", "Ruda qazib olish texnologiyasi, zaxiralarni ishlab chiqish vaqti, quduq mahsuldorligi, uranning miqdori.", "Geologik qatlamlarning tuzilishi, suv o'tkazuvchanligi va mineral tarkibining to'liq tahlili.", "Kimyoviy reagentlarning narxi, transport xarajatlari hamda ishchi kuchining umumiy soni.", "Tuproqning korroziyaga chidamliligi, atrof-muhitga ta'siri va chiqindilarni utilizatsiya qilish."], ["Eksperimental ishni olib borish metodikasida qanday bosqichlar ajratib ko'rsatilgan?", "Tajriba uchastkasining quvurlari, kislotalanish, ekstraktsiya va natijalarni tahlil qilish bosqichlari.", "Ruda konining razvedkasi, burg'ulash, portlatish ishlari hamda xomashyoni tashish jarayonlari.", "Kimyoviy tahlillarni o'tkazish, laboratoriya sinovlari va modelni simulyatsiya qilish usullari.", "Xavfsizlik qoidalariga rioya qilish, uskunani sozlash va operatorlarni to'liq o'qitish dasturlari."], ["Shakllanishning g'ovak hajmini (Vg) aniqlash uchun qaysi formula qo'llaniladi?", "Vg = S ⋅ m ⋅ R", "Mᴴ₂ˢᴼ₄ = (Vg ⋅ C) / 1000", "T = Vg / Qs", "Qs = 24 ⋅ Q"], ["Vg = S ⋅ m ⋅ R formulasidagi \"m\" harfi qaysi ko'rsatkichni ifodalaydi?", "Konning samarali kuchi", "Ishqorlangan poligon maydoni", "G'ovaklik koeffitsienti", "Kislotalash vaqti"], ["Shakllanish g'ovak hajmini hisoblashda R koeffitsientining qiymati odatda qanchaga teng?", "0.2", "0.5", "1.0", "0.1"], ["Qatlamni kislotalash uchun sulfat kislota sarfini (Mᴴ₂ˢᴼ₄) aniqlash formulasini ko'rsating.", "Mᴴ₂ˢᴼ₄ = (Vg ⋅ C) / 1000", "Vg = S ⋅ m ⋅ R", "T = Vg / (24 ⋅ Q)", "Qs = 24 ⋅ Q"], ["Kislotalash vaqtini (T) aniqlash uchun to'g'ri formulani tanlang.", "T = Vg / Qs", "Vg = S ⋅ m ⋅ R", "Mᴴ₂ˢᴼ₄ = (Vg ⋅ C) / 1000", "Qs = 24 ⋅ Q"], ["Kislotalash vaqti formulasidagi \"Qs\" qaysi ko'rsatkichni ifodalaydi?", "Sutkalik hujayra mahsuldorligi, m³/sutka.", "Gʻovak hajmi, m³.", "Hujayra mahsuldorligi, m³/soat.", "Qoʻshimcha nordonlik (kislotalilik), g/l."], ["2-jadvalga ko'ra, 180-06 uyasi uchun g'ovak hajmi (Vg) qanday hisoblanadi (S=2400 m², m=22 m, R=0.2)?", "Vg = 2400 ⋅ 22 ⋅ 0.2 = 10560 m³", "Vg = 2400 ⋅ 150 ⋅ 0.2 = 72000 m³", "Vg = 2400 ⋅ 20 ⋅ 0.2 = 9600 m³", "Vg = 60 ⋅ 40 ⋅ 40 ⋅ 0.2 = 19200 m³"], ["Hujayra mahsuldorligi 6.0 m³/soat bo'lsa, uning sutkalik mahsuldorligi (Qs) qanchaga teng bo'ladi?", "Qs = 24 ⋅ 6 = 144 m³/sutka", "Qs = 6 / 24 = 0.25 m³/sutka", "Qs = 24 + 6 = 30 m³/sutka", "Qs = 6 ⋅ 60 = 360 m³/soat"], ["Agar g'ovak hajmi 10560 m³ va qo'shimcha nordonlik 5 g/l bo'lsa, sulfat kislota sarfi qancha?", "Mᴴ₂ˢᴼ₄ = (10560 ⋅ 5) / 1000 = 52.8 t", "Mᴴ₂ˢᴼ₄ = (10560 ⋅ 10) / 1000 = 105.6 t", "Mᴴ₂ˢᴼ₄ = (10560 ⋅ 0.2) / 1000 = 2.112 t", "Mᴴ₂ˢᴼ₄ = (2400 ⋅ 5) / 1000 = 12 t"], ["G'ovak hajmi 10560 m³ va sutkalik mahsuldorlik 144 m³/sutka bo'lsa, kislotalash vaqti (T) qancha?", "T = 10560 / 144 = 73.3 sutka", "T = 10560 ⋅ 144 = 1520640 sutka", "T = 144 / 10560 ≈ 0.013 sutka", "T = (10560 + 144) / 2 = 5352 sutka"], ["Mᴴ₂ˢᴼ₄ = (Vg ⋅ C) / 1000 formulasidagi \"C\" qaysi ko'rsatkichni ifodalaydi?", "Qoʻshimcha nordonlik (kislotalilik), g/l.", "Sulfat kislota konsentratsiyasi, g/l.", "Hujayra mahsuldorligi, m³/soat.", "G'ovaklik koeffitsienti."], ["Eksperimental ishlar sulfat kislota texnologiyasidan foydalangan holda qanday turdagi rudalarda olib boriladi?", "Karbonat miqdori 2% dan ortiq bo'lgan rudalar va asosiy jinslar ustida.", "Sulfat kislota miqdori 5 g/l dan kam bo'lgan rudalar bilan cheklangan sharoitda.", "Faqat uran miqdori 30 mg/l dan kam bo'lgan rudalarni o'rganish maqsadida.", "Samarali quvvati 20 m dan past bo'lgan konlarda olib borilmaydi."], ["Ruda gorizontining ishqorlanishi uchun ishlatiladigan boshlang'ich ishchi eritmada sulfat kislota konsentratsiyasi qancha?", "5 g/l", "10 g/l", "2 g/l", "30 mg/l"], ["Ishqorlash bo'limiga berilgan ishchi eritma ejektor yordamida qancha konsentratsiyagacha mustahkamlanadi?", "10 g/l gacha", "5 g/l gacha", "30 mg/l gacha", "20 g/l gacha"], ["Ishqorlanishning tugashining asosiy ko'rsatkichlaridan biri foydali komponentning qaysi konsentratsiyasiga erishish hisoblanadi?", "Sanoat konsentratsiyasiga (30 mg/l) erishishdir.", "Sulfat kislota konsentratsiyasining 5 g/l ga pasayishi.", "Karbonat miqdorining 2% dan pastga tushishi.", "Hujayra mahsuldorligining 100 m³/sutka ga yetishi."], ["2-jadvalga asosan, 180-07 uyasi uchun samarali quvvat (m) va prognoz kislotalanish vaqti qancha?", "Samarali quvvat 20 m, prognoz kislotalanish vaqti 33 kunlar.", "Samarali quvvat 22 m, prognoz kislotalanish vaqti 36 kunlar.", "Samarali quvvat 150 m, prognoz kislotalanish vaqti 73 sutka.", "Samarali quvvat 60 m, prognoz kislotalanish vaqti 144 sutka."], ["T = Vg / (24 ⋅ Q) formulasidagi \"Q\" harfi nima degan ma'noni anglatadi?", "Hujayra mahsuldorligi m³/soat.", "Sutkalik hujayra mahsuldorligi, m³/sutka.", "Qoʻshimcha nordonlik (kislotalilik), g/l.", "Kon massasining og'irligi, t."], ["Amaliy mashgʻulotning asosiy maqsadi oltingugurt kislotasini tejash imkoniyatlarini oʻrganish va nimalarni faollashtirish hisoblanadi?", "Yer osti yuvish jarayonini faollashtirish uchun azot kislotasidan reaktiv sifatida foydalanishni oʻrganish.", "Uran qazib olish samaradorligini oshirish maqsadida yangi ekstraksiya usullarini joriy etishni sinash.", "Quduqlarning mahsuldorligini kamaytiruvchi omillarni aniqlash hamda ularni bartaraf etish usullarini topish.", "Kimyoviy eritmalarning agressivligini kamaytirish va ularning atrof-muhitga ta'sirini baholashni tekshirish."], ["Uran qazib olishda nasos quduqlari mahsuldorligining pasayishiga olib keladigan asosiy sabablar qatoriga nimalar kiradi?", "Turli tuzlarning cho'kishi, gillarning shishishi, gazning calmatsiyasi va jinslarning o'tkazuvchanligining pasayishi.", "Nasos uskunalarining eskirishi, elektr ta'minotidagi uzilishlar hamda texnik xizmat ko'rsatishning etarli emasligi.", "Geologik tuzilishning murakkabligi, uran rudasining kam konsentratsiyasi va boshqa foydali komponentlarning mavjudligi.", "Yuvish eritmasining haroratining o'zgarishi, bosimning tushib ketishi hamda eritmalar tarkibidagi kimyoviy muvozanatning buzilishi."], ["Qazib olish jarayonida tadqiqot hujayralarining soni va ularning identifikatorlari qanday ko'rsatilgan?", "10-72-01.02 tadqiqot hujayralar ishtirok etadi va ular tahlil ob'ekti hisoblanadi.", "10-70-00.01 katakchalari asosiy ob'ekt bo'lib, keyinchalik ularning samaradorligi o'rganiladi.", "10-71-00.03 hujayralari asosida azot kislotasining ta'sirini o'rganish rejalashtirilgan edi.", "10-73-02.04 tadqiqot hujayralarida faqatgina sulfat kislota bilan yuvish ishlari olib borilgan."], ["Sulfat kislotasi yordamida yuvishda olingan ishchi eritmalarning oʻrtacha kislotaliligi necha g/l ni tashkil etgan?", "Oʻrtacha kislotalilik 19 g/l bo'lib, bu eritmaning ta'sirchanligini ko'rsatadi.", "Oʻrtacha kislotalilik 14 g/l bo'lib, bu normal me'yor hisoblanadi.", "Oʻrtacha kislotalilik 3,7 g/l bo'lib, bu juda past ko'rsatkich deb topilgan.", "Oʻrtacha kislotalilik 51 g/l bo'lib, bu eritmalar juda agressiv ekanligini bildiradi."], ["Sulfat kislotasi yordamida yuvishda mahsuldor eritmalardagi foydali komponentning oʻrtacha miqdori qancha bo'lgan?", "Oʻrtacha miqdor 120 mg/l ni tashkil etgan, bu optimal samaradorlikni ko'rsatadi.", "Oʻrtacha miqdor 300 mg/l ni tashkil etgan, bu juda yuqori natija hisoblanadi.", "Oʻrtacha miqdor 52,3 mg/l ni tashkil etgan, bu kutilganidan ancha past bo'lgan.", "Oʻrtacha miqdor 19 mg/l ni tashkil etgan, bu juda kam foydali komponent ekanligidan dalolat beradi."], ["Nitrat kislota (HNO₃) qo'shilgan samarali eritmalarda foydali komponentning o'rtacha miqdori qanchaga yetgan?", "O'rtacha miqdor 300 mg/l ni tashkil etgan, bu sezilarli yaxshilanishni ko'rsatadi.", "O'rtacha miqdor 120 mg/l ni tashkil etgan, bu sulfat kislota bilan bir xil darajada bo'lgan.", "O'rtacha miqdor 975,8 mg/l ni tashkil etgan, bu juda yuqori konsentratsiyani anglatgan.", "O'rtacha miqdor 4 g/l ni tashkil etgan, bu eritmalar tarkibidagi mutlaqo boshqa miqdor hisoblanadi."], ["Foydali komponentlarning yuqori miqdorini saqlash muddati nitrat kislota qo'llanilganda necha kunga yetgan?", "Saqlash muddati 20 kunni tashkil etgan, bu eritmalarning barqarorligini ko'rsatadi.", "Saqlash muddati 35 kunni tashkil etgan, bu uzoq muddatli barqarorlikni ta'minlagan.", "Saqlash muddati 10 kunni tashkil etgan, bu qisqa muddatli foydalanishni talab qilgan.", "Saqlash muddati 7 kunni tashkil etgan, bu eritmalar tez buzilganligini ko'rsatgan."], ["Kislotalash vaqtini hisoblash uchun berilgan formula qaysi variantda to'g'ri ko'rsatilgan?", "T = V₃₀ / (Q ⋅ 24), bu yerda T sutkada ifodalanadi.", "T = ΣV / (Q ⋅ 24), bu yerda T soatlarda ifodalanadi.", "T = (V₃₀ ⋅ C) / 1000, bu yerda T tonnalarda ifodalanadi.", "T = V₃₀ ⋅ 0,30, bu yerda T m³ da ifodalanadi."], ["Azot kislotasi sarfini (M(HNO₃)) aniqlash uchun ishlatiladigan formula qaysi variantda to'g'ri ko'rsatilgan?", "M(HNO₃) = (V₃₀ ⋅ C) / 1000, bu yerda M(HNO₃) sof azot kislotasi sarfini bildiradi.", "M(HNO₃) = (ΣV ⋅ Q) / 24, bu yerda M(HNO₃) umumiy eritma hajmini bildiradi.", "M(HNO₃) = V₃₀ / (Q ⋅ 24), bu yerda M(HNO₃) kislotalash vaqtini anglatadi.", "M(HNO₃) = 0,30 ⋅ ΣV, bu yerda M(HNO₃) g'ovak hajmining foizini bildiradi."], ["Berilgan formulalarda ΣV qanday fizik kattalikni anglatadi va uning birligi qanday?", "ΣV – hujayralarning umumiy gʻovak hajmi, m³ da ifodalanadi.", "ΣV – gʻovak hajmining 30% qismi, m³ da ifodalanadi.", "ΣV – eritmalarni uzatish vaqti, sutka da ifodalanadi.", "ΣV – eritmalarni uzatishning umumiy mahsuldorligi, m³/soat da ifodalanadi."], ["Formulalardagi Q belgisi nimani anglatadi va uning o'lchov birligi qanday ifodalanadi?", "Q – eritmalarni uzatishning umumiy mahsuldorligi, m³/soat birligida ko'rsatiladi.", "Q – gʻovak hajmining 30% qismi, m³ birligida ko'rsatiladi.", "Q – ishqorlanish uchun eritmalar soni, t birligida ko'rsatiladi.", "Q – azot kislotaning qo'shimcha nordonligi, g/l birligida ko'rsatiladi."], ["Tadqiqot metodikasiga ko'ra, 10-72-00,01,02,10 katakchalari uchun hisoblangan umumiy gʻovak hajmi qanchani tashkil etgan?", "Umumiy gʻovak hajmi 44800 m³ ni tashkil etgan, bu yig'indisi asosida hisoblangan.", "Umumiy gʻovak hajmi 13440 m³ ni tashkil etgan, bu g'ovak hajmining faqat bir qismi edi.", "Umumiy gʻovak hajmi 8400 m³ ni tashkil etgan, bu faqat bir quduqning ko'rsatkichi edi.", "Umumiy gʻovak hajmi 51360 ming m³ ni tashkil etgan, bu juda katta miqdor bo'lib, xato hisoblangan."], ["Tadqiqot metodikasida hisoblangan gʻovak hajmining 30% qismi qanchaga teng bo'lgan?", "Gʻovak hajmining 30% qismi 13440 m³ ni tashkil etgan, bu keyingi hisob-kitoblar uchun asos bo'lgan.", "Gʻovak hajmining 30% qismi 44800 m³ ni tashkil etgan, bu umumiy g'ovak hajmi bilan teng hisoblanadi.", "Gʻovak hajmining 30% qismi 16 m³ ni tashkil etgan, bu juda kichik qiymat bo'lib, noto'g'ri hisoblangan.", "Gʻovak hajmining 30% qismi 13.44 t ni tashkil etgan, bu og'irlik birligida berilgan va noto'g'ri."], ["Tadqiqot metodikasiga ko'ra, hisoblangan kislotalash vaqti necha sutkani tashkil etgan?", "Kislotalash vaqti 35 sutkani tashkil etgan, bu amaliyot uchun belgilangan muddat bo'lgan.", "Kislotalash vaqti 16 sutkani tashkil etgan, bu kutilganidan ancha qisqa muddat hisoblangan.", "Kislotalash vaqti 24 sutkani tashkil etgan, bu bir kun ichidagi soatlar soniga teng emas.", "Kislotalash vaqti 13440 sutkani tashkil etgan, bu juda uzoq muddat bo'lib, xato hisoblanadi."], ["Tadqiqot metodikasiga ko'ra, hisoblangan azot kislotasi sarfi (sof HNO₃) qanchani tashkil etgan?", "Azot kislotasi sarfi 13,44 t ni tashkil etgan, bu amaliyot uchun zarur bo'lgan miqdor edi.", "Azot kislotasi sarfi 975,8 t ni tashkil etgan, bu sulfat kislota sarfiga yaqin bo'lgan miqdor.", "Azot kislotasi sarfi 9 t ni tashkil etgan, bu boshqa bir ko'rsatkichda keltirilgan edi.", "Azot kislotasi sarfi 13440 t ni tashkil etgan, bu juda katta miqdor bo'lib, xato hisoblangan."], ["Eritmalarni quyish quduqlariga etkazib berishdan oldin qanday kimyoviy-analitik ishlar amalga oshiriladi?", "Kimyoviy tarkibni aniqlash, nasos va namunalar olish, filtr oralig'ining ochiqligini jurnalda qayd etish.", "Faqatgina harorat va bosim ko'rsatkichlarini tekshirish, shuningdek quduq devorlarining butunligini baholash.", "Quduqning umumiy chuqurligini o'lchash va eritmalar rangining o'zgarishini vizual tarzda nazorat qilish.", "Faqat eritmalar hajmini o'lchash va ularni saqlash uchun idishlar tayyorlash bilan cheklanishi kerak."], ["Sinov xaritasida qaysi eritmalar turlari kimyoviy-analitik ish uchun qayd etilgan?", "Sinov xaritasida ishchi eritmalar va mahsuldor eritmalar qayd etilgan.", "Sinov xaritasida faqatgina xlorid va sulfat eritmalar ko'rsatilgan.", "Sinov xaritasida faqat injeksiya va yuvish eritmalarining tarkibi yozilgan.", "Sinov xaritasida faqat neytral va ishqoriy eritmalar haqida ma'lumotlar berilgan."], ["10-7 konda ishchi eritmalardagi sulfat kislota konsentratsiyasi qanchani tashkil etgan?", "Sulfat kislota konsentratsiyasi 14 g/l ni tashkil etgan, bu muhim parametr edi.", "Sulfat kislota konsentratsiyasi 19 g/l ni tashkil etgan, bu yuqori kislotalilik darajasi edi.", "Sulfat kislota konsentratsiyasi 1 g/l ni tashkil etgan, bu juda past qiymat hisoblangan.", "Sulfat kislota konsentratsiyasi 4 g/l ni tashkil etgan, bu boshqa bir kislotaning ko'rsatkichi edi."], ["Ishqorlanish jarayoni hujayra g'ovak hajmining necha foiziga etguncha davom etadi?", "Ishqorlanish jarayoni hujayra g'ovak hajmining 30% o'tib ketguncha davom etadi.", "Ishqorlanish jarayoni hujayra g'ovak hajmining 50% o'tib ketguncha davom etadi.", "Ishqorlanish jarayoni hujayra g'ovak hajmining 78,3% o'tib ketguncha davom etadi.", "Ishqorlanish jarayoni hujayra g'ovak hajmining 10% o'tib ketguncha davom etadi."], ["Nitrat kislota (HNO₃) ning qo'shimcha nordonligi qanday qiymatda ko'rsatilgan?", "Nitrat kislotaning qo'shimcha nordonligi 4 g/l ni tashkil etganligi belgilangan edi.", "Nitrat kislotaning qo'shimcha nordonligi 1 g/l ni tashkil etganligi, bu ishchi eritmada edi.", "Nitrat kislotaning qo'shimcha nordonligi 14 g/l ni tashkil etganligi, bu boshqa kislota konsentratsiyasi edi.", "Nitrat kislotaning qo'shimcha nordonligi 13.5 t ni tashkil etganligi, bu miqdor birligi bo'yicha noto'g'ri."]]}, {"name": "Foydali qazilmalarni boyitish va qayta ishlash asoslari", "q": [["Foydali qazilmalarni boyitish jarayonining asosiy texnologik maqsadi nima?", "Foydali komponent miqdorini oshirib, keraksiz jinslarni ajratishdir", "Rudaning qattiqlik darajasini pasaytirib, yangi birikmalar yaratishdir", "Faqat metall zarrachalarining umumiy massaviy zichligini oshirishdir", "Foydali minerallarni to‘liq eritib, sof suyuq qotishma holiga keltirish"], ["Boyitish mahsulotlaridan biri bo‘lgan konsentrat tushunchasiga qaysi javobda to‘g‘ri ta’rif berilgan?", "Foydali komponent miqdori dastlabki rudaga nisbatan yuqori bo‘lgan mahsulot", "Tarkibida foydali minerallar umuman bo‘lmagan keraksiz tog‘ jinsi qoldiqlari", "Texnologik jihatdan qayta boyitishga yaroqsiz bo‘lgan yakuniy chiqindi massasi", "Maydalash va yanchish jarayonlaridan keyin olingan oraliq fraksiyalar yig‘indisi"], ["Mineral xomashyoni boyitish jarayonida oraliq mahsulot qanday tavsiflanadi?", "Tarkibida foydali komponent bo‘lib, qayta boyitishni talab etuvchi mahsulot", "Iqtisodiy jihatdan qayta ishlashga mutlaqo yaroqsiz bo‘lgan chiqindi moddasi", "Tarkibida sof metall miqdori belgilangan standartdan yuqori bo‘lgan konsentrat", "Asosiy boyitish bosqichidan so‘ng to‘g‘ridan-to‘g‘ri metallurgiyaga ketuvchi qism"], ["Rudani asosiy boyitishga tayyorlash jarayonlariga quyidagilarning qaysi biri kiradi?", "Maydalash, yanchish, elash va gidravlik tasniflash operatsiyalari", "Konsentratni quritish, filtrlash va quyuqlashtirish operatsiyalari", "Chiqindilarni zararsizlantirish va qayta aylanma suv bilan ta’minlash", "Reagentlar qo‘shish, ko‘pik hosil qilish va havoni puflash amallari"], ["Maydalash jarayonidan yanchish jarayonining asosiy farqi nimadan iborat?", "Yanchishda material zarrachalari o‘ta mayda o‘lchamlargacha maydalanadi", "Yanchish faqat yirik bo‘lakli ma’danlarni parchalash jarayonini ifodalaydi", "Yanchishda zarrachalar faqat geometrik o‘lchamlari bo‘yicha elakda saralanadi", "Yanchish jarayoni faqat kimyoviy reagentlar ishtirokida eritmada kechadi"], ["Gravitatsion boyitish usuli qaysi asosiy fizik xususiyatga tayanadi?", "Minerallarning zichligi va harakatlanish trayektoriyasidagi farqlariga", "Zarrachalarning elektr zaryadlanishi va o‘tkazuvchanlik darajalariga", "Mineral sirtining suv bilan ho‘llanish hamda yopishish xususiyatlariga", "Materiallarning magnit maydoniga tortilish kuchi va sezuvchanligiga"], ["Quyidagi texnologik uskunalarning qaysi guruhi gravitatsion boyitishda qo‘llaniladi?", "Cho‘ktirish mashinalari, konsentratsion stollar va spiral separatorlar", "Barabanli magnit separatorlar, flotomashinalar va induksion pechlar", "Gidrosiklonlar, diskli vakuum-filtrlar va barabanli quritish uskunalari", "Elektrostatik separatorlar, sharli tegirmonlar va tebranma elaklar"], ["Flotatsiya jarayonining asosiy fizik-kimyoviy mexanizmi nimalarga tayanadi?", "Mineral donachalari sirtining suv bilan turli darajada ho‘llanishiga", "Minerallarning magnit maydonida turlicha magnitlanish xossalariga", "Zarrachalarning o‘lchami va ularning elak teshigidan o‘tish qobiliyatiga", "Mineral zarrachalarining nisbiy zichligi hamda cho‘kish tezliklariga"], ["Flotatsiya jarayonida yig‘uvchi (kollektor) reagentlarning asosiy vazifasi nima?", "Ajratib olinadigan foydali mineral yuzasining gidrofobligini oshirish", "Pulpada barqaror havo ko‘piklari hosil bo‘lish tezligini pasaytirish", "Pulpada mineral zarrachalarining erish jarayonini butunlay to‘xtatish", "Barcha minerallarning sirtini bir xilda to‘liq gidrofil holatga keltirish"], ["Flotatsiya jarayonida sozlovchi reagentlar nima maqsadda qo‘shiladi?", "Pulpaning pH ko‘rsatkichini va mineral sirtining holatini boshqarish", "Faqat ko‘pik pufakchalarining hajmini va mustahkamligini oshirish", "Zarrachalarning magnitlanish kuchini keskin darajada kuchaytirish", "Pulpa haroratini pasaytirib, cho‘kish jarayonlarini tezlashtirish"], ["Kuchsiz magnitli minerallarni (masalan, gematitni) ajratish uchun qanday maydon talab etiladi?", "Yuqori intensivlikka va yuqori gradientga ega kuchli magnit maydoni", "Past intensivlikdagi o‘zgarmas kuchsiz elektr va magnit maydonlari", "Faqat suyuqlik oqimi yordamida hosil qilinuvchi kuchsiz magnit maydoni", "Gravitatsiya kuchi bilan tenglashtirilgan past chastotali maydon"], ["Elektr usulida boyitish jarayoni qaysi asosiy parametrlar farqiga tayanadi?", "Minerallarning elektr o‘tkazuvchanligi va zaryadlanish xususiyatiga", "Minerallarning suvda eruvchanligi va zichlik xususiyatlarining farqiga", "Zarrachalarning o‘lchami va ularning qattiqlik darajasining nisbatiga", "Rudalarning nur sindirish va rang intensivligi ko‘rsatkichlariga"], ["Ko‘p bosqichli boyitish sxemasida qayta tozalash operatsiyasining vazifasi nima?", "Birlamchi konsentratdagi keraksiz minerallarni kamaytirib, sifatni oshirish", "Chiqindi tarkibidagi barcha qimmatbaho metallarni qayta ajratib olish", "Ruda bo‘laklarini ikkinchi marotaba maydalagich orqali qayta yanchish", "Hosil bo‘lgan tayyor konsentratni suvsizlantirish va quritishga uzatish"], ["Boyitish sxemasida nazorat boyitish operatsiyasi qanday maqsadni bajaradi?", "Asosiy boyitish chiqindilarida qolgan foydali komponentlarni ajratib olish", "Konsentrat tarkibidagi begona minerallar ulushini nolgacha kamaytirish", "Dastlabki ruda massasidagi yirik toshlarni dastlabki bosqichda saralash", "Tayyor konsentratning namlik ko‘rsatkichlarini me’yor darajasiga keltirish"], ["Yopiq siklli yanchish va tasniflash sxemasining asosiy afzalligi nimadan iborat?", "Zarracha o‘lchamini to‘g‘ri boshqarish va ortiqcha maydalanishni cheklash", "Rudadagi barcha metallarni bir bosqichda to‘liq ajratib olish imkoni", "Kimyoviy reagentlar sarfini va elektr energiyasi sarfini yo‘qqa chiqarish", "Konveyer tizimlariga tushadigan mexanik kuchlanishni butunlay to‘xtatish"], ["Konsentrat chiqishi (γₖ) qaysi formula yordamida aniqlanadi?", "γₖ = (mₖ / mᵣ) × 100%", "γₖ = (mᵣ / mₖ) × 100%", "γₖ = (m_ch / mᵣ) × 100%", "γₖ = (mₖ / m_ch) × 100%"], ["Foydali komponentning konsentratga ajratib olinish darajasi (ε) qaysi formula orqali hisoblanadi?", "ε = (mₖβ / mᵣα) × 100%", "ε = (mᵣα / mₖβ) × 100%", "ε = (m_chθ / mᵣα) × 100%", "ε = (mₖα / mᵣβ) × 100%"], ["1000 t mis rudasidan (α = 1.2%) 50 t konsentrat (β = 18%) olinsa, chiqindi massasi qancha bo‘ladi?", "950 t chiqindi hosil bo‘ladi", "850 t chiqindi hosil bo‘ladi", "900 t chiqindi hosil bo‘ladi", "980 t chiqindi hosil bo‘ladi"], ["1000 t rudadan (α = 1.2%) 50 t konsentrat (β = 18%) olinganda misning ajratib olinish darajasi (ε) qancha?", "Misning ajratib olinish darajasi 75% ni tashkil etadi", "Misning ajratib olinish darajasi 60% ni tashkil etadi", "Misning ajratib olinish darajasi 85% ni tashkil etadi", "Misning ajratib olinish darajasi 90% ni tashkil etadi"], ["Zamonaviy boyitish fabrikalarida ekologik samaradorlikni oshirishning asosiy yo‘nalishi nima?", "Suvni yopiq aylanma tizimda ishlatish va chiqindilarni xavfsiz saqlash", "Ruda maydalash jarayonini to‘xtatib, kimyoviy eritishga to‘liq o‘tish", "Boyitish jarayonlarida faqat ochiq siklli texnologik sxemalarni qo‘llash", "Faqat bir bosqichli gravitatsion ajratish uskunalarini joriy qilish"], ["Foydali qazilmalarni boyitish texnologiyasida g'alvirlash jarayoniga qanday ta'rif beriladi?", "Mineral zarrachalarni ularning geometrik o'lchamlariga qarab sinflarga ajratish jarayoni hisoblanadi.", "Tog' jinslarini zichlik ko'rsatkichlari bo'yicha alohida fraksiyalarga ajratish jarayoni hisoblanadi.", "Tog' massasini magnit xususiyatlari asosida turlicha guruhlarga saralab ajratish jarayoni hisoblanadi.", "Xomashyoni namlik darajasiga tayangan holda sifatli komponentlarga tozalash jarayoni hisoblanadi."], ["G'alvirlash jarayonida panjara ustida qolgan mahsulot texnologik jihatdan qanday belgilanadi?", "+d sinf ya'ni elak teshigi o'lchamidan yirik bo'lgan yuqori mahsulot ko'rinishida belgilanadi.", "-d sinf ya'ni elak teshigi o'lchamidan kichik bo'lgan quyi mahsulot ko'rinishida belgilanadi.", "=d sinf ya'ni elak teshigi o'lchamiga to'liq teng bo'lgan o'rta mahsulot ko'rinishida belgilanadi.", "±d sinf ya'ni elak yuzasida qoldiq hosil qilgan oraliq mahsulot ko'rinishida belgilanadi."], ["G'alvirlash natijasida elak to'qimasining teshiklaridan o'tgan mahsulot qanday ifodalanadi?", "-d sinf ya'ni o'lchami to'r o'lchamidan kichik bo'lgan panjara osti mahsuloti sifatida ifodalanadi.", "+d sinf ya'ni o'lchami to'r o'lchamidan yirik bo'lgan panjara usti mahsuloti sifatida ifodalanadi.", "kd sinf ya'ni konsentratsiya jarayoniga yuboriladigan oraliq zichlikdagi qoldiq sifatida ifodalanadi.", "0d sinf ya'ni changsimon zarrachalardan tozalangan maxsus elama mahsuloti sifatida ifodalanadi."], ["Mineral xomashyoni qayta ishlashda g'alvirlash shkalasi tushunchasi nimani anglatadi?", "Elak to'qimalari mutlaq o'lchamlarining kattadan kichikka qarab tuzilgan ketma-ketlik qatoridir.", "G'alvirlash jarayonining umumiy vaqt davomida erishgan texnik mahsuldorlik ko'rsatkichi qatoridir.", "Panjara yuzasidagi tirqishlarning joylashuv tartibi hamda geometrik burchaklari qatoridir.", "Saralanayotgan tog' massasining o'rtacha zichligi va qattiqlik darajalari ketma-ketligi qatoridir."], ["G'alvirlash shkalasining moduli deb quyidagi qaysi nisbatga aytiladi?", "Oldin keladigan to'qima o'lchamining keyin keladigan to'qima o'lchamiga bo'lgan doimiy nisbatidir.", "Panjara usti mahsuloti miqdorining panjara ostidan o'tgan umumiy mahsulotga bo'lgan doimiy nisbatidir.", "G'alvir ishchi yuzasi maydonining unga berilayotgan xomashyo hajmiy oqimiga bo'lgan doimiy nisbatidir.", "Elak tebranish amplitudasining uning burchak tezligi hamda aylanish soniga bo'lgan doimiy nisbatidir."], ["Foydali qazilmalarni boyitish sxemasida mustaqil g'alvirlarning asosiy vazifasi nimadan iborat?", "Tayyor tovar mahsulotlarini qo'shimcha ishlovsiz faqat standart o'lchamli sinflarga ajratib beradi.", "Xomashyoni keyingi gravitatsion yoki flotatsion boyitish jarayonlariga to'liq tayyorlab beradi.", "Yirik bo'laklarni ajratib maydalagichga uzatadi va oraliq donadorlikni doimiy nazorat qilib turadi.", "Rudani maydalashdan oldin uning tarkibidagi ortiqcha namlik hamda loyli birikmalarni yuvib beradi."], ["Boyitish korxonalarida tayyorlab beruvchi g'alvirlar qanday texnologik maqsadda ishlatiladi?", "Xomashyoni gravitatsiya yoki elektromagnit separatsiyasi kabi boyitish usullariga tayyorlaydi.", "Tayyor bo'lgan toshko'mir va temir rudalarini to'g'ridan-to'g'ri iste'molchilarga saralab beradi.", "Maydalash apparatining ishchi kamerasidan chiqayotgan donadorlik sifatini nazorat qilib boradi.", "Qurilish materiallarining qattiqlik darajasini aniqlash uchun laboratoriya tahlillarini bajaradi."], ["Maydalash siklida yordamchi g'alvirlarning bajaradigan asosiy funksiyasi nima hisoblanadi?", "Yirik zarrachalarni maydalagichga yo'naltirish va ortiqcha yirik bo'laklar o'tishini nazorat qilishdir.", "Faqat tayyor mahsulotni iste'mol standartlari bo'yicha yakuniy navlarga taqsimlab saralashdir.", "Maydalash jarayonida hosil bo'ladigan chang va loy qatlamlarini kimyoviy reagentlar bilan yuvishdir.", "Boyitilgan konsentrat tarkibidagi metall miqdorini aniqlash maqsadida namuna olish ishlaridir."], ["Yordamchi g'alvirlar maydalash jarayoniga nisbatan qanday ikki guruhga bo'linadi?", "Oldingi (predvaritelnyy) hamda nazoratchi (kontrolnyy yoki poverochnyy) g'alvirlarga bo'linadi.", "Birlamchi (asosiy) hamda ikkilamchi (yakuniy tozalovchi) saralash g'alvirlariga bo'linadi.", "Gravitatsion (og'irlik kuchi asosidagi) hamda majburiy titratma mexanizmlarga bo'linadi.", "Gorizontal o'rnatilgan hamda vertikal yo'nalishda aylanuvchi barabanli elaklarga bo'linadi."], ["AQSh texnologik tizimida qabul qilingan 'mesh' atamasi nimani ifodalaydi?", "Elak to'qimasining bir chiziqli dyuymidagi teshiklar (ko'zlar) sonini ifodalovchi birlikdir.", "G'alvir to'rining bir kvadrat metr yuzasiga to'g'ri keluvchi umumiy og'irlik yuklamasidir.", "Bir soat mobaynida elakdan o'tgan quruq xomashyoning umumiy tonna miqdoridagi massasidir.", "Tog' jinsining maydalanishga nisbatan ko'rsatadigan fizik-mexanik mustahkamlik darajasidir."], ["Zamonaviy shkalalarda elak to'qimalarining asosiy boshlang'ich o'lchami qancha qilib belgilangan?", "Standart asos sifatida 0,074 mm qabul qilingan bo'lib, hisob-kitoblar shunga tayanadi.", "Standart asos sifatida 0,500 mm qabul qilingan bo'lib, hisob-kitoblar shunga tayanadi.", "Standart asos sifatida 1,410 mm qabul qilingan bo'lib, hisob-kitoblar shunga tayanadi.", "Standart asos sifatida 0,025 mm qabul qilingan bo'lib, hisob-kitoblar shunga tayanadi."], ["Yirik g'alvirlash sinfiga xos bo'lgan bo'lak va elak to'qimasi o'lchamlari qaysi javobda to'g'ri berilgan?", "Bo'lak kattaligi 1200 mm gacha bo'lib, elak to'qimalarining o'lchami 300 dan 100 mm gachadir.", "Bo'lak kattaligi 300 mm gacha bo'lib, elak to'qimalarining o'lchami 60 dan 25 mm gachadir.", "Bo'lak kattaligi 75 mm gacha bo'lib, elak to'qimalarining o'lchami 25 dan 6 mm gachadir.", "Bo'lak kattaligi 10 mm gacha bo'lib, elak to'qimalarining o'lchami 6 dan 0,5 mm gachadir."], ["O'rta g'alvirlash sinfi bo'yicha ruda bo'lagi va elak to'qimasi o'lchamlari qanday nisbatg
