qilish» tushunchalari oʻrtasidagi munosabatni tavsiflang.", "Metrologik ta'minlash sifat nazoratida foydalaniladigan oʻlchashlarning ishonchliligi uchun metrologik asos yaratadi.", "Bu ikki tushuncha mutlaqo bir xil ma'noni anglatadi va ularni bir-birining o'rniga ishlatsa bo'ladi.", "Mahsulot sifatini nazorat qilish faqat yakuniy mahsulotni baholashga qaratilgan, metrologiya esa faqat texnik jarayonlarni qamrab oladi.", "Metrologik ta'minlash faqat hujjatlashtirish bilan bog'liq bo'lsa, sifat nazorati faqat ishlab chiqarishdagi xatolarni tuzatishga xizmat qiladi."], ["Konchilikda metrologik ta'minlashning xavfsizlikdagi oʻrni nimadan iborat?", "Xavfsizlikka oid qarorlar qabul qilinadigan oʻlchash ma'lumotlarining ishonchliligini ta'minlashga xizmat qiladi.", "Metrologik ta'minlash to'g'ridan-to'g'ri barcha xavfsizlik qoidalarini o'z ichiga oladi va ularning o'rnini to'liq bosadi.", "U konchilik jarayonlarida favqulodda vaziyatlarning oldini olish uchun faqat avtomatik signalizatsiya tizimini joriy etadi.", "Metrologik ta'minlash asosan xavfsizlik xizmati xodimlarining malakasini oshirishga qaratilgan o'quv dasturlarini belgilaydi."], ["Konchilikda qoʻllaniladigan asosiy oʻlchash vositalaridan biri sifatida “Sarf o'lchagichlar”ning qoʻllanish sohasi qaysi?", "Suv, havo, gaz, pulpa va boshqa oqimlarni nazorat qilishda keng qo'llaniladi.", "Ishlab chiqarish joylarida shovqin darajasini aniqlash va uni kamaytirish choralarini ko'rishda ishlatiladi.", "Konchilik mahsulotlarining erish va qaynash nuqtasini belgilash uchun maxsus laboratoriya sharoitlarida qo'llaniladi.", "Uskunalarning vibratsiya darajasini nazorat qilish va ularning mexanik barqarorligini baholash uchun ishlatiladi."], ["Metrologik ta'minlashni tashkil etish ketma-ketligida birinchi qadam qaysi javobda to'g'ri ko'rsatilgan?", "Korxonadagi barcha muhim o'lchashlar va oʻlchash vositalarini inventarizatsiya qilish zarur.", "Barcha xodimlar uchun majburiy metrologiya bo'yicha imtihonlar o'tkazishni tashkil etish.", "Korxona rahbariyatini metrologiya masalalari bo'yicha xalqaro konferensiyaga yuborish.", "Yangi o'lchash vositalarini sotib olish uchun xalqaro tender e'lon qilishni boshlash."], ["Oʻzbekiston Respublikasining 'Metrologiya toʻgʻrisida'gi Qonuniga koʻra, metrologiyaga oid faoliyatning asosiy vazifalaridan biri nimani ta'minlashdan iborat?", "Oʻlchashlarning yagona birlikda boʻlishini, ishonchsiz natijalarning oldini olishni va metrologik kuzatiluvchanligini ta'minlashdan iboratdir.", "Faqatgina sanoat korxonalarida ishlab chiqarish jarayonlarining samaradorligini oshirish va texnologik xavfsizlikni kafolatlashdan iboratdir.", "Barcha turdagi mahsulotlarning eksport salohiyatini oshirish va ichki bozorni toʻldirish uchun me'yoriy hujjatlarni ishlab chiqishdan iboratdir.", "Ilmiy-tadqiqot ishlari uchun yangi oʻlchash usullarini va asboblarini yaratishni, ularni davlat roʻyxatidan oʻtkazishni boshqarishdan iboratdir."], ["Konchilik mahsulotlariga qaysi turdagi materiallar kiradi?", "Foydali qazilmalarni qazib olish natijasida olinadigan rudalar, koʻmir, qurilish materiallari uchun mineral xomashyo va boyitish mahsulotlari kiradi.", "Faqatgina qimmatbaho metallar va nodir yer elementlari, shuningdek, ulardan tayyorlangan yuqori texnologik buyumlar toifasi konchilik mahsulotlariga kiritiladi.", "Dengiz tubidan olinadigan neft va gaz mahsulotlari, shuningdek, qayta ishlangan neft-kimyo sanoati materiallari konchilik mahsulotlari hisoblanadi.", "Qishloq xoʻjaligi ekinlari uchun organik oʻgʻitlar, ozuqa qoʻshimchalari va genetik jihatdan modifikatsiyalangan urugʻlik materiallari kiradi."], ["Konchilikda 'bosim' ko'rsatkichini o'lchash qaysi tizimlarda qo'llaniladi?", "Gidravlik va pnevmatik tizimlar, quvurlar va boshqa texnologik uskunalarda samarali ishlashini ta'minlash uchun keng qoʻllaniladi.", "Elektr generatorlarining quvvatini nazorat qilish va elektr energiyasini iste'mol qilish samaradorligini oshirish uchun ishlatiladi.", "Tashish vositalarining tezligini va yuk koʻtarish qobiliyatini nazorat qilish, shuningdek, logistika jarayonlarini optimallashtirish uchun qoʻllaniladi.", "Atrof-muhitdagi shovqin darajasini kamaytirish va ishchi sharoitlarini yaxshilash maqsadida ventilyatsiya tizimlarida qoʻllaniladi."], ["Konchilik korxonasida metrologik ta'minlashning asosiy maqsadlaridan biri qaysi?", "O'lchash natijalarining yagona birlikda ifodalanishini, ishonchsiz natijalarning oldini olishni va texnologik jarayonlarni aniq nazorat qilishni ta'minlashdir.", "Korxonaning barcha xodimlarining malakasini oshirish va ularning kasbiy mahoratini doimiy ravishda takomillashtirishga qaratilgan faoliyatdir.", "Ishlab chiqarish quvvatini maksimal darajaga yetkazish va mahsulot tannarxini kamaytirish uchun innovatsion texnologiyalarni joriy etishni maqsad qilgan.", "Mahsulotlarning ichki va tashqi bozorlarda savdo hajmini oshirish, shuningdek, yangi bozorlarga chiqish uchun marketing strategiyalarini ishlab chiqishdir."], ["Metrologik ta'minlash obyektlari faqat o'lchash asbobining oʻzini tekshirishdan iborat emas. Ular nimani ham qamrab oladi?", "U oʻlchash vositalari va tizimlarini, o'lchash uslubiyotlarini, etalonlarni, sinov vositalarini, shuningdek, oʻlchash sharoitlari va natijalarni qayta ishlash usullarini qamrab oladi.", "U faqatgina texnologik jarayonlarning samaradorligini oshirish uchun moʻljallangan ishlab chiqarish uskunalari va ularning ishlash koʻrsatkichlarini nazorat qilishni qamrab oladi.", "U faqatgina korxonaning barcha xodimlarining mehnat xavfsizligini ta'minlashga qaratilgan choralarni, jumladan, maxsus kiyim va himoya vositalarining sifatini nazorat qilishni qamrab oladi.", "U faqatgina sotiladigan mahsulotlarning qadoqlash jarayonlarini, ularni saqlash muddatlarini va logistika xarajatlarini optimallashtirishga qaratilgan faoliyatlarni qamrab oladi."], ["Massa ko'rsatkichini o'lchash uchun konchilikda qaysi o'lchash vositalari qo'llaniladi?", "Massa ko'rsatkichini o'lchash uchun odatda tarozi va avtomatik tortish tizimlari kabi o'lchash vositalari keng qo'llaniladi.", "Massa ko'rsatkichini o'lchash uchun asosan manometrlar, termojuftlar va bosim datchiklari kabi o'lchash vositalari ishlatiladi.", "Massa ko'rsatkichini o'lchash uchun ko'pincha ampermetrlar, voltmetrlar va quvvat o'lchagichlar kabi asboblar qo'llaniladi.", "Massa ko'rsatkichini o'lchash uchun ruletkalar, shtangensirkullar va lazerli o'lchash vositalaridan foydalaniladi."], ["Elektr kattaliklarini (kuchlanish, tok, quvvat) nazorat qilish uchun qanday o'lchash vositalari ishlatiladi?", "Elektr kattaliklarini nazorat qilish uchun ampermetr, voltmetr, quvvat va energiya o'lchagichlar kabi asboblar qoʻllaniladi.", "Elektr kattaliklarini nazorat qilishda asosan termometr, termojuft, harorat datchigi kabi o'lchash vositalari ishlatiladi.", "Elektr kattaliklarini nazorat qilish uchun ko'pincha granulometrik analizatorlar va saralash tizimlari qo'llaniladi.", "Elektr kattaliklarini nazorat qilish uchun tarozi, avtomatik tortish tizimlari va massa hisoblagichlaridan foydalaniladi."], ["O'lchash vositasining 'Qiyoslash' tushunchasi nimani anglatadi?", "Qiyoslash o'lchash vositasining belgilangan metrologik talablarga muvofiqligini aniqlash va tasdiqlashga qaratilgan operatsiyalar ketma-ketligidir.", "Qiyoslash o'lchash vositasining texnik holatini muntazam ravishda tekshirish va uni ta'mirlash uchun amalga oshiriladigan profilaktika tadbirlari majmuasidir.", "Qiyoslash o'lchash vositasining dizaynini yaxshilash va uning funksional imkoniyatlarini kengaytirish uchun olib boriladigan modifikatsiya jarayonidir.", "Qiyoslash o'lchash vositasining narxini aniqlash va uning bozor qiymatini belgilash uchun amalga oshiriladigan iqtisodiy tahlil jarayonidir."], ["O'lchash vositasining 'Kalibrlash' tushunchasi nimani ifodalaydi?", "Kalibrlash o'lchash vositasining metrologik tavsiflarini aniqlashga qaratilgan operatsiyalar majmuidir, bu uning aniqligini belgilaydi.", "Kalibrlash o'lchash vositasini saqlash va tashish uchun tegishli sharoitlarni ta'minlashga qaratilgan logistika va omborxona jarayonidir.", "Kalibrlash o'lchash vositasining ish faoliyatini to'xtatish va uni saqlash uchun yopiq holatga keltirishni anglatuvchi texnik jarayon hisoblanadi.", "Kalibrlash o'lchash vositasini sotib olish uchun zarur boʻlgan moliyaviy resurslarni aniqlash va byudjetni tasdiqlash jarayonini ifodalaydi."], ["'Metrologik kuzatiluvchanlik' deganda nimani tushunasiz?", "O'lchash natijasining hujjatlashtirilgan, uzluksiz kalibrlash yoki qiyoslash zanjiri orqali tegishli etalonga bog'lanishini ta'minlashdir.", "O'lchash vositalarini ishlab chiqarish jarayonida ularning texnik xususiyatlarini doimiy ravishda monitoring qilish va ularni nazorat qilish tizimi.", "O'lchash laboratoriyalarining xalqaro akkreditatsiyadan o'tganligini va ularning faoliyati xalqaro standartlarga muvofiqligini tasdiqlovchi hujjat.", "O'lchash vositalarini turli xil atrof-muhit sharoitlarida sinovdan o'tkazish va ularning ishlash barqarorligini baholash uchun qo'llaniladigan usul."], ["Oʻlchash natijasining sifati faqat asbobning aniqligiga bog'liq emas. Yana qaysi omillar muhim rol oʻynaydi?", "Oʻlchash usuli, namuna olish, oʻlchash sharoiti, operator harakati va natijalarni qayta ishlash tartibi ham muhim rol oʻynaydi.", "Faqatgina oʻlchash vositasining ishlab chiqaruvchisi va uning bozor narxi, shuningdek, sotuvdan keyingi xizmat ko'rsatish shartlari muhimdir.", "Asosan oʻlchash vositasining tashqi koʻrinishi, uning ergonomikasi va foydalanuvchi interfeysining qulayligi muhim ahamiyatga ega.", "Oʻlchash natijasining sifati asbobning ogʻirligi, hajmi va uning ishlatiladigan materiallarining turi bilan bevosita bogʻliqdir."], ["Konchilikda metrologik ta'minlashning 'Qazib olish' bosqichida qanday parametrlar nazorat qilinadi?", "Qazib olish bosqichida texnologik parametrlar, massa, bosim, harorat, elektr kattaliklari va boshqa koʻrsatkichlar nazorat qilinadi.", "Qazib olish bosqichida faqat geologik qatlamlarning yoshi, ularning geokimyoviy tarkibi va paydo bo'lish sharoitlari nazorat qilinadi.", "Qazib olish bosqichida asosan mahsulotning granulometrik tarkibi, uning namlik darajasi va saqlash sharoitlari monitoring qilinadi.", "Qazib olish bosqichida transport jarayonlarining tezligi, yo'l sirtining holati va yonilg'i sarfi kabi logistik koʻrsatkichlar nazorat qilinadi."], ["Konchilik korxonasida metrologik ta'minlashni tashkil etishning birinchi bosqichi nimalarni o'z ichiga oladi?", "Korxonadagi barcha muhim o'lchashlar va oʻlchash vositalarini inventarizatsiya qilishni, shuningdek, ularning qoʻllanish sohasini aniqlashni o'z ichiga oladi.", "Xodimlarni metrologiya bo'yicha o'qitish dasturlarini ishlab chiqishni va ularni malakasini oshirish bo'yicha kurslarni tashkil etishni o'z ichiga oladi.", "Yangi metrologik standartlarni ishlab chiqishni va mavjud standartlarga o'zgartirishlar kiritishni, shuningdek, ularni tasdiqlash jarayonini o'z ichiga oladi.", "Xalqaro metrologiya tashkilotlari bilan hamkorlik shartnomalarini imzolashni va ularning tajribasini konchilik sanoatiga joriy etishni o'z ichiga oladi."], ["Metrologiya fan va amaliy faoliyat sohasi sifatida nimani oʻrganadi va nimaga mas’uldir?", "Oʻlchashlarni, ularning birliklari, usullari, vositalari hamda ularning aniqligi va birliligini ta'minlashni oʻz ichiga oladi.", "Mahsulotlar sifatini boshqarish jarayonlari, standartlar joriy etish va texnik talablar samaradorligini oʻrganishga bagʻishlangan.", "Xizmatlarning xavfsizlik talablariga muvofiqligini tasdiqlash uchun tizimlarni, iste'molchilar huquqlarini himoya qilishni tahlil qiladi.", "Ishlab chiqarish jarayonida xomashyo narxlarini hisoblash, yetkazib berish va sotish logistikasini optimallashtirish bilan bog'liqdir."], ["Oʻlchashlar birliligi deganda o'lchash natijalari qanday shartlarga muvofiq bo'lishi tushuniladi?", "Natijalar qonuniy birliklarda ifodalangan va aniqlik koʻrsatkichlari belgilangan chegaralarda bo'lgan holat.", "Oʻlchash natijalari xalqaro laboratoriyalarning tavsiyalariga mos kelishi va milliy qoidalarga zid bo'lmagan holat.", "Har bir oʻlchash jarayonida faqatgina bitta oʻlchash vositasidan foydalanishni talab qiluvchi aniq va yagona holat.", "Olingan oʻlchash natijalari faqat mahalliy standartlarga muvofiq bo'lishi va mutlaqo oʻzgarmas qoidalarga asoslangan holat."], ["Sertifikatlashtirishning asosiy vazifasi qanday savolga xolis va asoslangan javob berishdan iborat?", "Ushbu mahsulot yoki xizmat belgilangan talablarga javob beradimi, degan savolga toʻliq va ishonchli javob berish.", "Mahsulotning narxi uning sifatiga mos keladimi, degan savolga iste'molchi uchun foydali boʻlgan javob berish.", "Ishlab chiqaruvchi bozordagi raqobatga bardosh bera oladimi, degan savolga iqtisodiy tahlilga asoslangan javob berish.", "Xizmat koʻrsatish darajasi mijozlarning eng yuqori talablariga javob beradimi, degan savolga subyektiv javob berish."], ["Metrologiya, standartlashtirish va sertifikatlashtirish sohalarining birgalikdagi maqsadi nimadan iborat?", "Inson hayoti va sog'lig'ini, mol-mulkni, atrof-muhitni hamda iqtisodiy manfaatlarni himoya qilishni ta'minlash.", "Faqatgina davlat nazoratini kuchaytirish va ishlab chiqaruvchilarga yangi cheklovlar kiritishni asosiy vazifa deb bilish.", "Mahsulotlarni faqatgina ichki bozorda tarqatish va xalqaro savdo qoidalariga rioya qilmaslik uchun tizim yaratish.", "Yangi texnologiyalarni joriy etish orqali xarajatlarni kamaytirish va iste'molchi uchun narxlarni doimiy ravishda pasaytirish."], ["Davlat nazoratining asosiy maqsadi Metrologiya, Standartlashtirish va Muvofiqlikni baholash sohalarida nimani ta'minlashdir?", "Belgilangan qonunchilik va texnik talablarning doimiy ravishda bajarilishini toʻliq ta'minlash.", "Yangi ishlab chiqarish texnologiyalarini rivojlantirishga doimiy yordam berish va ularni moliyalashtirishni ta'minlash.", "Iste'molchilarning barcha shaxsiy talablarini qondirish hamda ularning individual xohishlarini inobatga olish.", "Mahsulot sifatini faqatgina eksportga yoʻnaltirilgan kompaniyalar uchun nazorat qilishni qonunan ta'minlash."], ["Metrologiya tizimida 'Oʻlchash natijalarining ishonchliligi' prinsipining mohiyati nimada?", "Oʻlchash natijalarining doimiy ravishda aniq va takrorlanuvchan boʻlishini, ob'ektivlikni kafolatlaydi.", "Faqatgina eng yuqori aniqlikdagi oʻlchash vositalaridan foydalanishni talab qiladi va boshqa vositalarni inkor etadi.", "Oʻlchash natijalarini har bir iste'molchining individual talablariga moslashtirishni ta'minlaydi.", "Oʻlchash jarayonining tezkorligini birinchi oʻringa qo'yib, natijalarning aniqligidan ko'ra samaradorlikka urg'u beradi."], ["Etalonning asosiy vazifasi qaysi kattalikni hosil qilish, saqlash va uzatish uchun moʻljallanganligidadir?", "Kattalik birligini yoki kattalik qiymatini aniq hosil qilish, saqlash va boshqa o'lchash vositalariga uzatishdir.", "Faqatgina oʻlchash vositalarining eng soʻnggi modellarini ishlab chiqarish, ularning narxini belgilash uchun xizmat qilishdir.", "Oʻlchash vositalarining faqatgina mahalliy ishlab chiqarish korxonalarida foydalanishini qonuniy kafolatlashdir.", "Xalqaro oʻlchash birliklari bilan mutlaqo mos kelmaydigan yangi birliklarni yaratish va ularni keng yoyishdir."], ["Oʻlchash vositasi deb nimaga aytiladi va u qanday xususiyatlarga ega boʻlishi kerak?", "O'lchashlarni amalga oshirish uchun moʻljallangan va metrologik xususiyatlarga ega boʻlgan texnik vosita.", "Faqatgina laboratoriya sharoitida ishlatiladigan, yuqori xarajatli va murakkab texnik qurilma.", "Har qanday fizik kattalikni aniqlashga xizmat qiluvchi, lekin aniq metrologik xususiyatlarga ega bo'lmagan qurilma.", "Faqatgina oʻquv maqsadlarida ishlatiladigan, haqiqiy oʻlchashlar uchun yaroqsiz boʻlgan har qanday moslama."], ["Elektr energiyasini hisobga olishda ampermetrning metrologik holati talabga javob bermasa, qanday oqibat yuzaga kelishi mumkin?", "Oʻlchash natijasi noto'g'ri bo'ladi, bu esa energetika tizimining samaradorligiga salbiy ta'sir ko'rsatadi.", "Faqatgina voltmetrning ishlashiga ta'sir qiladi va bu elektr toki oʻlchamlariga umuman daxl qilmaydi.", "Bu holat hech qanday jiddiy oqibatlarga olib kelmaydi, chunki boshqa oʻlchash asboblari uni qoplashi mumkin.", "Elektr energiyasining umuman hisoblanmay qolishiga olib keladi va bu tizimda katta nosozlikni keltirib chiqaradi."], ["Energetika sohasida metrologiyaning asosiy vazifasi elektr energiyasi tizimida nimani ta'minlashdan iborat?", "Elektr energiyasini aniq oʻlchashni toʻliq ta'minlash va barcha koʻrsatkichlarning ishonchli boʻlishini kafolatlash.", "Faqatgina elektr uzatish liniyalarining mustahkamligini ta'minlash, ammo oʻlchash aniqligiga e'tibor bermaslik.", "Elektr stansiyalarining texnik holatini doimiy ravishda kuzatish va ularning foydalanish muddatini uzaytirish.", "Elektr energiyasi tariflarini belgilash va ularni iste'molchilarga yetkazib berishning iqtisodiy samaradorligini oshirish."], ["Energetika sohasida standartlashtirishning asosiy vazifasi elektr jihozlari va jarayonlariga nisbatan nimani belgilashdir?", "Elektr jihozlari va jarayonlariga qo'yiladigan yagona talablarni aniq belgilash va ularning bajarilishini ta'minlash.", "Faqatgina iste'molchilarning turli xil ehtiyojlariga mos keladigan elektr jihozlarini ishlab chiqarish uchun cheklovlar yaratish.", "Elektr jihozlarining eksport qilinishi uchun zarur boʻlgan minimal talablarni belgilash, ichki bozor uchun esa emas.", "Elektr jihozlarining dizaynini va rangini belgilash, ularni estetik jihatdan jozibador qilishga qaratilgan qoidalar ishlab chiqish."], ["Energetika sohasida sertifikatlashtirishning asosiy vazifasi mahsulotning belgilangan talablarga qanday javob berishini baholashdir?", "Mahsulotning belgilangan talablarga toʻliq va obyektiv ravishda javob berishini baholash va tasdiqlash.", "Mahsulotning ishlab chiqarish xarajatlarini kamaytirish uchun qanday imkoniyatlarga ega ekanligini baholash.", "Elektr jihozlarining bozor raqobatbardoshligini baholash va ularning sotilishini oshirish strategiyalarini ishlab chiqish.", "Faqatgina xalqaro bozorlarda sotiladigan elektr jihozlarining sifatini baholash va ularni mahalliy talablardan xoli etish."], ["Mahsulot sifatini ta'minlashda standartlar, aniq o'lchashlar, sinovlar, muvofiqlikni baholash va nazorat qanday ishlashi kerak?", "Ular birgalikda, oʻzaro uyg'unlikda ishlashi kerak, bu butun ishlab chiqarish jarayonini qamrab oladi.", "Faqatgina standartlar muhim ahamiyatga ega boʻlib, boshqa elementlar sifatga kam ta'sir ko'rsatadi.", "Har bir element alohida-alohida ishlashi kerak, ularning oʻzaro aloqasi mahsulot sifatini pasaytiradi.", "Sinovlar va nazorat faqatgina yakuniy bosqichda amalga oshirilishi lozim, boshlang'ich bosqichlar muhim emas."], ["Sertifikatlashtirish jarayonining birinchi bosqichi nima va u kim tomonidan amalga oshiriladi?", "Ariza berish – ishlab chiqaruvchi yoki boshqa manfaatdor tomon muvofiqlikni baholash uchun ariza beradi.", "Namuna olish – davlat nazorati organi mahsulotdan zarur hollarda belgilangan tartibda namuna oladi.", "Sinov oʻtkazish – laboratoriyada mahsulotning tegishli koʻrsatkichlari aniqlanadi va tahlil qilinadi.", "Hujjatlarni tahlil qilish – tegishli ekspertlar mahsulotga oid texnik va normativ hujjatlarni oʻrganadi."], ["Metrologiya, standartlashtirish va sertifikatlashtirishning zamonaviy ishlab chiqarish va xizmat ko'rsatish tizimidagi ahamiyati nimada?", "Ular tizimning muhim tarkibiy qismlari boʻlib, mahsulot va xizmatlarning sifati, xavfsizligi hamda ishonchliligini ta'minlaydi.", "Ular faqatgina davlat tomonidan tartibga solinadigan sohalarda muhim, xususiy sektorda kam ahamiyatga ega.", "Ular mahsulot ishlab chiqarish xarajatlarini oshirishga olib keladi va bu bozorda raqobatbardoshlikni pasaytiradi.", "Ular faqatgina texnik jarayonlarga qaratilgan boʻlib, iste'molchilarning manfaatlariga bevosita ta'sir ko'rsatmaydi."], ["Metrologiya fan va amaliy faoliyat sohasi sifatida nimani oʻz ichiga oladi?", "Oʻlchashlar birliligi, ularning aniqligi va usullarini ta'minlashni.", "Mahsulot sifatini baholash va xavfsizlik talablarini belgilashni.", "Faqat oʻlchov asboblarini ishlab chiqarish va ularni bozorga sotishni.", "Iste'molchilar huquqlarini himoya qilishning huquqiy asoslarini."], ["Oʻlchashlar birliligi deganda metrologiyada nima tushuniladi?", "Oʻlchov natijalari qonuniy birliklarda boʻlib, aniqligi chegarada boʻlishi.", "Turli mamlakatlarda oʻlchash vositalarining standartlashtirilishi zaruriyati.", "Har bir oʻlchov asbobining muntazam kalibrlashdan oʻtkazilishi jarayoni.", "Oʻlchashlarning faqat laboratoriya sharoitida amalga oshirilishi tartibi."], ["Standartlashtirishning asosiy maqsadi nimadan iborat?", "Mahsulot, xizmat va jarayonlarga yagona talablarni shakllantirish.", "Oʻlchash vositalarining aniqligini doimiy nazorat qilib borish.", "Faqatgina iste'molchilarning huquqlarini himoya qilishni ta'minlash.", "Davlat tomonidan mahsulot sifatini belgilash qoidalarini yaratish."], ["Metrologiya tizimining asosiy prinsiplaridan biri nima?", "Oʻlchash natijalarining ishonchliligi va oʻlchashlar birliligi.", "Mahsulot ishlab chiqarish jarayonining toʻliq avtomatlashtirilishi.", "Iste'molchilar uchun mahsulotning arzon narxda boʻlishini ta'minlash.", "Har bir mahsulotning texnik xususiyatlarini doimiy oʻzgartirib turish."], ["Etalon deganda metrologiyada nima tushuniladi?", "Kattalik birligini hosil qilish, saqlash va uzatish uchun moʻljallangan oʻlchash vositasi.", "Har qanday oʻlchash ishlarini bajarishga moʻljallangan universal oʻlchov asbobi.", "Yangi oʻlchash usullarini ishlab chiqishga mas'ul boʻlgan ilmiy markaz.", "Oʻlchash vositalarini tekshirish uchun zarur boʻlgan maxsus laboratoriya."], ["Quyidagilardan qaysi biri standartlashtirish tizimining asosiy elementi hisoblanadi?", "Standartlashtirish obyektlari va standartlashtirish hujjatlari.", "Iste'molchilarning oʻlchov asboblarining shaxsiy tekshirishi mexanizmlari.", "Faqatgina mahsulotning qadoqlash usullarini belgilash qoidalari.", "Elektr energiyasini hisobga olish tizimining ishchi mexanizmi."], ["Mahsulotni sertifikatlashtirish jarayonining dastlabki bosqichlaridan biri nima?", "Ariza berish va mahsulotga oid hujjatlarni tahlil qilish.", "Yakuniy mahsulotni iste'molchiga yetkazish uchun markalash.", "Davlat nazorat organlarining ishlab chiqarishni toʻxtatishi.", "Laboratoriya uskunasini yangi modellarga almashtirish tartibi."], ["Davlat nazoratining asosiy maqsadi nimadan iborat?", "Belgilangan qonunchilik va texnik talablarning bajarilishini ta'minlash.", "Faqatgina yangi mahsulotlarni bozorga chiqarish jarayonini tezlashtirish.", "Xalqaro standartlarni mahalliy ishlab chiqarishga majburan joriy qilish.", "Oʻlchash vositalarini ishlab chiqaruvchi kompaniyalarni qoʻllab-quvvatlash."], ["Standartlashtirish va muvofiqlikni baholash tizimi iste'molchilar huquqlarini himoya qilishda qanday rol oʻynaydi?", "Sifatli va xavfsiz mahsulotlarni iste'molchiga yetkazishni ta'minlaydi.", "Mahsulotlarning narxini davlat tomonidan belgilash jarayonini nazorat qiladi.", "Ishlab chiqaruvchilarga xorijiy bozorlarga chiqish imkoniyatini yaratadi.", "Iste'molchilarning shaxsiy ma'lumotlarini himoya qilishga yordam beradi."], ["Oʻlchash birligi nima deb ta'riflanadi?", "Kattalik qiymatini ifodalash uchun qabul qilingan belgilangan qiymat.", "Har qanday oʻlchov asbobining aniqlik darajasini koʻrsatuvchi raqam.", "Umumiy foydalanish uchun qoidalar va talablarni belgilovchi hujjat.", "Ma'lum bir mahsulotning texnik xususiyatlarini tavsiflovchi hujjat."], ["Muvofiqlikni baholash jarayonining asosiy maqsadi nima?", "Obyektga qoʻyilgan talablarning toʻliq bajarilganligini aniqlash.", "Ishlab chiqarish jarayonlarida sifat menejmenti tizimini joriy etish.", "Yangi oʻlchash vositalarini ishlab chiqish va ularni sinovdan oʻtkazish.", "Mahsulotlarni qadoqlash standartlariga rioya etilishini nazorat qilish."], ["Metrologiyaning asosiy vazifalariga quyidagilardan qaysi biri kirmaydi?", "Ishlab chiqarilgan mahsulotlarning umumiy estetik koʻrinishini aniq belgilash.", "Oʻlchash natijalarining oʻzaro taqqoslanishi hamda ishonchliligini ta'minlash.", "Oʻlchash natijalarining ishonchlilik darajasini kafolatlash mexanizmlari.", "Oʻlchov birliklari va ularni boshqa vositalarga uzatishni tartibga solish."], ["Sertifikatlashtirish tushunchasi quyidagilardan qaysi birini anglatadi, uning mohiyatini to'g'ri aks ettiradi?", "Mustaqil uchinchi tomon tomonidan mahsulot, xizmat, jarayonning belgilangan talablarga muvofiqligi haqida yozma ishonch berish jarayoni, faqatgina ishonch berish.", "Tashkilotning ichki audit jarayonlari orqali o'z mahsulotlarining sifati ustidan doimiy nazoratni ta'minlash faoliyati, faqat ichki nazorat.", "Davlat organlari tomonidan mahsulotning bozorda sotilishiga ruxsat beruvchi majburiy litsenziyalash mexanizmi, shuningdek, bozorga kirish.", "Mijozlarning mahsulotga bo'lgan ishonchini oshirishga qaratilgan marketing strategiyasi, hamda reklama tadbirlarining yig'indisi."], ["Sertifikatlashtirish sxemasi qanday ma'noni anglatadi va u qanday asosiy elementlar majmuasidan tashkil topadi?", "Bu qoidalar va tartiblar majmuasi bo'lib, obyekt uchun tanlash, sinash, tekshirish, audit, baholash va qaror qabul qilishni belgilaydi.", "Bu har bir mahsulot turini alohida baholash uchun faqatgina sinov usullarini o'z ichiga olgan bir xil standartlashtirilgan hujjatlar to'plami, yakuniy hujjatlar.", "Bu faqatgina mahsulotga sertifikat berish to'g'risidagi yakuniy qarorni qabul qilish tartibini belgilaydi, va shu bilan baholash tugaydi.", "Bu tashkilotning sifat menejmenti tizimini yaratish bo'yicha ichki ko'rsatmalar to'plami bo'lib, tashqi auditorlar tomonidan tekshiriladi."], ["Kuzatuv nazoratining asosiy vazifasi nimadan iborat, sertifikatlashtirish jarayonida u nima uchun o'tkaziladi?", "Muvofiqlikning davomiyligini tekshirish uchun keyingi audit, sinov, inspeksiya yoki bozor namunalari orqali monitoring qilishdir.", "Sertifikatlashtirish jarayonini boshlashdan avval tashkilotning tayyorligini baholash va hujjatlarni to'plash jarayoni hisoblanadi.", "Aniqlangan nomuvofiqliklarni bartaraf etish uchun tashkilotga ko'rsatmalar berish va tuzatuvchi harakatlarni amalga oshirishdir.", "Sertifikatning amal qilish muddati tugaganidan so'ng, tizimni qayta baholash va yangi sertifikat berish to'g'risida qaror qabul qilishdir."], ["ISO/IEC 17067 standartining sertifikatlashtirish sxemalaridagi o'rni qanday, u qanday maqsadda qo'llaniladi?", "Mahsulot, jarayon va xizmatlarni sertifikatlashtirish sxemalarini tushunish, ishlab chiqish va boshqarish uchun asosiy xalqaro yo'riqnoma.", "Sifat menejmenti tizimlarining umumiy talablarini belgilovchi asosiy hujjat, har qanday tashkilot uchun universal standard.", "Sertifikatlashtirish organlarining kompetentligi va xolisligini tasdiqlovchi mezon, ularning ishlashini baholovchi asosiy standart.", "Ichki auditlarni rejalashtirish va o'tkazish bo'yicha tavsiyalar beruvchi standart, shuningdek, auditor kompetensiyasini rivojlantirish."], ["ISO 9000 va ISO 9001 standartlari oʻrtasidagi asosiy farq qaysi jihatda namoyon bo'ladi?", "ISO 9000 sifat menejmenti terminologiyasi va asoslarini belgilaydi, ISO 9001 esa sertifikatlashtirish uchun talablarni o'rnatadi.", "ISO 9000 audit o'tkazish yo'riqnomasi, ISO 9001 esa barqaror muvaffaqiyatga erishish bo'yicha tavsiyalarni o'z ichiga oladi.", "ISO 9000 kichik tashkilotlar uchun mo'ljallangan, ISO 9001 esa faqat yirik korporatsiyalar uchun mos keladi.", "ISO 9000 majburiy sertifikatlashtirishni talab qiladi, ISO 9001 esa ixtiyoriy ravishda qo'llaniladigan standart hisoblanadi."], ["ISO 9001 boʻyicha sertifikat olish tashkilotlar uchun majburiymi, yoki bu ixtiyoriy tanlovmi?", "ISO 9001 sertifikati ixtiyoriydir; u tashkilotning belgilangan QMS talablariga muvofiqligini mustaqil audit asosida tasdiqlaydi.", "ISO 9001 sertifikati barcha turdagi tashkilotlar uchun qonuniy majburiy bo'lib, bozorga kirishning asosiy shartidir.", "ISO 9001 sertifikati faqat davlat mulkidagi tashkilotlar uchun majburiy, xususiy sektor uchun esa ixtiyoriy tanlov hisoblanadi.", "ISO 9001 sertifikati faqat yuqori xavfli mahsulotlar ishlab chiqaruvchi tashkilotlar uchun majburiy hisoblanadi."], ["Sifat menejmentining yetti tamoyilidan biri bo'lgan 'Mijozga yo'naltirilganlik' qanday ma'noni anglatadi?", "Tashkilot mijozning hozirgi va kelajakdagi ehtiyojlarini tushunishi, talablarni bajarishi va qoniqishni oshirishga intilishi kerak.", "Tashkilot faqat ichki jarayonlarining samaradorligiga e'tibor qaratishi, mijozlarning fikrini inobatga olmasligi lozimdir.", "Tashkilotning rahbariyati barcha qarorlarni mijozlar bilan maslahatlashmasdan qabul qilishi, ichki avtoritetni saqlashi kerak.", "Mijozlarning talablariga javob berishdan ko'ra, mahsulot narxini maksimal darajada kamaytirishga ustuvor ahamiyat berish kerak."], ["ISO 9004:2018 standarti nima uchun qo'llaniladi, uning asosiy maqsadi nimadan iborat?", "Tashkilotning barqaror muvaffaqiyatga erishish, yetuklik va o'zini-o'zi baholash uchun yo'riqnomalar va tavsiyalar beradi.", "Barcha tashkilotlar uchun sertifikatlashtirilishi shart bo'lgan majburiy talablarni belgilaydi va ularni tekshirishni ta'minlaydi.", "Faqat sifat menejmenti tizimining fundamental tushunchalari va terminologiyasini ta'riflaydi, boshqa funktsiyalarga ega emas.", "Audit dasturlarini boshqarish, audit prinsiplari va auditor kompetensiyasiga doir aniq talablarni belgilaydi."], ["ISO 19011:2026 standarti audit jarayoniga qanday yordam beradi, uning asosiy funksiyasi nimalardan iborat?", "Audit tamoyillari, audit dasturini boshqarish, auditni oʻtkazish va auditor kompetensiyasiga doir tavsiyalar beradi.", "U mahsulotlarning ishlab chiqarish jarayonlariga qo'yiladigan aniq texnik talablarni belgilaydi va ularni tekshirishga yordam beradi.", "U faqat tashkilotning sifat menejmenti tizimi uchun sertifikatlashtirish talablarini o'rnatadi, boshqa audit turlarini qamrab olmaydi.", "U tashkilotning uzoq muddatli barqarorligini ta'minlash uchun moliyaviy boshqaruvni qanday amalga oshirish bo'yicha yo'riqnoma beradi."], ["Akkreditatsiya va sertifikatlashtirish oʻrtasidagi asosiy farq nimada, ularning qamrovi qanday?", "Sertifikatlashtirish mahsulot yoki tizimga tegishli bo'lsa, akkreditatsiya sertifikatlashtirish organining kompetentligini tasdiqlaydi.", "Akkreditatsiya majburiy jarayon bo'lib, sertifikatlashtirish esa ixtiyoriy ravishda amalga oshiriladigan faoliyat hisoblanadi.", "Sertifikatlashtirish davlat organlari tomonidan amalga oshiriladi, akkreditatsiya esa xususiy tashkilotlar tomonidan beriladi.", "Akkreditatsiya faqat ma'lum bir mahsulot turiga nisbatan qo'llanadi, sertifikatlashtirish esa butun tashkilotni qamrab oladi."], ["ISO 9001 sertifikati mahsulotning har bir nusxasi mutlaqo nuqsonsiz ekanligini kafolatlaydimi?", "Yo'q, u har bir nusxaning nuqsonsizligini kafolatlamaydi; u sifatni boshqarish tizimi standartga muvofiqligini ko'rsatadi.", "Ha, sertifikat mahsulotning har bir nusxasi eng yuqori sifat standartlariga to'liq javob berishini qat'iy kafolatlaydi.", "Sertifikat faqat mahsulotning ayrim asosiy xususiyatlari nuqsonsizligini tasdiqlaydi, qolganlari kafolatga kirmaydi.", "Sertifikat faqatgina mahsulotning xavfsizlik talablariga muvofiqligini kafolatlaydi, boshqa sifat jihatlarini qamrab olmaydi."], ["Kuzatuv auditi nima sababdan o'tkaziladi, uning asosiy maqsadi nimadan iborat?", "Sertifikat amal qilishi davrida tashkilot QMSining davomiy muvofiqligini nazorat qilish va tekshirish uchun o'tkaziladi.", "Sertifikat berishdan avval tashkilotning sifat menejmenti tizimi joriy etilganligini tekshirish uchun amalga oshiriladi.", "Faqat tashkilotda katta nomuvofiqliklar aniqlanganida o'tkaziladi, boshqa holatlarda u talab etilmaydi.", "Tashkilotning moliyaviy barqarorligini va uning bozordagi raqobatbardoshligini baholash uchun o'tkaziladigan audit turidir."], ["Sertifikatlashtirish tushunchasi quyidagilardan qaysi birini aniq ifodalaydi?", "Mustaqil uchinchi tomon tomonidan mahsulot, xizmat yoki tizimning belgilangan talablarga muvofiqligini yozma tasdiqlash jarayoni.", "Ichki audit guruhining tashkilot faoliyatini belgilangan sifat standartlariga muvofiqligini tizimli tekshirish va baholashi.", "Mahsulot sifatini doimiy ravishda oshirish uchun ichki jarayonlarni tizimlashtirish va hujjatlashtirish amaliyoti.", "Bajarilgan loyihalarning texnik xususiyatlarga mos kelishini taʼminlash maqsadida xaridor tomonidan amalga oshiriladigan baholash."], ["Sertifikatlashtirish sxemasi nima va u asosan qanday asosiy elementlardan tashkil topadi?", "U obyektdagi tanlash, sinash, audit, baholash, qaror qabul qilish va kuzatuv tadbirlarini belgilovchi qoidalar majmuidir.", "Bu mahsulotlarning ishlab chiqarish jarayonlarini doimiy tekshirish va hujjatlashtirish uchun foydalaniladigan yuridik hujjatlar to'plamidir.", "Tashkilotning ichki sifat menejmenti tizimini ishlab chiqishda qo'llanadigan tavsiyalar va eng yaxshi amaliyotlarning ro'yxati va ta'rifi.", "Har bir xodimning faoliyatini muntazam ravishda baholash, ularning malakasini oshirish va xatolarini tuzatishga qaratilgan ichki tizim."], ["Partiyali va seriyali mahsulot sertifikatlashtirish sxemalari oʻrtasidagi asosiy farq nimadan iborat?", "Partiyali sxemalar ma'lum bir partiya namunalarini sinashga asoslansa, seriyali sxemalar doimiy ishlab chiqarish jarayonini tekshiradi.", "Partiyali sxemalar kamroq hujjatlashtirishni talab qilsa, seriyali sxemalar faqat to'liq va murakkab texnik hujjatlar mavjudligini nazarda tutadi.", "Seriyali sxemalar mahsulotning yakuniy narxini oshirsa, partiyali sxemalar narxni o'zgartirmaydi, chunki ular kamroq nazoratni o'z ichiga oladi.", "Partiyali sxemalar faqat kichik hajmdagi mahsulotlar uchun qo'llanadi, seriyali sxemalar esa katta hajmdagi ishlab chiqarishni qamrab oladi, lekin sifatga e'tibor bermaydi."], ["Sertifikatlashtirish jarayonidagi kuzatuv nazoratining asosiy vazifasi nimadan iborat?", "Sertifikat olingandan so'ng mahsulot yoki tizimning belgilangan talablarga muvofiqligini davomiy ta'minlashni tekshirish.", "Tashkilotning dastlabki arizasini ko'rib chiqish va sertifikatlash jarayonining dastlabki bosqichlarini tasdiqlash uchun xizmat qiladi.", "Faqat yangi mahsulot turlarini bozorda sinovdan o'tkazish va ularning iste'molchilar ehtiyojlariga mos kelishini baholash uchun amalga oshiriladi.", "Sertifikatlashtirish organining ichki jarayonlari samaradorligini doimiy baholash va ularning xolisligini ta'minlash uchun ishlatiladi."], ["ISO/IEC 17067 standartining sertifikatlashtirish sxemalaridagi oʻrni qanday ahamiyatga ega?", "Mahsulot, jarayon va xizmatlar sertifikatlashtirish sxemalarini tushunish, ishlab chiqish hamda boshqarish uchun asosiy xalqaro yo'riqnoma hisoblanadi.", "U faqat menejment tizimlarining ichki auditlarini amalga oshirish bo'yicha batafsil ko'rsatmalarni o'z ichiga oladi va ularning samaradorligini baholaydi.", "Standart faqat laboratoriya sinovlari uchun talablarni belgilaydi, mahsulotning xavfsizlik xususiyatlarini tasdiqlash uchun majburiy hisoblanadi.", "U xalqaro savdo bitimlarini tartibga soladi, mahsulotlarni chegaradan o'tkazishda zarur bo'lgan minimal texnik talablarni belgilaydi."], ["ISO 9000 va ISO 9001 standartlari oʻrtasidagi asosiy farq qaysi yo'nalishda namoyon bo'ladi?", "ISO 9000 terminologik asosni beradi, ISO 9001 esa sifat menejmenti tizimlari uchun sertifikatlashtiriladigan talablarni o'rnatadi.", "ISO 9000 faqat kichik korxonalar uchun qo'llaniladi, ISO 9001 esa yirik va ko'p tarmoqli kompaniyalarga mo'ljallangan qoidalarni belgilaydi.", "ISO 9000 standartlari mahsulot dizayniga e'tibor qaratadi, ISO 9001 esa ishlab chiqarish jarayonlarining samaradorligini baholashga xizmat qiladi.", "ISO 9000 ixtiyoriy foydalaniladi, ISO 9001 esa barcha tashkilotlar uchun qonuniy majburiy bo'lgan talablarni belgilaydi."], ["ISO 9004:2018 standarti tashkilotlar uchun qanday maqsadda qo'llaniladi va uning asosiy vazifasi nimadan iborat?", "Barqaror muvaffaqiyatga erishish, o'zini-o'zi baholash va yetuklik sari yo'naltirish bo'yicha yo'riqnoma vazifasini bajaradi.", "Sifat menejmenti tizimining minimal talablarini belgilaydi va sertifikatlashtirish uchun asosiy tekshiruv mezonlarini taqdim etadi.", "Mahsulotlarning xavfsizligini ta'minlash uchun majburiy sinov usullarini va ularni amalga oshirish bo'yicha aniq texnik ko'rsatmalarni beradi.", "Xalqaro savdo qoidalarini tartibga soladi, mahsulotlarning eksport va import operatsiyalarini osonlashtirish uchun yuridik doirani ta'minlaydi."], ["ISO 19011:2026 standarti menejment tizimlarining audit jarayoniga qanday yordam beradi?", "Audit dasturlarini boshqarish, audit prinsiplari, o'tkazish metodologiyasi va auditor kompetensiyasi bo'yicha yo'riqnoma beradi.", "U faqat tashqi auditlarning xolisligini ta'minlash uchun qoidalar belgilaydi va ichki audit jarayonlariga to'g'ridan-to'g'ri ta'sir ko'rsatmaydi.", "Mahsulotning texnik xususiyatlarini aniqlash va ularning ishlab chiqarish jarayonida doimiy ravishda bajarilishini tekshirish uchun mezonlarni ta'minlaydi.", "Tashkilotning moliyaviy hisobotlarini tekshirish va buxgalteriya yozuvlarining to'g'riligini tasdiqlash uchun amaliy tavsiyalar va usullarni o'z ichiga oladi."], ["1-bosqich va 2-bosqich sertifikatlashtirish auditi o'rtasidagi asosiy farq nimadan iborat?", "1-bosqich hujjatlar tayyorligini va tizim tuzilmasini baholasa, 2-bosqich jarayonlarning amaliy muvofiqligini tekshiradi.", "1-bosqich audit faqat xodimlarning malakasini aniqlashga qaratilgan bo'lib, 2-bosqich esa faqat mahsulot sinovlari natijalarini ko'rib chiqadi.", "1-bosqich audit har olti oyda bir marta o'tkaziladi, 2-bosqich audit esa faqat bir yilda bir marta amalga oshiriladigan majburiy tekshiruvdir.", "1-bosqich audit faqat tashkilotning ichki resurslarini baholaydi, 2-bosqich esa tashqi ta'minotchilarning ishlash samaradorligini o'rganadi."], ["Sertifikatlashtirish auditi jarayonida nomuvofiqlik aniqlanganda tashkilot qanday asosiy harakatlarni bajarishi kerak?", "Nomuvofiqlik sababini aniqlab, tuzatish choralarini ko'rish va tizimli sabablarni bartaraf etish uchun tuzatuvchi harakatlarni amalga oshirish.", "Faqat aniqlangan nomuvofiqlikni tezda yopish va auditorga bu haqda darhol hisobot berish, ammo sababini tahlil qilmasdan.", "Boshqa bo'limlarning mas'uliyatini aniqlash va nomuvofiqlik uchun javobgar shaxslarni jazolash bilan cheklanish, tizimni o'zgartirmasdan.", "Barcha tegishli hujjatlarni qayta ko'rib chiqish va faqat qog'ozda o'zgarishlar kiritish orqali nomuvofiqlikni yashirish yoki kamaytirish."], ["Akkreditatsiya va sertifikatlashtirish oʻrtasidagi asosiy farq nimada?", "Sertifikatlashtirish ob'ektning standartlarga muvofiqligini tasdiqlasa, akkreditatsiya sertifikatlash organining kompetentligini tasdiqlaydi.", "Akkreditatsiya faqat moliyaviy sohadagi tashkilotlar uchun majburiy, sertifikatlashtirish esa har qanday sanoat uchun ixtiyoriy amalga oshiriladi.", "Sertifikatlashtirish hukumat idoralari tomonidan amalga oshiriladi, akkreditatsiya esa xususiy tashkilotlar tomonidan beriladigan ichki tasdiqdir.", "Akkreditatsiya ma'lum bir mahsulotning xavfsizligini kafolatlasa, sertifikatlashtirish esa butun ishlab chiqarish jarayonining ekologik standartlarga mosligini belgilaydi."], ["ISO tashkiloti korxonalarni bevosita sertifikatlaydimi yoki bu jarayon qanday amalga oshiriladi?", "ISO tashkilotlarni bevosita sertifikatlamaydi; buni mustaqil sertifikatlashtirish organlari akkreditatsiya asosida amalga oshiradi.", "Ha, ISO xalqaro miqyosda barcha tashkilotlarni to'g'ridan-to'g'ri sertifikatlaydi, bu jarayon faqat ularning o'zi tomonidan nazorat qilinadi.", "ISO faqat davlat korxonalarini sertifikatlaydi, xususiy tashkilotlar uchun sertifikatlashtirish milliy standartlar organlari zimmasiga yuklatilgan.", "ISO tashkiloti faqat yangi ishlab chiqilgan mahsulotlar uchun sertifikatlar beradi, lekin mavjud menejment tizimlarini baholash bilan shug'ullanmaydi."], ["Sertifikat amal qilish muddati davomida kuzatuv auditi asosan nima sababdan o'tkaziladi?", "Sertifikatlangan tashkilotning sifat menejmenti tizimi talablarga davomiy muvofiqligini nazorat qilish va tasdiqlash uchun.", "Sertifikat olish uchun dastlabki arizani ko'rib chiqish va audit jarayonini boshlashdan oldin barcha zarur hujjatlar mavjudligini tekshirish uchun.", "Yangi mahsulot turlarini ishlab chiqish va ularni bozorda muvaffaqiyatli joriy etish uchun zarur bo'lgan marketing strategiyalarini baholash maqsadida.", "Tashkilotning moliyaviy hisobotlarida aniqlangan nomuvofiqliklarni tekshirish va ularni bartaraf etish choralarini aniqlash uchun muntazam o'tkaziladi."], ["ISO 9001 sertifikatining tashkilot uchun amaliy qiymati asosan qaysi jihatlarda namoyon bo'ladi?", "Mijoz ishonchini mustahkamlash, shartnoma talablarini bajarish, jarayonlarni tartibga solish va doimiy yaxshilash madaniyatini rivojlantirish.", "Mahsulotning narxini pasaytirish, xomashyo yetkazib beruvchilar sonini cheklash, reklama xarajatlarini optimallashtirish va xodimlarning ish vaqtini qisqartirish.", "Faqat tashqi auditorlarning faoliyatini nazorat qilish, ichki audit jarayonlarini avtomatlashtirish va sifat nazorati bo'yicha yangi texnik uskunalarni joriy etish.", "Tashkilotning yuridik himoyasini kuchaytirish, sud jarayonlaridan qochish, davlat subsidiyalarini olish imkoniyatini oshirish va raqobatchilarni bozordan siqib chiqarish."], ["Sertifikatlashtirish sxemasini tanlashda qaysi omillar asosiy hisobga olinadi?", "Mahsulotning xavfi, ishlab chiqarish barqarorligi, sinov murakkabligi, sifat menejmenti tizimi, bozor nazorati zaruriyati va sertifikatning amal qilish muddati.", "Tashkilotning geografik joylashuvi, ishchilar soni, marketing byudjeti hajmi, mahsulotning rangi va o'ramining dizayn xususiyatlari.", "Menejment xodimlarining shaxsiy imtiyozlari, raqobatchilarning sertifikatlari soni, ijtimoiy tarmoqlardagi obro'si va mijozlar talablarining tasodifiy o'zgarishlari.", "Ishlab chiqarish quvvatining umumiy hajmi, mavjud texnologik uskunalar soni, tashkilotning moliyaviy barqarorligi va ishlab chiqarish binolarining yoshi."], ["Laboratoriya ishining asosiy maqsadi nimalarni oʻz ichiga oladi, aynan qaysi koʻnikmalarni shakllantirishni maqsad qiladi?", "Takroriy oʻlchash natijalarini statistik qayta ishlash va noaniqliklarni baholash koʻnikmalarini egallash.", "Faqatgina oʻrtacha arifmetik qiymatni hisoblashni oʻrganish va uning tarqalishini kuzatishni o'zlashtirish.", "Turli asboblarda faqatgina oʻlchov natijalarini yozib borish, boshqa statistik tahlillarni qo'llashdan qochish.", "Asosan faqat oʻlchash asboblarining kalibrlash usullarini oʻrganish va ularning foydalanish xususiyatlarini bilish."], ["Oʻlchash natijalarining mutlaq aniq boʻlmasligiga sabab boʻladigan omillar qatoriga quyidagilardan qaysi biri kirmaydi?", "Asbobning kalibrlash sertifikatining yangiligi, u aniqlikka toʻgʻridan-toʻgʻri ta'sir etmaydi.", "Oʻlchash vositasining aniqlik klassi va xususiyatlari, ular oʻlchov xatosini bevosita keltirib chiqaradi.", "Tashqi muhit sharoitlari, masalan, harorat yoki namlikning oʻzgarishi kabi faktorlar mavjudligi.", "Operatorning oʻlchash jarayonidagi harakati va o'lchash usulining to'g'ri tanlanmaganligi."], ["Metrologiyadagi oʻlchash noaniqligi tushunchasini eng toʻgʻri ifodalovchi ta'rifni toping:", "Oʻlchanayotgan kattalikka tegishli deb qaralishi mumkin boʻlgan qiymatlarning tarqalishini tavsiflovchi parametrdir.", "Asbobning texnik xususiyatlarida koʻrsatilgan maksimal ruxsat etilgan xatolik chegarasi va uning ta'rifi.", "Oʻlchash jarayonida operator tomonidan qilingan tasodifiy xatolar yigʻindisining matematik ifodasi hisoblanadi.", "Haqiqiy qiymat va oʻlchov natijasi orasidagi mutlaq farqni aniqlashning statistik usuli va ifodasidir."], ["N marta takroriy oʻlchashlarda natijalarning eng yaxshi statistik bahosi sifatida olinadigan oʻrtacha arifmetik qiymat qaysi formula orqali aniqlanadi?", "X = (X₁ + X₂ + ... + Xn) / n = (1/n) · ΣXᵢ, bu yerda Xᵢ – alohida oʻlchash natijalari.", "X = n / (X₁ + X₂ + ... + Xn) = n / ΣXᵢ, bu yerda Xᵢ – yakuniy oʻlchash natijalarining oʻrtachasi.", "X = ΣXᵢ / (n - 1), bu yerda n – oʻlchashlar sonidan birga kam boʻlgan erkinlik darajasi ifodasi.", "X = √[ ΣXᵢ² / n ], bu yerda ΣXᵢ² – barcha oʻlchash natijalarining kvadratlar yigʻindisi miqdoridir."], ["Tajribaviy tanlanma uchun oʻrtacha kvadratik ogʻish (s) qaysi formula boʻyicha hisoblanadi?", "s = √[ Σ(Xᵢ - X)² / (n - 1) ], bu yerda (n-1) erkinlik darajasini ifodalaydi.", "s = Σ(Xᵢ - X) / n, bu yerda Xᵢ - X har bir oʻlchash natijasining oʻrtachadan ogʻishidir.", "s = √[ Σ(Xᵢ)² / n ], bu yerda Σ(Xᵢ)² barcha natijalarning kvadratlari yigʻindisini anglatadi.", "s = (Xmaks - Xmin) / 2, bu yerda Xmaks va Xmin oʻlchashlarning maksimal va minimal qiymatlaridir."], ["Agar asbobning mumkin bo'lgan xatolik chegarasi ±Δ boʻlib, qiymatlar bir tekis taqsimlangan deb qabul qilinsa, B turdagi noaniqlik (u_B) qaysi formula bilan hisoblanadi?", "u_B = Δ / √3, bu yerda Δ – ruxsat etilgan xatolik chegarasi va √3 – kvadrat ildiz qiymati.", "u_B = Δ · √3, bu yerda Δ – xatolik chegarasi va √3 – oʻrtacha kvadratik ogʻish koeffitsiyenti.", "u_B = Δ / 3, bu yerda Δ – maksimal xato va 3 – erkinlik darajasining doimiy koeffitsiyenti.", "u_B = Δ² / √3, bu yerda Δ² – ruxsat etilgan xatolik chegarasining kvadrati hisoblanadi."], ["A va B turdagi noaniqliklar oʻzaro mustaqil deb qaralganda, umumiy standart noaniqlik (u_c) qaysi formula orqali topiladi?", "u_c = √(u_A² + u_B²), bu yerda u_A va u_B – mos standart noaniqliklardir.", "u_c = u_A + u_B, bu yerda u_A va u_B – mustaqil noaniqliklarning oddiy yigʻindisidir.", "u_c = √(u_A + u_B), bu yerda u_A va u_B – standart noaniqliklar yigʻindisining ildizi.", "u_c = u_A · u_B, bu yerda u_A va u_B – mustaqil noaniqliklar koʻpaytmasi bilan ifodalanadi."], ["Yakuniy o'lchash natijasini ma'lum ishonchlilik darajasida ifodalash uchun birlashtirilgan noaniqlik (u_c) qaysi koeffitsiyentga ko'paytiriladi?", "U qamrov koeffitsiyenti 'k' ga koʻpaytiriladi, natijada kengaytirilgan noaniqlik U hosil boʻladi.", "U aniqlik koeffitsiyenti 'A' ga koʻpaytiriladi, bu asbobning aniqlik klassini ifodalaydi.", "U oʻlchashlar soni 'n' ga koʻpaytiriladi, chunki koʻproq oʻlchashlar aniqlikni oshiradi.", "U dispersiya koeffitsiyenti 's' ga koʻpaytiriladi, bu natijalarning tarqalishini koʻrsatadi."], ["Nisbiy kengaytirilgan noaniqlik (U_r) qaysi formula yordamida foizlarda ifodalanadi?", "U_r = (U / X) · 100%, bu yerda U – kengaytirilgan noaniqlik va X – oʻrtacha qiymat.", "U_r = (X / U) · 100%, bu yerda U – kengaytirilgan noaniqlik va X – oʻlchanayotgan kattalik.", "U_r = (U - X) · 100%, bu yerda U – kengaytirilgan noaniqlik va X – natijaning absolyut qiymati.", "U_r = (U + X) / 100%, bu yerda U – kengaytirilgan noaniqlik va X – oʻrtacha arifmetik qiymat."], ["Oʻlchash natijalarini qayd etish jadvaliga har bir oʻlchashdan soʻng qanday ma'lumotlar kiritilishi kerak?", "Har bir individual oʻlchash natijasi (Xᵢ) va oʻrtacha qiymatdan ogʻishi (ΔXᵢ) kiritiladi.", "Faqatgina oʻrtacha arifmetik qiymat (X) va kengaytirilgan noaniqlik (U) natijalari qayd etiladi.", "Jadvalga faqat oʻlchash vositasining nomi va uning seriya raqami kabi texnik ma'lumotlar yoziladi.", "Har bir oʻlchashdagi harorat va bosim kabi tashqi muhit sharoitlari haqidagi ma'lumotlar."], ["Xavfsizlik qoidalariga koʻra, shtangensirkul va mikrometr bilan ishlashda qaysi harakat taqiqlanadi?", "Ushbu oʻlchash vositalarini kuch bilan siqmaslik, chunki bu ularning aniqligiga zarar yetkazishi mumkin.", "Oʻlchash yuzalarini toza tutmaslik va detalni ehtiyotkorlik bilan joylashtirmaslik qat'iyan taqiqlanadi.", "Oʻlchashdan oldin asbobning nol holatini tekshirmaslikka yoʻl qoʻymaslik ham xavfsizlik qoidalariga kiradi.", "Asboblarni urilish, tushib ketish va namlikdan himoya qilmaslik, chunki ular juda sezgir vositalardir."], ["Har qanday oʻlchash natijasining mutlaq aniq boʻlmasligiga odatda qanday asosiy omillar majmuasi sabab boʻladi?", "Oʻlchash vositasining aniqligi, operator harakati, tashqi muhit sharoitlari, qoʻllanilgan usul va tasodifiy omillar majmuasi taʼsir koʻrsatadi.", "Faqatgina asbobning yoshi va ishlab chiqarilgan sanasi, shuningdek, laboratoriyadagi yorugʻlik darajasi kabi ikkilamchi omillar taʼsiridir.", "Asosan operatorning xato qilish ehtimoli va oʻlchash vaqtida qilingan kichik hisoblash xatolari natijasida yuzaga keladigan holatdir.", "Faqat oʻlchanayotgan detalning material xususiyatlari va uning sirtining notekisligi kabi fizikaviy xususiyatlar sabab boʻladi."], ["Bir kattalik n marta takroriy oʻlchansa, natijalarning eng yaxshi statistik bahosi sifatida qaysi qiymat qabul qilinadi va u qanday formula orqali hisoblanadi?", "Oʻrtacha arifmetik qiymat qabul qilinadi, X̅ = (X₁ + X₂ + ... + Xn) / n = (1/n) · ΣXᵢ formulasi bilan hisoblanadi.", "Oʻrtacha kvadratik ogʻish (standart ogʻish) qabul qilinadi, s = √[ Σ(Xᵢ - X̅)² / (n - 1) ] formulasi yordamida aniqlanadi.", "Alohida natijaning ogʻishi qabul qilinadi, ∆Xᵢ = Xᵢ - X̅ formulasi boʻyicha hisoblanadigan mutlaq xato hisoblanadi.", "Moda (eng koʻp takrorlangan qiymat) qabul qilinadi, u qayta-qayta oʻlchashlar orasida eng tez-tez uchraydigan natija sifatida olinadi."], ["Har bir oʻlchash natijasining oʻrtacha qiymatdan farqi qanday nomlanadi va u qaysi formula yordamida topiladi?", "Har bir oʻlchash natijasining oʻrtacha qiymatdan farqi ogʻish (deviation) deyiladi, ∆Xᵢ = Xᵢ - X̅ formulasi bilan topiladi.", "Har bir oʻlchash natijasining oʻrtacha qiymatdan farqi dispersiya deyiladi, u σ² = Σ(Xᵢ - X̅)² / n formulasi bilan ifodalanadi.", "Har bir oʻlchash natijasining oʻrtacha qiymatdan farqi ishonchlilik oraligʻi deyiladi, u oʻlchash natijasining aniqligini belgilaydi.", "Har bir oʻlchash natijasining oʻrtacha qiymatdan farqi standart xato deyiladi, u oʻrtacha qiymatning oʻzgaruvchanligini ifodalaydi."], ["Oʻlchash natijalarining tarqalishini baholashda nima uchun alohida natijalarning ogʻishlari emas, balki ularning kvadratlari ishlatiladi?", "Chunki musbat va manfiy ogʻishlar yigʻindisi nazariy jihatdan nolga yaqin boʻladi, bu esa tarqalishni baholashga imkon bermasligi sabablidir.", "Chunki ogʻishlarning kvadratlari hisob-kitoblarni ancha soddalashtiradi va hisoblash jarayonida xatoliklarning oldini olishga yordam beradi.", "Chunki kvadratlar har doim musbat qiymatlar beradi, bu esa oʻlchash natijalarining mutlaq aniqligini mutlaqo kafolatlaydigan yagona yoʻldir.", "Chunki faqat kvadratlar oʻlchash asbobining toʻgʻri ishlashini toʻliq aks ettiradi, boshqa usullar esa asbob aniqligini yetarli baholay olmaydi."], ["Oʻrtacha kvadratik ogʻish (standart ogʻish) s nimani tavsiflaydi va tajribaviy tanlanma uchun u qaysi formula orqali hisoblanadi?", "U takroriy oʻlchashlarning oʻrtacha qiymat atrofida qanchalik tarqalganini koʻrsatadi, s = √[ Σ(Xᵢ - X̅)² / (n - 1) ] formulasi bilan hisoblanadi.", "U oʻlchov asbobining mutlaq aniqligini tavsiflaydi va s = √[ Σ(Xᵢ)² / n ] formulasi yordamida oʻlchov xatosini aniqlashga xizmat qiladi.", "U yakuniy oʻlchash natijasining nisbiy xatosini koʻrsatadi va s = (ΣXᵢ / n) · 100% formulasi bilan foizlarda ifodalanadi.", "U oʻlchashlar soni (n) ortishi bilan oʻzgarmas qoladigan doimiy koeffitsiyentdir, har doim s = 1 ga teng deb qabul qilinadi."], ["B turdagi standart noaniqlik (u_B) qanday maʼlumotlar asosida baholanadi va u odatda qanday usulda aniqlanadi?", "U statistik takroriy oʻlchashlar orqali emas, balki asbob pasporti, aniqlik klassi, shkala boʻlinmasi yoki ishlab chiqaruvchi koʻrsatgan chegaralar asosida.", "U faqatgina oʻlchashlar soni va oʻrtacha qiymat oʻrtasidagi matematik bogʻliqlikni hisobga olgan holda statistik yoʻl bilan topiladi.", "U oʻlchanayotgan detalning harorati va bosimi kabi tashqi fizik parametrlarning oʻzgarishini oʻlchab, aniqlanadigan empirik qiymatdir.", "U tajriba jarayonida operator tomonidan qilingan shaxsiy xatolarni qayd etish orqali hisoblanadigan va soʻngra kvadratlarga koʻtariladigan xatodir."], ["Agar asbobning mumkin bo'lgan xatolik chegarasi ±∆ boʻlib, qiymatlar shu oraliqda bir tekis taqsimlangan deb qabul qilinsa, B turdagi standart noaniqlik (u_B) uchun qaysi formula qoʻllaniladi?", "Bu holda B turdagi standart noaniqlik u_B = ∆ / √3 formulasi yordamida hisoblanadi.", "Bu holda B turdagi standart noaniqlik u_B = ∆ · √n formulasi bilan hisoblanadi.", "Bu holda B turdagi standart noaniqlik u_B = ∆ / n formulasi yordamida hisoblanishi zarur.", "Bu holda B turdagi standart noaniqlik u_B = ∆² formulasi bilan aniqlanadi."], ["Birlashtirilgan standart noaniqlik (u_c) qanday holatlarda aniqlanadi va uning hisoblash formulasi qanday koʻrinishga ega?", "U A va B turdagi noaniqliklar oʻzaro mustaqil deb qaralganda aniqlanadi, u_c = √(u_A² + u_B²) formulasi yordamida hisoblanadi.", "U faqatgina A turdagi noaniqlik (u_A) mavjud boʻlganda aniqlanadi, u_c = u_A · n formulasi orqali hisoblanadigan qiymatdir.", "U A va B turdagi noaniqliklar bir-biriga bogʻliq boʻlganda aniqlanadi, u_c = u_A + u_B formulasi yordamida hisoblanadi.", "U faqatgina B turdagi noaniqlik (u_B) mavjud boʻlganda aniqlanadi, u_c = u_B / √n formulasi bilan hisoblanadigan yagona qiymatdir."], ["Kengaytirilgan noaniqlik (U) nima uchun qoʻllaniladi va u birlashtirilgan standart noaniqlik (u_c) bilan qanday formula orqali bogʻlangan?", "U natijani maʼlum ishonchlilik darajasida ifodalash uchun qoʻllaniladi, U = k · u_c formulasi bilan birlashtirilgan noaniqlik bilan bogʻlangan.", "U faqatgina oʻlchash vositasining maksimal xatosini koʻrsatish uchun qoʻllaniladi, U = u_c / k formulasi yordamida hisoblanadi.", "U oʻlchash natijasining mutlaq aniqligini foizlarda ifodalaydi, U = u_c + k formulasi bilan nisbiy xatoni koʻrsatadi.", "U oʻlchash sharoitlarining oʻzgarishini tavsiflaydi, U = u_c - k formulasi yordamida natijaning barqarorligini aks ettiradi."], ["Koʻp laboratoriya ishlarida normal taqsimotga yaqin sharoitda 95 % ishonchlilik darajasiga mos keladigan qamrov koeffitsiyenti (k) ning taxminiy qiymati qancha qabul qilinadi?", "Normal taqsimotga yaqin sharoitda 95 % ishonchlilik darajasi uchun qamrov koeffitsiyenti k ≈ 2 ga teng qilib qabul qilinadi.", "Normal taqsimotga yaqin sharoitda 95 % ishonchlilik darajasi uchun qamrov koeffitsiyenti k ≈ 1 ga teng qilib qabul qilinadi.", "Normal taqsimotga yaqin sharoitda 95 % ishonchlilik darajasi uchun qamrov koeffitsiyenti k ≈ 3 ga teng qilib qabul qilinadi.", "Normal taqsimotga yaqin sharoitda 95 % ishonchlilik darajasi uchun qamrov koeffitsiyenti k ≈ 0.5 ga teng qilib qabul qilinadi."], ["Nisbiy kengaytirilgan noaniqlik (U_r) deganda nimani tushunasiz va u oʻlchanayotgan kattalikka nisbatan qaysi formula orqali hisoblanadi?", "U kengaytirilgan noaniqlikni oʻlchanayotgan kattalikka nisbatan foizlarda ifodalashdir, U_r = (U / X̅) · 100% formulasi bilan.", "U oʻlchash asbobining maksimal xatosini oʻlchanayotgan kattalikka nisbatan foizlarda ifodalashdir, U_r = (∆ / X̅) · 100% formulasi bilan.", "U oʻrtacha kvadratik ogʻishni oʻlchashlar soniga nisbatan foizlarda ifodalashdir, U_r = (s / n) · 100% formulasi orqali aniqlanadi.", "U individual ogʻishlarning oʻrtacha qiymatga nisbatan foizdagi oʻzgarishidir, U_r = (∆Xᵢ / X̅) · 100% formulasi yordamida hisoblanadi."], ["Laboratoriya ishini bajarishda shtangensirkul va mikrometr kabi oʻlchov asboblariga nisbatan qanday muhim xavfsizlik qoidasiga rioya qilish talab etiladi?", "Shtangensirkul va mikrometrni oʻlchash vaqtida kuch bilan siqmaslik, asbobga zarar yetkazmaslik uchun ehtiyotkor boʻlish kerak.", "Oʻlchash asboblarini doimiy ravishda kuchli magnit maydonlarida saqlash va ularni yuqori haroratga taʼsir ettirish muhimdir.", "Asbob yuzalarini yogʻli moddalar bilan muntazam tozalash va ularni changli muhitda ochiq holda qoldirish zarur.", "Oʻlchash asboblaridan faqat kuchli kimyoviy erituvchilar bilan ishlov berilgan detallarni oʻlchash uchun foydalanish kerak."], ["Oʻlchashdan oldin asbob bilan ishlashda qaysi muhim tekshiruvni amalga oshirish zarur va uning maqsadi nima?", "Oʻlchashdan oldin asbobning nol holatini tekshirish, uning toʻgʻri koʻrsatkich berishiga ishonch hosil qilish talab etiladi.", "Oʻlchashdan oldin asbobning haroratini xona haroratidan sezilarli darajada oshirish, shu bilan uning aniqligini yaxshilash kerak.", "Oʻlchashdan oldin asbobning batareya quvvatini toʻliq zaryadsizlantirish, soʻngra uni qayta zaryadlash zarur deb hisoblanadi.", "Oʻlchashdan oldin asbobni kuchliroq magnit maydoniga joylashtirish, bu uning oʻlchash diapazonini kengaytirishga yordam beradi."], ["Ushbu laboratoriya ishining asosiy maqsadlaridan biri talabalarda qanday amaliy koʻnikmalarni hosil qilishga qaratilgan?", "Takroriy oʻlchash natijalarini statistik qayta ishlash, oʻrtacha arifmetik qiymatni aniqlash va noaniqliklarni hisoblash koʻnikmalarini hosil qilish.", "Faqat oʻlchov asboblarini taʼmirlash va ularning mexanik qismlarini yigʻish-ajratish boʻyicha yuqori darajadagi amaliy koʻnikmalarni rivojlantirish.", "Faqat murakkab matematik formulalarni yodlash va ularni qogʻozda yozish boʻyicha nazariy bilim va yozish koʻnikmalarini mustahkamlash.", "Faqatgina turli xil oʻlchov asboblarining modellarini farqlash va ularning tarixiy rivojlanish bosqichlarini yoddan bilish koʻnikmasini shakllantirish."], ["Oʻrtacha kvadratik ogʻish formulasidagi s = √[ Σ(Xᵢ - X̅)² / (n - 1) ] ifodasidagi (n-1) parametri nimani anglatadi?", "U erkinlik darajasini anglatadi, bu cheklangan tanlanmadan hisoblangan dispersiyaning adolatli va xolis bahosi uchun qoʻllaniladi.", "U oʻlchashlar sonidan birini ayirish orqali olingan doimiy raqam boʻlib, matematik hisob-kitoblarni soddalashtirishga xizmat qiladi.", "U oʻlchash jarayonida qilingan xatolarning umumiy sonini bildiradi, bu esa natijaning ishonchliligini mutlaq aniqlikda belgilaydi.", "U statistik tahlilda qoʻllaniladigan barcha oʻlchovlarning yigʻindisini, yaʼni tanlanmadagi barcha elementlar sonini ifodalaydi."], ["Mehnat muhofazasi tushunchasi quyidagilardan qaysi biri bilan eng aniq ta'riflanadi?", "Mehnat jarayonida inson hayoti, sog'lig'i va ish qobiliyatini saqlashga yoʻnaltirilgan tadbirlar tizimi.", "Ish joyida xavfsiz sharoitlarni ta'minlash uchun faqat texnik jihozlash va nazorat qilish choralari.", "Ishlab chiqarishdagi baxtsiz hodisalarni oʻrganishga qaratilgan faqat huquqiy me'yorlar majmuasi.", "Xodimlarni kasbiy kasalliklardan himoya qilishga qaratilgan faqat ijtimoiy-iqtisodiy yordamlar yig'indisi."], ["Texnika xavfsizligi va mehnat muhofazasi oʻrtasidagi asosiy farq quyidagilardan qaysi birida toʻgʻri koʻrsatilgan?", "Texnika xavfsizligi — mehnat muhofazasining texnik vositalardan keluvchi xavflarni bartaraf etuvchi tarkibiy qismi.", "Texnika xavfsizligi faqat huquqiy me'yorlarni oʻz ichiga olsa, mehnat muhofazasi faqat iqtisodiy tadbirlarni qamrab oladi.", "Texnika xavfsizligi inson hayotini saqlashni asosiy maqsad qilsa, mehnat muhofazasi asbob-uskunalarni muhofaza qiladi.", "Mehnat muhofazasi asosan kasb kasalliklarining oldini olsa, texnika xavfsizligi faqat ish jarayonini nazorat qiladi."], ["Mehnat muhofazasi tizimining asosiy maqsadi sifatida matnda quyidagi qaysi jihat koʻrsatilgan?", "Ishlab chiqarishdagi baxtsiz hodisalar, kasb kasalliklari va zararli omillarning oldini olish.", "Xodimlarning ish joyidagi samaradorligini doimiy oshirish va ularga qoʻshimcha imtiyozlar yaratish.", "Korxonaning umumiy ishlab chiqarish rejasini bajarish va mahsulot sifatini doimiy yaxshilab borish.", "Texnik uskunalar va mexanizmlarning yangi modellarini joriy etish hamda ularni modernizatsiya qilish."], ["Laboratoriya sharoitida uchraydigan mexanik xavfli omillarga quyidagilardan qaysi biri misol boʻla oladi?", "Tez aylanuvchi, siljuvchi yoki kesuvchi asbob-uskunalarning harakatlanuvchi qismlari.", "Laboratoriya xonasidagi havo tarkibidagi zaharli gazlarning me'yordan ortiq darajada yuqori konsentratsiyasi.", "Ish joyida elektr kabellarining izolyatsiyasi buzilganligi natijasida yuzaga kelishi mumkin boʻlgan elektr toki urishi.", "Yuqori darajadagi shovqin yoki kuchli tebranishlar ta'sirida xodimning ish qobiliyatining pasayishi holatlari."], ["Elektr xavfli omillariga tegishli boʻlgan holat quyidagi variantlarning qaysi birida toʻgʻri aks ettirilgan?", "Elektr toki urishi, qisqa tutashuv yoki izolyatsiyaning buzilishi kabi nosozliklar.", "Laboratoriyadagi ish joyining yetarli darajada yoritilmaganligi yoki haddan tashqari issiq sirtlar.", "Zaharli yoki portlovchi moddalarning saqlash qoidalariga rioya qilmaslik oqibatlari.", "Ortiqcha yuklanish, takroriy harakatlar sababli yuzaga keladigan noqulay ish holatlari."], ["Quyidagilardan qaysi biri ishlab chiqarish muhitidagi fizik xavfli omil hisoblanadi?", "Haddan tashqari yuqori shovqin, kuchli tebranishlar yoki yetarli boʻlmagan yoritilish darajasi.", "Qiyoslanmagan yoki kalibrlanmagan oʻlchash asboblaridan foydalanish natijasida yuzaga keluvchi xatolar.", "Zaharli gazlar, yonuvchi suyuqliklar kabi kimyoviy moddalarning ish joyida tarqalishi.", "Mexanik uskunalar qismlarining notoʻgʻri yigʻilganligi yoki ularning harakatlanuvchi elementlari."], ["Ergonomik xavfli omillarga quyidagilardan qaysi biri misol boʻlishi mumkin?", "Uzoq muddat noqulay holatda ishlash, ortiqcha yuklanish yoki takroriy bir xil harakatlar.", "Elektr jihozlarining notoʻgʻri oʻrnatilishi yoki ularning izolyatsiyasining buzilgan holati natijasi.", "Ish joyidagi yoritish tizimining yetarli emasligi yoki yuqori darajadagi shovqinning mavjudligi.", "Xavfli kimyoviy moddalar bilan ishlashda shaxsiy himoya vositalarining yetarli emasligi."], ["Xavf darajasini baholash uchun ishlatiladigan R = P × S formulasida \"P\" nimani anglatadi?", "Xavfli hodisaning yuz berish ehtimolligi, ya'ni uning sodir boʻlishi mumkin boʻlgan chastotasi.", "Hodisa oqibatining og'irligi, ya'ni uning inson sog'lig'iga yoki mol-mulkka keltiradigan zarari darajasi.", "Umumiy xavfsizlik choralarining samaradorlik darajasi, ya'ni xavflarni kamaytirish koeffitsiyenti.", "Belgilangan xavfsizlik me'yorlariga rioya etishning umumiy koʻrsatkichi yoki darajasining aniqlanishi."], ["Amaliy mashgʻulotda xavf darajasini baholashning sodda usuli qaysi formula bilan ifodalanadi?", "R = P × S, bu yerda R xavf darajasini, P ehtimollikni va S oqibat og'irligini koʻrsatadi.", "E = m × c², bu yerda E energiya, m massa va c yorugʻlik tezligi orasidagi munosabatni aks ettiradi.", "F = m × a, bu yerda F kuch, m massa va a tezlanish oʻrtasidagi oʻzaro bogʻliqlikni ifodalaydi.", "V = I × R, bu yerda V kuchlanish, I tok kuchi va R qarshilik oʻrtasidagi Ohm qonunini beradi."], ["Oʻzbekiston Respublikasi Mehnat kodeksining mehnat muhofazasidagi ahamiyati nimada?", "Ish joyida xavfsiz mehnat sharoitiga doir umumiy talablarni belgilab beruvchi asosiy hujjatdir.", "Faqat oʻlchash vositalariga qoʻyiladigan metrologik talablarni va ularning kalibrlash tartibini qamrab oladi.", "Zaharli kimyoviy moddalar bilan ishlashda shaxsiy himoya vositalarini ta'minlash tartibini aniqlaydi.", "Laboratoriya xonalaridagi elektr jihozlarining ekspluatatsiya qoidalarini aniq tartibga soladi."], ["\"Mehnatni muhofaza qilish to'g'risida\"gi OʻRQ-410-son Qonunining asosiy mazmuni nimalarni oʻz ichiga oladi?", "Mehnat muhofazasi sohasidagi munosabatlar, xizmatni tashkil etish, oʻqitish, nazorat va kafolatlar tizimi.", "Ishlab chiqarish jarayonida yuzaga kelishi mumkin boʻlgan faqat mexanik xavflarni aniqlash usullari.", "Oʻlchash asboblarining kalibrlash va qiyoslash muddati, shuningdek, ularni tekshirish qoidalari.", "Xodimlarning ish joyidagi samaradorligini baholash va ularga qoʻshimcha bonuslar berish tartibi."], ["Vazirlar Mahkamasining 819-son qarori qanday yoʻnalishdagi munosabatlarni tartibga soladi?", "Mehnat muhofazasi ishlarini tashkil etish, yoʻl-yoʻriq, oʻqitish va bilimni tekshirish nizomlari.", "Faqat ish joyidagi jismoniy omillarning ta'sirini oʻlchash va ularni hujjatlashtirish tartiblari.", "Korxonada ishlab chiqarilayotgan mahsulotlarning sifatini nazorat qilish va kafolatlash choralari.", "Mexanik uskunalar va elektr jihozlarini sotib olish va ularni montaj qilishning texnik talablari."], ["Xodimning mehnat muhofazasi sohasidagi asosiy huquqlaridan biri quyidagilardan qaysi biri hisoblanadi?", "Xavfsizlik va gigiyena talablariga toʻliq javob beradigan ish joyiga ega boʻlish huquqi.", "Korxona foydasi uchun qoʻshimcha ishlarni bajarish va shu orqali oʻz daromadlarini oshirish imkoniyati.", "Ish joyidagi metrologik oʻlchash asboblarini mustaqil kalibrlash va tekshirish huquqi.", "Ish beruvchidan ishlab chiqarish jarayonini mustaqil ravishda oʻzgartirishni talab qilish huquqi."], ["Xodimning shaxsiy himoya vositalari bilan bogʻliq huquqi quyidagilardan qaysi birida aks etgan?", "Zarur shaxsiy va jamoaviy himoya vositalari bilan ta'minlanish, ulardan foydalanish imkoniyati.", "Korxona faoliyatiga oid barcha moliyaviy hisobotlarni muntazam ravishda koʻrib chiqish imkoniyati.", "Ish joyidagi asbob-uskunalarning texnik pasportlarini oʻzgartirish yoki qayta rasmiylashtirish huquqi.", "Ish beruvchidan ish jarayonining texnologik ketma-ketligini oʻzgartirishni talab qilish."], ["Ish beruvchining mehnat muhofazasi boʻyicha asosiy majburiyatlaridan biri quyidagilardan qaysi biri sanaladi?", "Xodimlarga xavfsiz mehnat sharoitlarini yaratish va barcha mavjud xavflarni kamaytirish.", "Ish joyida faqat eng yangi va eng qimmat texnologik uskunalarni doimiy ravishda joriy etib borish.", "Ishchilarning shaxsiy ish unumdorligini doimiy ravishda oshirish uchun qoʻshimcha bonuslar ta'minlash.", "Har bir xodimga oʻzining shaxsiy ishi uchun mustaqil qarorlar qabul qilish erkinligini berish."], ["Laboratoriya ishini bajarish tartibining 5-bandida oʻlchash asboblari bilan bogʻliq qanday amaliyot koʻrsatilgan?", "Oʻlchash asboblarining pasporti, diapazoni va qiyoslash/kalibrlash holatini koʻrib chiqish.", "Mavjud xavflarni bartaraf etish uchun shaxsiy himoya vositalarini darhol sotib olish va taqsimlash.", "Har bir xodim uchun yangi xavfsizlik yoʻriqnomalarini ishlab chiqish va ularni tasdiqlatish.", "Laboratoriyadagi barcha elektr jihozlarini mutlaqo yangilash va ularni zamonaviy modellar bilan almashtirish."], ["Oʻlchashlarning birliligini ta'minlash va metrologik nazoratni tartibga soluvchi asosiy hujjat qaysi?", "\"Metrologiya toʻgʻrisida”gi Oʻzbekiston Respublikasi Qonuni, OʻRQ-614-son, 07.04.2020.", "Oʻzbekiston Respublikasi Mehnat kodeksi, OʻRQ-798-son, 28.10.2022-yildagi eng soʻnggi tahriri.", "\"Mehnatni muhofaza qilish to'g'risida\"gi OʻRQ-410-son Qonuni, 22.09.2016-yildagi versiyasi.", "Oʻzbekiston Respublikasi Vazirlar Mahkamasining 819-son qarori, 24.12.2025-yildagi hujjatlari."], ["Oʻlchash vositalarini nazorat qilishda amalga oshiriladigan muhim vazifalardan biri nima?", "Asbobning identifikatsiya ma'lumotlarini, oʻlchash diapazonini va kalibrlash holatini tekshirish.", "Barcha eski oʻlchash asboblarini zudlik bilan utilizatsiya qilish va ularni yangilariga almashtirish.", "Har bir oʻlchash asbobi uchun yangi texnik pasport yaratish va uni rasmiy ravishda tasdiqlash.", "Ishlab chiqarish jarayonida ishlatiladigan har bir asbobning ishlab chiqarilgan sanasini doimiy oʻzgartirish."], ["Talablarga muvofiqlik koeffitsiyentini hisoblash uchun quyidagi qaysi formula qoʻllaniladi?", "K = (Nₘ / N) × 100 %, bu yerda K muvofiqlik, Nₘ mos bandlar, N umumiy bandlar.", "E = Nₘ + N / 2, bu yerda E oʻrtacha moslikni, Nₘ mos bandlarni va N umumiy bandlarni anglatadi.", "P = (Nₘ × N)², bu yerda P samaradorlikni, Nₘ mos bandlarni va N umumiy bandlarni ifodalaydi.", "A = Nₘ - N × 10, bu yerda A farqni, Nₘ mos bandlarni va N umumiy bandlarni belgilaydi."], ["Laboratoriyada xavfsiz ishlash qoidalariga koʻra quyidagi harakatlardan qaysi biri taqiqlanadi?", "Oʻqituvchi yoki mas'ul shaxsning ruxsatisiz elektr va mexanik uskunalarni ishga tushirish.", "Ish tugagandan soʻng ish joyini tozalash va asbob-uskunalarni xavfsiz holatga keltirish choralarini koʻrish.", "Ish boshlashdan oldin favqulodda oʻchirish vositalari va chiqish yoʻllari joylashuvini bilib olish.", "Shikastlanmagan kabel, asbob yoki himoya qopqogʻi mavjud oʻlchash vositasidan foydalanish."]]}];
const $=id=>document.getElementById(id);
let cur=0;
function drawSubs(){const b=$('subs');b.innerHTML='';SUBJ.forEach((s,k)=>{const x=document.createElement('button');x.className='opt sub'+(k===cur?' sel':'');
  const a=document.createElement('span');a.textContent=s.name;const c=document.createElement('small');c.textContent=s.q.length+' ta savol';x.append(a,c);
  x.onclick=()=>{cur=k;drawSubs()};b.appendChild(x)});
  $('avail').textContent='(mavjud: '+SUBJ[cur].q.length+')'}
drawSubs();
let list=[],i=0,score=0,wrong=[],locked=false;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['start','quiz','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(items){list=items.map(r=>({q:r[0],c:r[1],o:shuffle(r.slice(1))}));i=0;score=0;wrong=[];show('quiz');render()}
function render(){
  const it=list[i];locked=false;
  $('pos').textContent='Savol '+(i+1)+' / '+list.length;
  $('sc').textContent='To’g’ri: '+score;
  $('pb').style.width=(i/list.length*100)+'%';
  $('qt').textContent=it.q;
  const box=$('opts');box.innerHTML='';
  it.o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,t);box.appendChild(b)});
  $('next').classList.add('hidden');
}
function pick(btn,t){
  if(locked)return;locked=true;const it=list[i];
  const ok=t===it.c;
  [...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===it.c)b.classList.add('ok')});
  if(ok)score++;else{btn.classList.add('bad');wrong.push({q:it.q,mine:t,c:it.c,raw:[it.q,...it.o.filter(x=>x!==it.c).concat([])]})}
  $('sc').textContent='To’g’ri: '+score;
  $('next').textContent=i===list.length-1?'Natijani ko’rish':'Keyingi savol';
  $('next').classList.remove('hidden');$('next').focus();
}
function finish(){
  show('end');$('fin').textContent=score+' / '+list.length;
  $('pct').textContent=Math.round(score/list.length*100)+'% to’g’ri javob';
  $('retry').classList.toggle('hidden',!wrong.length);
  const r=$('rev');r.innerHTML=wrong.length?'<h3>Xato javoblar</h3>':'<p>Barcha javoblar to’g’ri. Ajoyib!</p>';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rev';
    const q=document.createElement('b');q.textContent=w.q;
    const a=document.createElement('div');a.className='a';a.style.background='var(--bad-bg)';a.style.color='var(--bad-text)';a.textContent='Sizning javobingiz: '+w.mine;
    const c=document.createElement('div');c.className='a';c.style.background='var(--ok-bg)';c.style.color='var(--ok-text)';c.textContent='To’g’ri javob: '+w.c;
    d.append(q,a,c);r.appendChild(d)});
}
$('next').onclick=()=>{if(i<list.length-1){i++;render()}else{$('pb').style.width='100%';finish()}};
$('go').onclick=()=>{let n=parseInt($('cnt').value)||25;const D=SUBJ[cur].q;n=Math.max(1,Math.min(D.length,n));begin(shuffle(D).slice(0,n))};
$('again').onclick=()=>show('start');
$('retry').onclick=()=>{const ids=new Set(wrong.map(w=>w.q));begin(shuffle(SUBJ[cur].q.filter(r=>ids.has(r[0]))))};
</script></body></html>
