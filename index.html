html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}

.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-text)}

<script>
const SUBJ=[{"name": "Burg‘ilash va portlatish ishlari", "q": [["Qora porox qanday moddalardan tashkil topgan bo'lib, ilk bor harbiy va sanoat sohasida portlovchi modda sifatida ishlatilgan?", "U kaliy selitrasi, fosfor kukuni va ko'mirdan tashkil topgan, harbiy va sanoat sohalarda keng qo'llanilgan.", "U nitroglitserin va kizilgur aralashmasidan tayyorlangan, konchilikda keyinroq ishlatilgan.", "U trinitrotoluen va geksogendan iborat bo'lib, faqat harbiy maqsadlarda foydalanilgan.", "U ammoniy nitrat va yonuvchan yog'lardan hosil qilingan, avtomobil sanoatida qo'llanilgan."], ["Bugungi kunda portlovchi moddalarning (PM) qo'llanilish doirasi qaysi sohalarni o'z ichiga oladi, ayniqsa konchilikdan tashqari?", "Metallarni ishlash, shtampovka, svarka, tuproqlarni zichlash va yong'in o'chirish kabi sohalarni qamrab oladi.", "Asosan faqat rangli va qora metallarni qazib olish jarayonlarida asosiy vosita sifatida ishlatiladi.", "Ko'proq qishloq xo'jaligida tuproq unumdorligini oshirish va ekinlarni himoya qilish uchun ishlatiladi.", "Ular faqat kosmik tadqiqotlarda va yangi materiallar yaratishda cheklangan tarzda foydalaniladi."], ["1847 yilda poroxni portlatish ishlarida almashtirgan yuqori brizantli nitroglitserin portlovchi moddasini qaysi italiyalik olim sintez qilgan?", "Bu yuqori brizantli portlovchi moddani italiyalik olim A.Sobrero birinchi bo'lib sintez qilgan.", "Bu modda nemis olimi Alfred Nobel tomonidan ishlab chiqilgan va keyin tarqalgan.", "Bu kashfiyot frantsuz olimi A. Lavuaze va K. Bertolle tomonidan amalga oshirilgan.", "Bu kimyoviy birikmani rus akademigi N. Zinin o'z tadqiqotlarida topib, takomillashtirgan."], ["Tog' jinsining bir o'qli siqishga chidamlilik chegarasi (σ_сж) qaysi formula bilan ifodalanadi, agar P_сж.max maksimal siquvchi kuch va F₀ namunaning ko'ndalang kesimi yuzasi bo'lsa?", "Siqishga chidamlilik chegarasi quyidagi formula orqali aniqlanadi: σ_сж = P_сж.max / F₀", "Siqishga chidamlilik chegarasi bu formula bilan ifodalanadi: σ_сж = F₀ / P_сж.max", "Siqishga chidamlilik chegarasi quyidagicha hisoblanadi: σ_сж = P_сж.max ⋅ F₀", "Siqishga chidamlilik chegarasini topish formulasi: σ_сж = P_сж.max + F₀"], ["Yung moduli (E) ta'rifiga ko'ra, u normal kuchlanish (σ) va nisbiy deformatsiya (v) orasidagi qanday bog'liqlikni ifodalaydi?", "Yung moduli normal kuchlanish va deformatsiya orasidagi proporsionallik koeffitsiyentini ifodalaydi: E = σ/v", "Yung moduli kuchlanishning deformatsiyaga teskari nisbatini ko'rsatadi: E = v/σ", "Yung moduli kuchlanish bilan deformatsiyaning ko'paytmasi sifatida aniqlanadi: E = σ ⋅ v", "Yung moduli materialning umumiy hajmiy o'zgarishini tavsiflovchi o'lchovdir: E = σ + v"], ["1939 yilga kelib, sanoatda ishlab chiqarilgan portlovchi moddalarning necha foizini selitrali sanoatlashtirilgan portlovchi moddalar tashkil etgan?", "1939 yilga kelib, ularning xajmi sanoat PMlarining 80%ini tashkil etgan edi.", "1939 yilga kelib, ularning xajmi sanoat PMlarining 50%idan oshmagan edi.", "Bu davrda ularning ulushi atigi 20% ga yetgan, asosan boshqa turdagi PMlar ishlatilgan.", "1939 yildan so'ng ularning ishlatilishi keskin kamaygan, boshqa moddalar ustunlik qilgan."], ["Tog' jinsining jilvirliligi (abrazivnost) deganda nima tushuniladi?", "Bu mashina yoki uskunaning tog' jinsi bilan kontaktidagi emirilishi holatini bildiradi.", "Bu tog' jinsining tashqi kuch ta'sirida deformatsiyasiz qolish qobiliyatini ifodalaydi.", "Bu tog' jinsining suvni o'ziga singdirish va namlikni saqlash xususiyatidir.", "Bu tog' jinsining yuqori haroratga va kimyoviy reaksiyalarga chidamliligidir."], ["Quyida keltirilgan portlovchi moddalardan qaysi biri XIX asrning ikkinchi yarmida I. Vilbrandt tomonidan sintez qilingan?", "I. Vilbrandt tomonidan 1863 yilda sintez qilingan portlovchi modda trotil edi.", "A. Sobrero tomonidan 1847 yilda sintez qilingan modda nitroglitserin edi.", "Bertold Shvarst tomonidan yaratilgan dastlabki portlovchi modda qora porox edi.", "Alfred Nobel tomonidan kashf qilingan aralashmali portlovchi modda dinamit edi."], ["Konchilik tashkilotlarida burg'ilash va portlatish ishlarining samaradorligi asosan qaysi omillarga bog'liq?", "Bu ishlarning samaradorligi portlatish energiya boshqaruvi va tog' jinsi xossalariga bog'liq.", "Ular asosan er osti suv sathi va konchilikda ishlatiladigan texnologik uskunalar rangiga bog'liq.", "Ular faqatgina ishchi kuchi malakasiga va moliyaviy resurslarning yetarliligiga bog'liqdir.", "Bu jarayonlar faqat kon loyihasining murakkabligi va geologik tadqiqotlar chuqurligiga bog'liq."], ["Portlovchi modda (PM) tushunchasining eng toʻgʻri taʼrifi qaysi variantda keltirilgan?", "Yuqori konstentrastiya va quvvatga ega bo'lgan, xalq xo'jaligida keng qo'llaniladigan manbaa hisoblanadi.", "Past konstentratsiyali va kuchsiz ta'sirga ega bo'lib, sanoatda ishlatilmaydigan, faqat yong'in o'chirish materiali.", "Faqat harbiy maqsadlarda qo'llaniladigan, kam samarali kimyoviy birikma hisoblanib, unumdorligi cheklangan.", "Suv osti ishlari uchun mo'ljallangan, past energiya ajratuvchi, atrof-muhitga zararsiz modda turi."], ["Harbiy va sanoat sohalarida portlovchi modda sifatida ilk bor qaysi modda qo'llanilgan?", "Qora porox ishlatilgan, u kaliy selitrasi, fosfor kukuni va ko'mirdan iborat bo'lgan kimyoviy birikma.", "Nitroglisterin moddasi qo'llanilgan, chunki u yuqori brizantli xususiyatga ega edi va katta energiya ajratgan.", "Dinamit birinchi bo'lib ishlatilgan, uning tarkibi nitroglisterin va kizilgurdan iborat bo'lib, xavfsizroq edi.", "Trotyl keng qo'llanilgan, u keyinchalik harbiy maqsadlar uchun sintez qilingan eng barqaror portlovchi modda."], ["Tog' jinsining g'ovakligi qanday taʼriflanadi va qaysi formula bilan ifodalanadi?", "Tog' jinsi tarkibidagi g'ovaklar hajmining umumiy hajmga nisbati bo'lib, Π = Vp/V formulasi orqali aniqlanadi.", "Tog' jinsi massasining uning hajmi bilan ko'paytmasi bo'lib, m ⋅ V (g⋅sm³) formulasi bilan aniqlanadigan fizik kattalik.", "Tog' jinsi namlik koeffitsiyenti bo'lib, Kω = ωγ/Π formulasi orqali ifodalanadi, uning suv singdirish qobiliyatini ko'rsatadi.", "Tog' jinsining plastik xususiyati bo'lib, tashqi kuch ta'sirida qoldiq deformatsiyani saqlab qolish qobiliyatidir."], ["Tog' jinsining namlik darajasi qanday aniqlanadi va qaysi formuladan foydalaniladi?", "1g quruq holdagi tog' jinsidagi suv miqdorini bildiradi, Kω = ωγ/Π formulasi orqali aniqlanadi.", "Tog' jinsi tarkibidagi g'ovaklar hajmining umumiy hajmga nisbati bilan belgilanadi, u zichlikka bog'liqdir.", "Tog' jinsi massasining uning hajmiga bo'lgan nisbati bo'lib, zichlik koeffitsiyentini bildiradi, fizik kattalik.", "Tashqi kuchni olgan holda qoldiq deformatsiya holatini saqlab qolish xususiyati bilan ifodalanadigan mexanik xossa."], ["Tog' jinsining bir o'qli siqishga chidamlilik chegarasi qanday ta'riflanadi va qaysi formula bilan ifodalanadi?", "Maksimal parchalovchi kuchining ko'ndalang kesim yuzasiga nisbati bo'lib, σсж = Pсж.max/F₀ formulasi orqali aniqlanadi.", "Maksimal cho'zuvchi kuchining ko'ndalang kesim yuzasiga nisbati bo'lib, σр = Pр.max/F₀ formulasi bilan hisoblanadi.", "Normal kuchlanishning nisbiy deformatsiyaga nisbati bo'lib, E = σ/v formulasi orqali ifodalanadigan elastiklik moduli.", "Urinma kuchlanishning deformatsiyaga nisbati bo'lib, G = τ/γ formulasi orqali hisoblanadigan siljish moduli."], ["Yung moduli qanday taʼriflanadi va qaysi formula bilan ifodalanadi?", "Normal kuchlanish va nisbiy deformatsiya orasidagi proporsionallik koeffitsiyenti, E = σ/v formulasi orqali.", "Maksimal parchalovchi kuchining ko'ndalang kesim yuzasiga nisbati bo'lib, σсж = Pсж.max/F₀ formulasi bilan.", "Urinma kuchlanish va siljish deformatsiyasi orasidagi proporsionallik koeffitsiyenti, G = τ/γ formulasi orqali.", "Tog' jinsi massasining hajmiga bo'lgan nisbati bo'lib, zichlik koeffitsiyentini bildiradi, γ = m/V' formulasi."], ["Portlovchi moddalar (PM) konchilikdan tashqari qaysi sohalarda qo'llaniladi?", "Metallarni ishlash, shtampovka, svarka, tuproqni zichlash, o'rmondagi yong'inlarni o'chirishda faol foydalaniladi.", "Asosan faqat harbiy sanoat va kosmik texnologiyalarda, boshqa sohalarda qo'llanilmaydigan cheklangan moddalar.", "Qishloq xo'jaligida hosildorlikni oshirish va o'simliklarni zararkunandalardan himoya qilishda qo'llaniladi.", "Tibbiyotda jarrohlik operatsiyalari va diagnostika usullarini takomillashtirishda, tibbiy asboblar yasashda."], ["Sanoatda qo'llaniladigan portlovchi moddalar fanning asosiy maqsadi nimadan iborat?", "Portlovchi moddalarning xususiyatlari va tarkibini o'rganib, portlatish texnologiyasini rivojlantirishdan iborat.", "Faqat tog' jinslarining fizik xususiyatlarini o'rganish va ularni tasniflash tizimini yaratishni maqsad qiladi.", "Yangi turdagi portlovchi moddalarni faqat harbiy maqsadlar uchun sintez qilish va ularni sinashni ko'zlaydi.", "Konchilik sohasida burg'ilash usullarini takomillashtirish va texnik samaradorlikni oshirishni maqsad qiladi."], ["Granit, gabbro va kvarstit kabi tog' jinslarining g'ovaklik koeffitsiyenti qaysi diapazonda bo'ladi?", "Ushbu tog' jinslari uchun g'ovaklik koeffitsiyenti 0,8-1,2 oralig'ida bo'ladi, bu ularning xossalarini ifodalaydi.", "Ularning g'ovaklik koeffitsiyenti 0,5-13,4 oralig'ida bo'lishi mumkin, bu juda keng diapazonni tashkil etadi.", "Berilgan tog' jinslarida g'ovaklik koeffitsiyenti 4-28,3 oralig'ida joylashadi, bu ularning suv o'tkazuvchanligini ko'rsatadi.", "Bu turdagi tog' jinslari uchun g'ovaklik koeffitsiyenti 44-65 oralig'ida hisoblanadi, bu ularning yumshoqligini bildiradi."], ["Sanoat portlovchi moddalarni ishlab chiqishda konchilik ilmining asosiy yo'nalishi nima hisoblanadi?", "Tog' jinslarini kam xarajatli effektiv maydalashning yangi texnologiyalarini ishlab chiqish hisoblanadi.", "Faqatgina metall qazib olish uchun eng zamonaviy uskunalarni joriy etishga qaratilgan harakatlardir.", "Yer osti tunnellarini qazishda xavfsizlikni oshirish bo'yicha ilmiy izlanishlarni olib borish muhimdir.", "Kimyoviy usullar bilan foydali qazilmalarni ajratib olishning yangi usullarini topish talab etiladi."], ["A. Sobrero tomonidan 1847 yilda sintez qilingan portlovchi modda qaysi va uning ahamiyati nimada?", "A. Sobrero nitroglitserinni sintez qilgan va bu modda portlatish ishlarida qora poroxni almashtirgan.", "A. Sobrero trinitrophenolni yaratgan, bu esa uni xavfsizroq va barqarorroq PMlardan biriga aylantirgan edi.", "A. Sobrero geksogenni sintezlagan, bu esa uni zamonaviy harbiy portlovchi moddalarning asosi deb e'lon qildi.", "A. Sobrero dinamitni ixtiro qilgan, bu esa tog' jinslarini maydalash jarayonlarini sezilarli darajada tezlashtirgan."], ["Sanoat portlovchi moddalar fanining asosiy maqsadi nimadan iborat?", "Sanoatda qo'llaniladigan portlovchi moddalarning xususiyatlari va tarkibini o'rganib, portlatish texnologiyasini turli sharoitlarda o'rganish.", "Faoliyatni samarali tashkil etish uchun faqat tog' jinslarining mexanik xossalarini tahlil qilishga qaratilgan.", "Faoliyatni asosan konchilik sohasidagi burg'ulash texnologiyalarini takomillashtirish vazifasini bajarish.", "Faoliyatni faqat foydali qazilmalarni er osti usulida qazib olish usullarini o'rganish vazifasi bilan cheklanadi."], ["Tog' jinsining g'ovakligi qanday fizik birlik bo'lib, uning formulasini ko'rsating?", "Tog' jinsi tarkibidagi g'ovaklar hajmining umumiy hajmiga nisbati bo'lib, Π = Vₚ / V formula bilan aniqlanadi.", "Tog' jinsi massasining uning hajmiga nisbati bo'lib, γ = m / V formula bilan aniqlanadigan xarakteristikadir.", "Tog' jinsidagi suv miqdorini bildiruvchi namlik darajasi bo'lib, Kᵣ = ωγ / Π formula bilan ifodalanadi.", "Tog' jinsining bir o'qli siqilishga chidamliligi chegarasi bo'lib, σсж = Pсж.max / F₀ formula bilan aniqlanadi."], ["Tog' jinsining bir o'qli siqishga chidamlilik chegarasi qanday formula bilan ifodalanadi?", "Tog' jinsi namunasini maksimal parchalovchi kuchining ko'ndalang kesmi yuzasiga nisbati: σсж = Pсж.max / F₀.", "Tog' jinsidagi g'ovaklar hajmining umumiy hajmiga nisbati: Π = Vₚ / V.", "Tog' jinsi massasining uning hajmiga nisbati: γ = m / V.", "Tog' jinsining namlik koeffitsienti: Kᵣ = ωγ / Π."], ["Yung moduli (elastiklik moduli) qanday aniqlanadi va uning formulasi qanday?", "Normal kuchlanish va deformatsiya orasidagi proporsionallik koeffitsienti bo'lib, E = σ / ν formulasi orqali.", "Siljish kuchlanishi va siljish deformatsiyasi orasidagi nisbat bo'lib, G = τ / γ formulasi bilan ifodalanadi.", "Bir o'qli cho'zilishga chidamlilik chegarasi bo'lib, σр = Pр.max / F₀ formulasi bilan aniqlanadi.", "Tog' jinsining qattiqlik koeffitsienti bo'lib, f = σсж / 100 formulasi yordamida hisoblanadi."], ["Tog' jinsining jilvirliligi (abrazivnost) deganda nimani tushuniladi?", "Mashina yoki uskunaning tog' jinsi kontaktidagi emirilishiga aytiladi.", "Tog' jinsining yuqori bosim ostida o'z shaklini o'zgartirish qobiliyatiga aytiladi.", "Tog' jinsining issiqlik o'tkazuvchanlik xususiyatini ifodalovchi ko'rsatkichdir.", "Tog' jinsining suvga chidamlilik darajasini belgilovchi asosiy xususiyatdir."], ["Tog' jinsining va tog' massivining darzliligi qanday aniqlanadi?", "Ma'lum o'lchamli darzliklar, ularning orientatsiyasi va joylashish chastotalarining birlikdagi yig'indisi asosida.", "Tog' jinsining plastik deformatsiya qobiliyatiga qarab, uning suyuqlik yutish xususiyatiga asoslanadi.", "Tog' jinsining kimyoviy tarkibi va uning erish nuqtasiga qarab vizual usullar bilan belgilanadi.", "Tog' jinsining umumiy og'irligi va hajmiga qarab, uning zichlik darajasini hisobga olib aniqlanadi."], ["Qora porox qachon va kim tomonidan Yevropada yaratilganligi haqida ma'lumot bering.", "Qora porox tarkibi Yevropada Bertold Shvarst tomonidan yaratilganligi haqida turli ma'lumotlar bor.", "Qora porox Bertold Shvarst tomonidan faqat XVII asrga kelib konchilik sohasida yaratilgan.", "Qora porox ixtirosi faqatgina A. Nobel nomiga yozilgan bo'lib, XIX asrda patentlangan edi.", "Qora poroxning Yevropada yaratilishi haqida ishonchli manbalar mavjud emas, u faqat Osiyoda paydo bo'lgan."], ["Portlovchi moddaning solishtirma sarfi (q) deganda nima tushuniladi?", "Talab etilgan hajm birligidagi togʻ jinsini portlatish uchun zaryad boʻlgan portlatuvchi modda miqdori hisoblanadi, kg/m³ da oʻlchanadi.", "Zaryadning umumiy massasini portlatilgan togʻ jinsining sirt maydoniga nisbati boʻlib, bu faqat samaradorlikni baholash uchun ishlatiladi.", "Portlatish natijasida hosil boʻlgan voronka hajmining zaryadlovchi laxim diametriga nisbati boʻlib, u togʻ jinsining mustahkamligiga bogʻliqdir.", "Bitta shpurga joylashtirilgan portlovchi modda massasining shpur uzunligiga nisbati boʻlib, asosan zaryadlovchi laximning chuqurligini bildiradi."], ["Zaryadlashning nisbiy zichligi qanday qiymatlarni koʻrsatadi va uning odatiy oraligʻi qancha?", "Zaryad massasining shpur yoki skvajinaning toʻla hajmiga nisbatini koʻrsatadi va 0,5-0,7 kg/dm³ ga teng boʻladi.", "Zaryadning umumiy hajmining portlovchi modda hajmini anglatadi va odatda 1,0 kg/m³ dan oshmaydigan qiymatlarni ifodalaydi.", "Portlovchi moddaning umumiy massasining shpur diametriga nisbati boʻlib, 0,1-0,3 kg/m² oraligʻida boʻlishi odatiy hol hisoblanadi.", "Portlovchi modda zichligining patron uzunligiga koʻpaytmasini koʻrsatadi va odatda 1,5-2,0 kg/m oraligʻidagi qiymatlarga ega boʻladi."], ["Yalpi (massoviy) portlatish deganda nimani tushunasiz?", "Bitta umumiy tarmoqqa ulangan bir nechta skvajinalar, kozonlar yoki kamerali zaryadlarning, xuddi shunday uzunligi 10 m. dan ortiq boʻlgan hollarda bir vaqtda portlatilishidir.", "Faqat bitta skvajinada joylashtirilgan zaryadning portlatilishini anglatadi, bu jarayonda yonma-yon zaryadlarga eʼtibor berilmaydi va birin-ketin bajariladi.", "Har xil chuqurlikdagi shpurlar orasidagi masofani portlatishni tashkil etishni bildiradi, bu esa portlatish jarayonining murakkabligini oshiradi.", "Portlovchi moddalarni zaryadlash va ularni turli masofalarda joylashtirishni oʻz ichiga olgan, ammo bir vaqtda portlatish shart boʻlmagan jarayondir."], ["Agar zaryadning solishtirma sarfi oshirilsa, portlashda qanday natija sodir boʻladi?", "Bunda itkitib tashlash (vыbros) sodir boʻladi, yaʼni togʻ jinslari ancha uzoq masofaga otiladi.", "Jinslarning kuchaytirilgan yoki normal yumshatilishi (rixlenie) sodir boʻladi, maydalanish darajasi ortadi.", "Portlashning seysmik taʼsiri keskin kamayadi, atrofdagi muhitga salbiy taʼsiri pasayadi.", "Togʻ jinslari yirik boʻlaklarga parchalanadi, bu esa keyingi qayta ishlashni osonlashtiradi."], ["Shpur deb nimaga aytiladi va uning asosiy xarakteristikalari qaysilar?", "Togʻ jinsida uzunligi (chuqurligi) 5 m. gacha, diametri 75 mm. gacha boʻlgan, unga portlovchi modda zaryadini joylash uchun teshilgan silindrik shakldagi chuqurlikdir.", "Togʻ jinsida hosil qilingan, diametri 100 mm dan ortiq boʻlgan kengaygan boʻshliq boʻlib, asosan kichik hajmdagi portlatishlar uchun ishlatiladi va uning chuqurligi doim 10 metrdan ortiq boʻladi.", "Yer osti konlarida burgʻilash orqali hosil qilingan vertikal teshik boʻlib, uning asosiy vazifasi havo oqimini taʼminlash va diametri doim 50 mm dan oshmaydi.", "Faqat tuproq qatlamida hosil qilingan, chuqurligi 2 metrdan oshmaydigan teshik boʻlib, u portlovchi moddalarni emas, balki suvni chiqarib tashlash uchun ishlatiladi."], ["Shpurli zaryadlash metodining afzalliklari qaysilar?", "Parchalanayotgan togʻ jinsining bir tekisda maydalanishini taʼminlaydi, texnologiya oddiy, har qanday togʻ-geologik sharoitda qoʻllaniladi, seysmik taʼsiri kam boʻladi.", "Ishlab chiqarish xarajatlarini keskin kamaytiradi va portlatuvchi modda sarfini minimallashtiradi, faqat qattiq togʻ jinslarida qoʻllaniladi.", "Faqat gorizontal shpurlardan foydalanishga imkon beradi, bu esa yer osti konlarida ishlashni soddalashtiradi, lekin sirtda qoʻllanishi cheklangan.", "Portlatilgan massaning umumiy hajmini oshiradi, noulcham boʻlaklarning paydo boʻlishini butunlay oldini oladi va faqat yumshatish ishlariga mos keladi."], ["Shpurning (skvajinaning) chuqurligi quyidagi formula bilan aniqlanadi:", "lм = H + lп, m (16)", "lм = H - lп, m (16)", "lм = H × lп, m (16)", "lм = H / lп, m (16)"], ["Kozonsimon zaryadlash metodi qanday amallar yigʻindisini oʻz ichiga oladi?", "Burgʻilash, prostrelivanie skvajin, PM ni tayyorlash va tashish, kozon hajmini oʻlchash, boeviklarni tayyorlash, zaryadlash, tikinlash, portlatuv tarmoqni tayyorlash, portlatish va joyni tekshirish.", "Faqat yer usti portlatish ishlarida qoʻllaniladigan zaryadlash usullarining xavfsizlik choralarini aniqlash va ishchilarni oʻqitishni oʻz ichiga oladi, texnik jarayonlar istisno qilinadi.", "Togʻ jinslarining fizik-mexanik xususiyatlarini aniqlash, ularni portlatish uchun eng mos portlovchi modda turini tanlash va portlash kuchini hisoblashni oʻz ichiga oladi.", "Portlovchi moddalarni omborda saqlash, tashish va ularni zaryadlash joyiga yetkazishni qamrab olgan, ammo portlatish jarayonining oʻzini istisno qiluvchi metod."], ["Kozonsimon zaryadlash metodining afzalliklari qaysilar?", "1 m skvajinadan chiqadigan parchalangan togʻ jinslarining koʻp miqdorda olinishi hamda ustup ostki qismining yaxshi ishlanishi.", "Togʻ jinslarining bir tekisda maydalanishini taʼminlaydi, texnologiyaning soddaligi va har qanday geologik sharoitda qoʻllanilishi.", "Portlatish ishlarining xavfsizligini oshiradi va portlovchi moddalar sarfini sezilarli darajada kamaytiradi, shuningdek, seysmik taʼsirni minimallashtiradi.", "Burgʻilash ishlarining hajmini kamaytiradi va portlatilgan massaning umumiy hajmini oshiradi, noulcham boʻlaklarning paydo boʻlishini bartaraf etadi."], ["Portlatish ishlari texnologiyasi ta'rifi qanday asosiy jarayonlar yigʻindisini oʻz ichiga oladi?", "Portlatuvchi moddalar energiyasini samarali hamda bexatar ishlatishga qaratilgan tashkiliy tadbirlar va texnologik usullar yigʻindisi.", "Togʻ jinslarini burgʻulash va maydalashga qaratilgan faqatgina mexanik usullar va asbob-uskunalar majmui.", "Faqatgina portlovchi moddalarni ishlab chiqarish va ularni xavfsiz saqlash bilan bogʻliq boʻlgan barcha jarayonlar.", "Kon-geologik sharoitlarni oʻrganish va portlatish ishlarini rejalashtirish uchun zarur boʻlgan tayyorgarlik jarayonlari."], ["Portlatish ishlarini olib borish metodlari nimalarni o'z ichiga oladi va ularga qanday zaryadlovchi laximlar misol boʻla oladi?", "Zaryadlovchi laximlarni tayyorlash, zaryadlarni joylashtirish va kon-texnik samaradorlikka erishish usullari; shpur, skvajina, kozon, maxsus togʻ laximlari.", "Portlovchi moddalarni sarflashni hisoblash, xavfsizlik choralarini taʼminlash va atrof-muhitga taʼsirini baholash jarayonlari.", "Portlatish joyini tekshirish, atrof-muhitga taʼsirini kamaytirish va zaryadlash zichligini optimallashtirish boʻyicha metodlar.", "Togʻ jinsining mustahkamligini aniqlash, parchalash darajasini belgilash va optimal portlatuvchi moddani tanlash usullari."], ["Zaryadlashning nisbiy zichligi qanday qiymatlarni ko'rsatadi va uning odatiy oralig'i qanday?", "Zaryad massasining shpur yoki skvajinaning toʻla hajmiga nisbatini koʻrsatadi va 0,5-0,7 kg/dm³ ga teng boʻladi.", "Portlovchi modda sarfining parchalangan togʻ jinsi hajmiga nisbatini aks ettiradi va 1,0-1,2 kg/m³ oraligʻida joylashgan boʻladi.", "Zaryadning umumiy quvvatini uning seysmik taʼsiriga nisbatini ifodalaydi va 0,2-0,4 kg/m³ qiymatida oʻzgaradi.", "Patronlarning umumiy sonining shpur uzunligiga nisbati boʻlib, odatda 0,8-0,9 kg/dm³ dan oshmaydi."], ["Portlatuvchi moddaning solishtirma sarfi nima va u qanday ikki xil ko'rinishda bo'lishi mumkin?", "Talab etilgan hajm birligidagi togʻ jinsini portlatish uchun zarur boʻlgan portlovchi modda miqdori; hisob-kitob va amaldagi solishtirma sarf.", "Togʻ jinsining mustahkamligini aniqlash uchun ishlatiladigan portlovchi moddaning maksimal miqdori; nazariy va empirik solishtirma sarf.", "Portlatish natijasida hosil boʻlgan chang miqdorining togʻ jinsining hajmiga nisbati; optimal va minimal solishtirma sarf.", "Zaryadning umumiy massasining uning uzunligiga nisbati; kon-texnik va geologik solishtirma sarf."], ["Amaldagi (faktich) solishtirma sarf qaysi formula orqali aniqlanadi?", "qφ = Qφ / Vφ, kg/m³", "qφ = Qφ × Vφ, kg·m³", "qφ = Vφ / Qφ, m³/kg", "qφ = Qφ + Vφ, kg+m³"], ["Portlovchi moddalarning nisbiy quvvatini hisobga olgan tuzatish koeffitsienti (Kp) qanday formula bilan ifodalanadi?", "Kp = q_e / q_n", "Kp = q_n / q_e", "Kp = q_e + q_n", "Kp = q_e × q_n"], ["Shpur deb nimaga aytiladi va uning o'lchamlari qanday bo'ladi?", "Togʻ jinsida portlovchi modda zaryadini joylash uchun teshilgan silindrik shakldagi, uzunligi 5 m gacha, diametri 75 mm gacha boʻlgan chuqurlik.", "Er ostida hosil qilingan sunʼiy boʻshliq boʻlib, uning diametri 100 mm dan oshadi va uzunligi cheklanmagan boʻladi.", "Yuzaki zaryadlashda ishlatiladigan, togʻ jinsining ustiga joylashtiriladigan katta oʻlchamdagi portlovchi modda uyumi.", "Massivda togʻ jinslarini parchalash uchun qoʻllaniladigan, diametri 150 mm dan oshadigan va balandligi 10 m gacha boʻlgan vertikal laxim."], ["Alohida qismlari bir-biridan oraliqlar bilan bo'lingan zaryadlarning (rassredotochennye) asosiy afzalliklari nimada?", "PM massasini teng oʻlchamli taqsimlashni taʼminlaydi va portlashning boshlangʻich dinamik taʼsirini yaxshilaydi.", "Zaryadlash texnologiyasi soddalashadi va portlatuvchi vositalar sarfi sezilarli darajada kamayadi.", "Portlash natijasida faqatgina juda katta boʻlaklar hosil boʻladi va ular qayta maydalashni talab qilmaydi.", "Seysmik taʼsir butunlay yoʻq qilinadi va atrof-muhitga hech qanday zarar yetkazilmaydi."], ["Kamerali va kichik kamerali zaryadlash metodining asosiy kamchiliklari nimadan iborat?", "Faqatgina massivdagi togʻ jinslarini portlatishda qoʻllanishi, tayyorgarlik ishlarining koʻp mehnat talab qilishi va qimmatligi.", "Parchalanadigan togʻ jinsining hajmi cheklangan boʻlishi va faqat kichik hajmdagi massalarni parchalash mumkinligi.", "Zaryadlash texnologiyasining soddaligi va portlovchi modda sarfining kamligi, bu esa umumiy xarajatlarni pasaytiradi.", "Atrof-muhitga taʼsirining minimal darajada boʻlishi va portlatish natijasida hosil boʻlgan chang miqdorining kamligi."], ["Parallel yakinlashtirilgan zaryadlar bilan portlatish metodining mohiyati nimadan iborat?", "Ustupning birinchi qatorida odatiy skvajinalar diametriga teng boʻlgan 2 yoki undan ortiq skvajinani parallel joylashtirish.", "Zaryadlashning seysmik taʼsirini minimallashtirish uchun har bir skvajinaga alohida-alohida va ketma-ket zaryadlarni joylashtirish.", "Bitta katta diametrli skvajina oʻrniga bir nechta kichik diametrli skvajinalarni vertikal ravishda joylashtirish va ularni bir vaqtda portlatish.", "Kameraning ichki qismida hosil boʻlgan boʻshliqqa portlovchi modda zaryadini joylashtirish va uni uzoq masofadan turib portlatish."], ["Portlatish ishlarida zaryadlovchi laximlarning qanday asosiy turlari mavjud, ularga misollar keltiring?", "Shpur, skvajina, kozon va maxsus tog‘ laximlari (kameralar) kabilarni o‘z ichiga oladi.", "Faqatgina ochiq konlardagi yer osti tunnel va shaxta chuqurliklarini o‘z ichiga oladi.", "Asosan quduqlar va suv quvurlari kabi turli xil texnik chuqurliklarga ishora qiladi.", "Portlash uchun tayyorlangan sun'iy ko‘rfazlar va suv omborlari tushunchasini anglatadi."], ["Portlovchi moddaning zaryadlash zichligi nima deb ataladi va qanday nisbat bilan ifodalanadi?", "Portlovchi modda zaryadining massasining shpurning zaryadlanadigan qismi hajmiga nisbati sifatida belgilanadi.", "Zaryadning umumiy hajmining portlovchi modda patronlari soniga nisbatini ko'rsatuvchi ko'rsatkichdir.", "Zaryadning zichligi, uning portlash natijasida hosil bo'lgan jins hajmi bilan bog'liq bo'ladi.", "Shpur devorlari va zaryad orasidagi bo'shliqlarning umumiy hajmining belgilanishidir."], ["Yalpi (massoviy) portlatish qanday amalga oshiriladi va uning asosiy belgilari nimalardan iborat?", "Bir umumiy tarmoqqa ulangan bir nechta zaryadlar yoki uzunligi 10 metrdan ortiq yakka zaryadlarning portlatilishi.", "Faqatgina bitta skvajinada joylashgan zaryadni alohida va juda tezlik bilan portlatish usuli hisoblanadi.", "Turli vaqtlarda, alohida-alohida joylarda amalga oshiriladigan kichik hajmli portlatish jarayonidir.", "Portlatuvchi moddalarning kimyoviy tarkibini o‘zgartirish orqali portlash quvvatini oshirish uslubidir."], ["Yumshatuvchi zaryad massasi (Qᵣ) qaysi formula asosida hisoblanadi va unda qanday parametrlar qo'llaniladi?", "Qᵣ = 0,33qᵣW³ formulasi bo'yicha aniqlanadi, bu yerda qᵣ solishtirma sarf, W esa qarshilik chizig‘idir.", "Qᵣ = (qᵣ + W³) / 0,33 formulasi yordamida topiladi, bu yerda qᵣ quvvat koeffitsienti, W esa chuqurlikdir.", "Qᵣ = qᵣW² / 0,33 formulasi bilan belgilanadi, bu yerda qᵣ hajmiy zichlik, W esa voronka radiusidir.", "Qᵣ = 0,33qᵣ / W³ formulasi bilan hisoblanadi, bu yerda qᵣ portlash tezligi, W esa balandlikdir."], ["Shpurli zaryadlash metodining asosiy afzalliklari qanday omillarni o‘z ichiga oladi va uning muhim xususiyatlari nimalardan iborat?", "Tog‘ jinslarining bir tekis maydalanishini ta’minlash, texnologiyaning oddiyligi va kam seysmik ta’sir.", "Zaryadlash ishlarining kam mehnat sarfini va portlovchi moddalarning kam sarfini ta’minlaydi.", "Faqatgina gorizontal shpurlardan foydalanish imkoniyati va yuqori darajadagi xavfsizlikni kafolatlaydi.", "Burg‘ulash hajmini sezilarli darajada kamaytirish va portlatish ishlarining umumiy qiymatini pasaytirish."], ["Tikinlagich (zaboynik) qanday asbob va u portlatish ishlarida qaysi maqsadlarda qo'llaniladi?", "Patronlarni shpurlarga joylashtirish va zichlashtirish uchun ishlatiladigan dumaloq, uchli sterjendir.", "Portlatish chuqurligini o'lchash va uning diametrini aniqlash uchun mo'ljallangan maxsus o'lchov vositasidir.", "Portlovchi moddalarni aralashtirish va ularni portlatish uchun tayyorlashga xizmat qiladigan mexanizmdir.", "Shpurning devorlarini mustahkamlash va atrof-muhit ta'siridan himoya qilish uchun ishlatiladigan qurilmadir."], ["Skvajina nima va u qanday xususiyatlarga ega bo'lgan holda qaysi maqsadlarda tayyorlanadi?", "Tog‘ jinsida diametri 75 mm dan ortiq, zaryadlarni joylashtirish uchun tayyorlangan sun’iy silindrik chuqurlik.", "Faqatgina 5 metrdan ortiq chuqurlikka ega bo'lgan va suv chiqarish uchun ishlatiladigan tabiiy quduqdir.", "Yer osti konlarida burg'ulash uskunalari uchun mo'ljallangan va asosan shamollatishga xizmat qiladigan teshik.", "Portlashdan keyin jins qoldiqlarini yig'ish uchun mo'ljallangan va diametri 75 mm dan kam bo'lgan maxsus idish."], ["Kamerali va kichik kamerali zaryadlash metodining asosiy afzalliklari nimalardan iborat va ular qanday foyda beradi?", "Transportda to‘xtashlar va portlatishlar sonining kamayishi, ko‘p miqdorda jins massasini portlatish imkoniyati.", "Tog‘ jinslarining bir tekis maydalanishini ta’minlash va noulcham bo‘laklarning minimal darajada chiqishiga erishish.", "Burg‘ulash ishlarining hajmini sezilarli darajada kamaytirish va portlashning seysmik ta’sirini pasaytirish.", "Portlovchi modda va portlatish vositalarining solishtirma sarfini kamaytirish va xavfsizlikni oshirish."], ["Sanoatda qo'llaniladigan portlovchi moddalarning fizikaviy holatini o'rganish orqali qanday asosiy tasniflar ajratiladi?", "Kukunsimon, granula shaklida, presslangan, quyilgan va suvga to'yingan holatlar.", "Yuqori zichlikli, o'rtacha zichlikli, past zichlikli hamda detonatsiya tezligiga ko'ra.", "Kimyoviy aktivlik, detonatsiya barqarorligi va yopishqoqlik darajasi.", "Atrof-muhit ta'siri, saqlash sharoitlari va tashishdagi xavfsizlik talablari."], ["Tarkibida 15% dan ortiq suyuk nitroefir moddasiga ega bo'lgan sanoatlashtirilgan PMlar xavfsizlik bo'yicha qaysi sinfga kiradi?", "Bu moddalar tarkibi bo'yicha birinchi sinfga mansub portlovchi moddalar hisoblanadi.", "Bu moddalar tarkibi bo'yicha ikkinchi sinfga mansub portlovchi moddalar hisoblanadi.", "Bu moddalar tarkibi bo'yicha uchinchi sinfga mansub portlovchi moddalar hisoblanadi.", "Bu moddalar tarkibi bo'yicha to'rtinchi sinfga mansub portlovchi moddalar hisoblanadi."], ["Elektrodetonatorlar, kapsyul detonatorlar va pirotexnik relelar sanoat PM larining omborlarda saqlanishi va tashishdagi xavfsizliklar tasnifi bo'yicha qaysi sinfga kiradi?", "Ular ushbu tasnifga ko'ra, portlovchi moddalarning to'rtinchi sinfini tashkil etadi.", "Ular ushbu tasnifga ko'ra, portlovchi moddalarning birinchi sinfini tashkil etadi.", "Ular ushbu tasnifga ko'ra, portlovchi moddalarning ikkinchi sinfini tashkil etadi.", "Ular ushbu tasnifga ko'ra, portlovchi moddalarning uchinchi sinfini tashkil etadi."], ["Himoyalanmagan sanoatlashtirilgan PMlar (I sinf) asosan qanday kon ishlarida qo'llaniladi?", "Faqat foydali qazilma konlarini ochiq usulda qazib olishdagi maydalash ishlarida.", "Yer osti kon ishlarida, gaz va changdan xavfli shaxtalardan tashqari holatlarda.", "Metanga xavfli ko'mir va tog' jinslarini yer osti usulida qazib olishda.", "Maxsus portlatish ishlarida hamda xavfli konstentratsiyalar mavjud konlarda."], ["I sinf himoyalanmagan portlovchi moddalarning birinchi guruhi – granulasimon suvga ustuvor PMlar qaysi turdagi tog' jinslarini portlatishda ishlatiladi?", "Qattiq va o'ta qattiq, suvga mustahkam tog' jinslarini portlatish ishlarida qo'llaniladi.", "O'rtacha qattiqlikdagi, quruq va suvga mustahkam bo'lmagan tog' jinslarida.", "Noo'lcham tog' jinslarini ikkilamchi maydalash uchun ham samarali ishlatiladi.", "Sezgirligi kam bo'lgan sanoatlashtirilgan PMlarni detonatsiyalash maqsadida."], ["III sinf himoyalangan sanoatlashtirilgan PMlar qaysi turdagi kon sharoitlarida qo'llaniladi?", "Foydali qazilmalarni yer osti usulida (gaz va changdan xavfli shaxtalarda) qazib olishda.", "Faqat ochiq usulda qazib olishda, har qanday tog' jinslarida maydalash uchun.", "Metan gazi va ko'mir changidan xavfli bo'lmagan konlarda ham qo'llaniladi.", "Faqat quruq sharoitdagi tog' jinslarini maydalash ishlarida keng tarqalgan."], ["Suvga mustahkam tog' jinslarini portlatish uchun qo'yilgan talab qaysi jihatlarni o'z ichiga oladi?", "50% dan ortiq suvga mustahkam, zichligi 1 kg/m³ dan ortiq va turg'un detonatsiyalash.", "Kimyoviy aktivlikning yuqori darajasi va past haroratda barqaror detonatsiya.", "Faqat granula shaklida bo'lishi va xavfsiz saqlash sharoitlariga rioya qilish.", "Detonatsiya tezligining doimiy yuqori qiymatlari va oson ishlov berilishi."], ["Jadval 7.1 ga ko'ra, emulsion matristani ishlab chiqarishda 82% li quyuq nitrat ammoniy (NH₄NO₃)ning tarkibiy foizi qancha?", "Ushbu xom-ashyoning emulsion matristadagi tarkibi 91,8% ni tashkil etadi.", "Ushbu xom-ashyoning emulsion matristadagi tarkibi 0,25% ni tashkil etadi.", "Ushbu xom-ashyoning emulsion matristadagi tarkibi 5,9% ni tashkil etadi.", "Ushbu xom-ashyoning emulsion matristadagi tarkibi 1,2% ni tashkil etadi."], ["Jadval 7.2 ga binoan, Nobelit-2050 tarkibidagi granulirlangan ammiakli selitraning foiz miqdori qanchaga teng?", "Nobelit-2050 uchun granulirlangan ammiakli selitra miqdori 47,0% ni tashkil etadi.", "Nobelit-2050 uchun granulirlangan ammiakli selitra miqdori 9,4% ni tashkil etadi.", "Nobelit-2050 uchun granulirlangan ammiakli selitra miqdori 28,2% ni tashkil etadi.", "Nobelit-2050 uchun granulirlangan ammiakli selitra miqdori 37,6% ni tashkil etadi."], ["Nobelit 216Z portlovchi moddasining suvga mustahkamligi Jadval 7.7 da qanday tavsiflangan?", "Ushbu portlovchi moddaning suvga mustahkamligi chegaralanmagan deb ko'rsatilgan.", "Ushbu portlovchi moddaning suvga mustahkamligi past darajada ekanligi ko'rsatilgan.", "Ushbu portlovchi moddaning suvga mustahkamligi o'rtacha darajada ekanligi ko'rsatilgan.", "Ushbu portlovchi moddaning suvga mustahkamligi faqat quruq sharoitda tasdiqlangan."], ["Sanoatda qoʻllaniladigan portlovchi moddalarning fizikaviy holatini oʻrganish orqali tasnifi qanday shakllarni oʻz ichiga oladi?", "Kukunsimon, granula shaklda, presslangan, quyilgan va suvga toʻyingan holatlarni oʻz ichiga oladi.", "Faqat suyuq, gazsimon va qattiq fazali shakllarni oʻz ichiga oladi, boshqa holatlar kiritilmaydi.", "Jel, pasta va koʻpik shakllarini oʻz ichiga oladi, ularning zichligi muhimdir.", "Faqat granulalangan va presslangan holatlarni oʻz ichiga oladi, mayda kukunlar hisoblanmaydi."], ["Sanoatda qoʻllaniladigan portlovchi moddalarning kimyoviy tuzilishini oʻrganish orqali tasnifi asosida qaysi turlar ajratib koʻrsatiladi?", "Ammiakli-selitrali, nitro aralashma, suyuq efir, xloratli va poroxlar turlari ajratib koʻrsatiladi.", "Faqat organik va anorganik birikmalarga asoslangan turlar, ularning xossalari bilan.", "Metall asosli, polimer asosli va ularning gibrid kombinatsiyalari asosida turlar.", "Yuqori kislorodli, past kislorodli va neytral balansli moddalar turlari ajratib koʻrsatiladi."], ["Konchilik sohasida portlovchi moddalarni ishlab chiqarishda tanlash asosan qanday kriteriyalar asosida amalga oshiriladi?", "Atrof-muhitga ta'siri, fizikaviy holati, kimyoviy tuzilishi, omborlarda saqlash va tashishdagi xavfsizliklari asosida.", "Faqat narxi, mavjudligi va ishlab chiqaruvchining obroʻsi kabi iqtisodiy omillar asosida.", "Ishlab chiqarish jarayonining murakkabligi va xomashyo yetkazib berishning osonligi asosida.", "Ishlab chiqariladigan moddaning estetik koʻrinishi va qadoqlash usuli asosida tanlanadi."], ["Sanoatda qoʻllaniladigan portlovchi moddalarning omborlarda saqlanishi va tashishdagi xavfsizliklar boʻyicha tasnifining 1-sinfiga qaysi PMlar kiradi?", "Tarkibida 15% dan ortiq suyuq nitroefir moddasiga ega boʻlgan PMlar, masalan, flegmatizatsiyalangan geksogen va tetril.", "Tarkibida 15% gacha suyuq nitroefir moddasiga ega boʻlgan PMlar, masalan, trotil va ammiakli-selitra.", "Tutunli va tutunsiz poroxlar, ular xavfsizlik jihatidan maxsus talablarga javob beradi.", "Elektrodetonatorlar va kapsyul detonatorlar kabi portlatish vositalari, ular alohida sinfdir."], ["Himoyalanmagan sanoatlashtirilgan portlovchi moddalarning 1-guruhiga kiruvchi \"granulasimon suvga ustuvor PM\"larga qaysi moddalar misol boʻla oladi?", "Granulotol, Alyumotol, Grammanit 50/50-V va Grammanit 30/70-V kabi moddalar kiradi.", "Akvatol 65/35 S, Ifzanit T-20, Karbatol T-15 va Nobelit 30/70 kabi moddalar kiradi.", "ZKP va ZKN sanoatlashtirilgan zaryadlari, ular maxsus ochiq zaryadlardir.", "T-400, Sh-400 va TG-500 markadagi shashkalar, ular oraliq detonatorlardir."], ["Sanoatlashtirilgan portlovchi moddalar qoʻllanilish sharoitiga qarab qaysi asosiy sinflarga boʻlinadi?", "Himoyalanmagan va himoyalangan sinflarga boʻlinadi, har biri oʻziga xos xususiyatlarga ega.", "Faqat oʻta xavfli va kam xavfli sinflarga, xavfsizlik darajasiga qarab tasniflanadi.", "Quruq sharoitda va suvli sharoitda ishlatiladigan sinflarga, namlikka chidamliligiga qarab.", "Yer usti va yer osti ishlari uchun moʻljallangan sinflarga boʻlinadi, kon sharoitlariga qarab."], ["Patron shaklidagi Nobelit 216Z emulsiya portlovchi moddasi qanday sharoitlarda foydali qazilmalarni qazib olishda ishlatiladi?", "Ochiq va yer osti kon ishlarida (gaz va changdan xavfli shaxtalardan tashqari), shpur va skvajinalarda, hamda oraliq detonator sifatida.", "Faqat metan gazi va koʻmir changi mavjud boʻlgan xavfli yer osti shaxtalarida, maxsus xavfsizlik choralariga rioya qilgan holda.", "Faqat suv osti portlatish ishlarida, chuqur suvlarda va yuqori gidrostatik bosim sharoitida, bu muhim.", "Yuqori haroratli va kislotali muhitlarda, kimyoviy jihatdan agressiv boʻlgan sharoitlarda, bu maxsus qoʻllanishdir."], ["Darsning asosiy maqsadi sanoatda qoʻllaniladigan portlovchi moddalarning (PM) nimasi va nimani oʻrganishdan iborat ekanligi ko'rsatilgan?", "Qoʻllanilishi va tasnifini chuqur oʻrganishdan iborat boʻladi.", "Kimyoviy tarkibi va fizik xossalarini tahlil qilishdan iboratdir.", "Ishlab chiqarish usullari va saqlash talablarini bilishdir.", "Xavfsizlik qoidalari va atrof-muhitga ta'sirini tekshirishdir."], ["Sanoatda qoʻllaniladigan portlovchi moddalarning fizikaviy holatini urganish orqali tasnifi qanday shakllarni oʻz ichiga olishi mumkin?", "Kukunsimon, granula shaklda, presslangan, quyilgan va suvga toʻyingan holatlar.", "Qattiq, suyuq, gazsimon va aralash holatdagi tuzilmalarni oʻz ichiga oladi.", "Kristall, amorf, kollodiyli va eritmali moddalarning shakllari bilan belgilanadi.", "Bir komponentli, ikki komponentli va koʻp komponentli tuzilmalarni anglatadi."], ["Sanoatda qoʻllaniladigan portlovchi moddalarning omborlarda saqlanishi va tashishdagi xavfsizliklari boʻyicha 1-sinfga qaysi PMlar kiradi?", "Tarkibida 15% dan ortiq suyuk nitroefir moddasiga ega boʻlgan sanoatlashtirilgan PMlar.", "Tarkibida 15% gacha suyuk nitroefir moddasiga ega boʻlgan PMlar joylashgan.", "Asosan tutunli va tutunsiz poroxlar kabi maxsus moddalar hisoblanadi.", "Elektrodetonatorlar va pirotexnik relelar kabi portlatish vositalari kiradi."], ["II sinf \"himoyalanmagan\" sanoatlashtirilgan PMlar qanday sharoitlarda qoʻllaniladi va ularning ajratib turadigan polosa ranglari qanday?", "Foydali qazilmalarni ochiq va er osti kon ishlarida (gaz va changdan xavfli shaxtalardan tashqari) qoʻllaniladi, polosa – qizil rangda.", "Foydali qazilma konlarini ochiq usulda qazib olishda maydalash ishlarida qoʻllaniladi, polosa – oq rangda.", "Metanga xavfli koʻmir va togʻ jinslarini er osti usulida qazib olishda ishlatiladi, polosa – qizil rang.", "Maxsus portlatish ishlari uchun, metan gazi va koʻmir changidan tashkil boʻlgan xavfli konsentratsiyalarda."], ["II sinfning 3-guruhiga kiruvchi \"suvga mustahkam, kukunsimon PM\"larning \"a-kichik guruhi\" qaysi xususiyatlarga ega va qayerda qoʻllaniladi?", "Standart diametrdagi, yuqori quvvatli, patron shaklidagi va suvga mustahkam, quruq va suvga toʻyingan qattiq togʻ jinslarini portlatishda ishlatiladi.", "Standart diametrdagi, oʻrtacha quvvatli, sochma holdagi, quruq va suvga toʻyingan, oʻrtacha qattiqlikdagi togʻ jinslarini portlatishda ishlatiladi.", "Kichik diametrdagi, suvga toʻyingan va quvvatli, nitroglisterindan tashkil topgan, qattiq, quruq va suvga toʻyingan togʻ jinslarini maydalashda ishlatiladi.", "Suvga toʻyingan, plastinkasimon, qattiq togʻ jinslarini quruq va suvga toʻyingan holatlarda maydalashda Akvanit ZL kabi moddalar."], ["IV sinf \"himoyalangan\" sanoatlashtirilgan PMlar qayerda qoʻllaniladi va ularning asosiy foydalanish joylari qaysilar?", "Foydali qazilmalarni er osti usulida qazib olishda, koʻmir va togʻ jinsi hamda slanstli chang va metanli gazdan tashkil topgan zaboylarda (oʻta xavfli zaboylardan tashqari).", "Faqat gaz va changdan xavfli boʻlmagan ochiq usuldagi foydali qazilmalarni qazib olishda ishlatiladi.", "Metanga oʻta xavfli koʻmir va togʻ jinslarini er osti usulida qazib olishda foydalaniladi.", "Suvli togʻ jinslarida yuqori aniqlikdagi portlatish ishlarini amalga oshirishda qoʻllaniladi."], ["Suvga mustahkam togʻ jinslarini portlatish uchun sanoatlashtirilgan PMlarga qoʻyiladigan asosiy talablar qaysilar?", "50% dan ortiq suvga mustahkam PM ishlatilishi, zichligi 1 kg/m³ dan oshiq boʻlishi va toʻliq suvga choʻkishi.", "Faqat quruq togʻ jinslarini portlatishda foydalanish, suvga toʻyingan sharoitlarda qoʻllamaslik.", "Zichligi 1,3-1,5 g/m³ boʻlishi va mahalliy sharoitda tayyorlanish imkoniyatini ta'minlash.", "Detonastiya tezligining past boʻlishi va mexanik taʼsirga yuqori sezuvchanlikka ega boʻlishi."], ["Nobelit 2010-2050 portlovchi moddasi tarkibida Nobelit 2000 tarkibiga nisbatan qaysi qoʻshimcha komponentlar mavjud boʻladi?", "Granulali ammiakli selitra va dizel yoqilgʻisi uning tarkibiga qoʻshilgan.", "Suyuk nitroefir moddasi va trotil kabi asosiy komponentlar qo'shilgan.", "Pirotexnik relelar va elektrodetonatorlar kabi portlatish vositalari qo'shilgan.", "Xloratli va perxloratli birikmalar hamda suvga tuyingan moddalar qo'shilgan."], ["Nobelan 2060-2090 portlovchi moddasining suvli togʻ jinslarida saqlanish muddati qancha kundan oshmasligi kerakligi ko'rsatilgan?", "Saqlanish muddati 6 kundan oshmasligi talab etiladi.", "Saqlanish muddati 3 kundan oshmasligi lozimdir.", "Saqlanish muddati 10 kundan oshmasligi tavsiya qilinadi.", "Saqlanish muddati 2 kundan ortiq boʻlmasligi kerakdir."], ["Gomogen detonatsiyalash mexanizmi qanday tavsiflanadi va u qanday tezliklarda sodir bo'lishi mumkin?", "Detonatsiyali to'lqin fronti zaryad bo'ylab tarqalib, PM tashqi qatlamini siqishi va kimyoviy almashuvlar sodir bo'lishi; 6,0-7,0 km/s.", "Yonish jarayoni asta-sekin, portlovchi moddaning ichki qatlamlarida boshlanishi va tashqi qatlamlarga tarqalishi; 10-20 m/s.", "Issiqlik tarqalishi orqali kimyoviy reaksiyalarning periferiyaga uzatilishi bilan tavsiflanadi; 2,0 km/s dan past.", "Zaryadning butun massasida bir vaqtning o'zida reaksiya boshlanishi va tezligi tovush tezligidan yuqori emas."], ["Portlash paytida ajralib chiqadigan zaharli gazlar tarkibi qaysi omillarga bog'liq?", "PM ning kimyoviy tarkibiga, uning kislorod balansiga va portlatish sharoitlariga bog'liq.", "Faqatgina portlovchi moddaning umumiy massasiga va zaryadlash usuliga qarab belgilanadi.", "Zaharli gazlar tarkibi faqat tashqi muhit haroratiga va namligiga bevosita bog'liq.", "Gazlar tarkibi PM ning zichligi va portlash tezligiga mutlaqo bog'liq emas, doimo bir xil bo'ladi."], ["Chepmen – Juge nuqtasi (Juge nuqtasi) detonatsiya jarayonida nimani anglatadi?", "Bu nuqtada adiabatik siqilish va isishdan so'ng portlovchi modda portlanish bilan tugaydi, bosim maksimal bo'ladi.", "Detonatsiya to'lqinining boshlang'ich nuqtasi bo'lib, u yerda kimyoviy reaksiyalar endigina boshlanadi.", "Gazsimon mahsulotlar bosimining minimal darajaga tushgan nuqtasidir, bu joyda energiya ajralishi tugaydi.", "Bu detonatsiya to'lqinining barqaror tarqalishi buziladigan va uning so'nishi boshlanadigan nuqtadir."], ["Chepmen – Juge nuqtasida detonatsiya tezligi quyidagi formula bilan aniqlanadi:", "Vd = ω + s", "Vd = √(2(n²-1)Q)", "Vd = P₀V₀T / (273V)", "Vd = (22.42 * n_k) / (m₁M₁)"], ["Portlovchi moddaning portlanish issiqligi deganda nimani tushunasiz va u qanday birliklarda o'lchanadi?", "1 kg portlovchi modda portlashida ajralib chiqadigan energiya darajasi; kkal/mol yoki kkal/kg.", "PM ning detonatsiya tezligini oshirish uchun zarur bo'lgan minimal issiqlik; mJ yoki Joul.", "Portlash paytida yuzaga keladigan bosim o'zgarishi; N/m² yoki Pascal.", "Yonish jarayonida PM haroratining maksimal qiymati; Kelvin yoki Selsiy."], ["Okis azoti (NO₂) qanday xususiyatlarga ega va u insonga qanday ta'sir qiladi?", "U o'tkir hidli, sariq-qo'ng'ir rangli, havoda azotli kislotaga aylanadi va CO dan xavfliroq.", "U rangsiz, kuchsiz hidli, havoga nisbatan og'irroq gaz bo'lib, bosh og'rig'ini keltirib chiqaradi.", "U rangsiz, palag'daxum ta'mli, juda zaharli gaz bo'lib, markaziy nerv sistemasini buzadi.", "U o'tkir, qattiq bezovta qiluvchi, nordon ta'mli, yonmaydigan gaz bo'lib, nafas yo'llarini ta'sirlaydi."], ["Zaryad kameralaridagi gaz bosimi quyidagi formula yordamida aniqlanadi:", "p = P₀V₀T / (273V)", "p = (22.42 * (n₁ + n₂ + ... + n_k)) / (m₁M₁)", "p = 31.6√(2(n²-1)Q)", "p = (Q_B * 1000) / M_{BB}"], ["Sanoatda qoʻllaniladigan portlovchi moddalarning fizik mohiyati va detonastiya nazariyasi haqida maʼlumotlar berilgan darsning asosiy maqsadi nima?", "Sanoatda qoʻllaniladigan portlovchi moddalarning fizik mohiyati va detonastiya nazariyasi haqida maʼlumotlar bilan tanishish asosiy maqsad hisoblanadi.", "Portlovchi moddalarning kimyoviy tarkibi va ularning ishlatilish usullarini chuqur oʻrganish, amaliy koʻnikmalarni rivojlantirish vazifasi belgilangan.", "Detonastiya jarayonida ajralib chiqadigan zaharli gazlar va ularning inson salomatligiga taʼsirini toʻliq tahlil qilish muhim jihat sanaladi.", "Portlovchi moddalarning tarixiy rivojlanishi va ularning zamonaviy sanoatdagi ahamiyatini koʻrib chiqish darsning asosiy vazifalaridan biri boʻlishi mumkin."], ["Portlovchi moddaning kritik diametri deganda nima tushuniladi va uning detonastiya qobiliyatiga qanday taʼsiri bor?", "Zaryadning minimal diametri boʻlib, undan kichik diametrda detonastiya beqarorlashib, hatto oʻchib ketishi kuzatiladi, bu uning muhim xossasidir.", "Detonastiya tezligi maksimal qiymatga erishadigan zaryad diametri, undan keyin tezlik ortmaydi, bu chegaraviy diametrga oʻxshashdir.", "Portlovchi moddaning toʻliq yonishi uchun zarur boʻlgan maksimal diametr, undan oshirilganda yonish samaradorligi pasayadi, bu cheklov vazifasini oʻtaydi.", "Zaryadning kritik diametri uning tarkibidagi komponentlarning foiz miqdori bilan bevosita bogʻliq boʻlib, bu miqdorga qarab oʻzgarishi mumkin."], ["Portlovchi modda zaryadining kritik diametriga obolochka (gʻilof) mustahkamligining taʼsiri qanday mexanizmga asoslangan?", "Obolochkaning mustahkamligini oshirish kritik diametrni kamayishiga olib keladi, bu detonastiya qobiliyatini yaxshilashda muhim ahamiyat kasb etadi.", "Mustahkam obolochka kritik diametrni oshiradi, chunki u zarbli toʻlqinlarning tarqalishiga qarshilik koʻrsatib, jarayonni sekinlashtirishi mumkin.", "Obolochkaning mustahkamligi kritik diametrga hech qanday taʼsir koʻrsatmaydi, chunki detonastiya faqatgina portlovchi moddaning ichki xossalariga bogʻliq.", "Obolochka mustahkamligi faqatgina detonastiya tezligiga taʼsir qiladi, ammo kritik diametr oʻzgarishsiz qoladi, bu ikki parametr orasida bogʻliqlik yoʻq."], ["Massasi 1 kg ga teng portlovchi modda yordamida yuzaga kelgan issiqlikni aniqlash uchun qaysi formula qoʻllaniladi?", "Q = (Qᴮ ⋅ 1000) / Mᴮᴮ formulasi yordamida hisoblanadi, bunda Qᴮ — portlash issiqligi, Mᴮᴮ — molekulyar massa.", "Qᵥ = Qᴾ.V. + Qᵥᵥ formulasi ishlatiladi, bunda Qᴾ.V. — portlatish mahsulotlari, Qᵥᵥ — portlash komponentlari issiqligi.", "T = Qᴮ / Cᵥ formulasi orqali topiladi, bunda T — harorat, Qᴮ — issiqlik, Cᵥ — solishtirma issiqlik sigʻimi.", "Vд = 31.6√(2(n²-1)Q) formulasi bilan aniqlanadi, bu esa detonastiya tezligini hisoblash uchun qoʻllanilishi aytilgan."], ["Portlatish harorati (Explosion Temperature) nima deb taʼriflanadi va u qanday jarayon bilan bogʻliq?", "Portlatish ishlari jarayonida portlash mahsulotlari atrof-muhitni isitib, unga ajratadigan maksimal harorat boʻlib, bu muhim xususiyat hisoblanadi.", "Portlovchi modda portlashida ajralib chiqadigan umumiy issiqlik miqdori boʻlib, u moddaning energiya salohiyatini belgilaydi.", "Portlovchi moddaning kimyoviy tarkibiga bogʻliq boʻlgan harorat koʻrsatkichi boʻlib, uning yonish jarayonidagi faolligini aks ettiradi.", "Detonastiya toʻlqinining frontida yuzaga keladigan maksimal harorat boʻlib, u portlovchi moddaning xususiyatlariga bevosita bogʻliqdir."], ["Okis uglerod (CO) qanday asosiy xususiyatlarga ega boʻlgan zaharli gaz hisoblanadi va uning atrof-muhitdagi holati qanday?", "Kuchsiz hidli, rangsiz gaz boʻlib, havoga nisbatan zichligi 0,967 ni tashkil etadi, shuningdek, u 15°S temperaturada suvda eriydi.", "Oʻtkir hidga ega, sargʻish-qoʻngʻir rangli gaz boʻlib, namlik bilan reaksiyaga kirishib, azotli kislota hosil qilishi bilan xarakterlanadi.", "Rangsiz, palagʻdaxum tamiga ega boʻlgan juda zaharli gaz boʻlib, 600°S haroratda yonish va 4,6 – 46% gacha portlash qobiliyatiga egadir.", "Rangsiz, hidsiz va tamsiz gaz boʻlib, olovda yonmaydi, insonning markaziy nerv sistemasiga taʼsir qilishi bilan xavfli hisoblanadi."], ["Inson uchun okis uglerodning (CO) ruxsat etilgan maksimal konsentratsiyasi (PDK) qancha boʻlishi kerak?", "0,02 mg/l (0,006 %hajmda) dan oshmasligi kerak, bu inson salomatligini himoya qilish uchun belgilangan standartdir.", "0,005 mg/l (0,0001 %hajmda) dan oshmasligi lozim, chunki bu gaz hatto past konsentratsiyalarda ham oʻta xavfli hisoblanadi.", "0,0007% dan oshmasligi kerak, bu esa oltingugurtli angidrid uchun belgilangan maksimal ruxsat etilgan konsentratsiyaga toʻgʻri keladi.", "0,00066% dan oshmasligi kerak, bu serovodorod uchun belgilangan maksimal ruxsat etilgan konsentratsiyaga toʻgʻri keladi."], ["Salbiy kislorod balansiga ega boʻlgan portlovchi modda ishlatilganda, portlash gazlari tarkibida qaysi zaharli gaz koʻpayadi?", "Portlash gazlari tarkibida okis uglerod (CO) koʻpayib ketadi, chunki kislorod yetishmasligi uglerodning toʻliq oksidlanishiga imkon bermaydi.", "Portlash gazlari tarkibida okis azoti (NOₓ) koʻp miqdorda ajralib chiqadi, chunki kislorod yetishmasligi azot bilan reaksiyani kuchaytiradi.", "Portlash gazlari tarkibida oltingugurtli angidrid (SO₂) miqdori oshadi, chunki kislorod yetishmasligi oltingugurtning yonishini tezlashtiradi.", "Portlash gazlari tarkibida serovodorod (H₂S) miqdori ortadi, chunki kislorod yetishmasligi vodorodning toʻliq oksidlanishiga xalaqit beradi."], ["Darsning maqsadi nimalardan iborat ekanligi matnda qanday bayon etilgan?", "Sanoatda qo'llaniladigan portlovchi moddalarning fizik mohiyati va detonatsiya nazariyasi haqida ma'lumotlar bilan tanishish.", "Atrof-muhitga ta'sir etuvchi zaharli gazlarning turlari va ularni minimallashtirish usullarini chuqur o'rganish.", "Portlash jarayonida yuzaga keladigan bosim va harorat o'zgarishlarini matematik modellar yordamida hisoblashni o'rganish.", "Portlovchi moddalarni sanoatda xavfsiz qo'llash qoidalari va ularning ta'sir mexanizmlarini amaliy jihatdan tahlil qilish."], ["Sanoatda qo'llaniladigan portlovchi moddalarning detonatsiyasining fizik mohiyati deganda nima tushuniladi?", "Portlovchi moddalar zarbli to'lqinlarining juda tor maydonda barcha termodinamik parametrlarini (bosim, zichlik, harorat) sakrashsimon o'zgartirib tarqalishi tushuniladi.", "Portlovchi moddalarning yonishi natijasida yuzaga keladigan issiqlikning bir tekisda tarqalishi hamda bosimning asta-sekin oshishi nazarda tutiladi.", "Portlovchi modda molekulalarining termal parchalanishi natijasida hosil bo'ladigan gazlarning tashqi muhitga tinch holatda chiqishi tushuniladi.", "Portlovchi moddalarning kimyoviy tarkibi va tuzilishi haqidagi ma'lumotlar to'plami, ularning sanoatda qo'llanilish xususiyatlari tushuniladi."], ["Detonatsiyali to'lqin fronti (I) ortida qanday jarayonlar yuz beradi?", "PM molekulalari parchalanadi, yuqori haroratda isigan element atomlari kislorod bilan shiddatli kimyoviy reaksiyaga kirishadi, issiqlik ajraladi va PM gaz holatiga aylanadi.", "Gaz holatiga o'tgan PM mahsulotlari markazga qarab siyraklashuvchi to'lqin fronti (IV) ta'sirida asta-sekin soviy boshlaydi va qaytadan qattiq holatga o'tadi.", "Detonatsiyali to'lqin fronti (I) ortida faqatgina termodinamik o'zgarishlar sodir bo'ladi, kimyoviy reaksiyalar sodir bo'lmaydi.", "Portlashdan hosil bo'lgan mahsulotlarning kengayish fronti (III) harakatlanadi, ammo bu jarayonlarning tezligi tovush tezligidan ancha past bo'ladi."], ["Zarbli detonatsiyali to'lqin frontining qalinligi odatda qancha bo'ladi?", "Molekulalarning erkin o'tish yo'li uzunligi (10⁻¹⁰ sm) dan oshmaydi, biroq reaksiya sodir bo'ladigan zona to'lqin frontidan anchagina katta bo'ladi.", "Bu qalinlik har doim 10-20 m/s tezlikda tarqaladigan oddiy yonish zonasining qalinligiga teng bo'ladi.", "Har doim reaksiya sodir bo'ladigan zona qalinligidan kichik bo'lib, 0.4 sm dan 3-4 sm gacha bo'lgan oraliqda o'zgaradi.", "U PM turiga bog'liq bo'lmagan holda doimiy 10-100 sm atrofida bo'lib, portlashning asosiy parametrlaridan biri hisoblanadi."], ["Gamogenli detonatsiyalash mexanizmi tezligi geksogen va TEK kabi kuchli portlovchi moddalarda qancha bo'lishi mumkin?", "6.0-7.0 km/s tezlikka ega bo'lishi mumkin.", "10-20 m/s tezlikka ega bo'lishi mumkin.", "2.0 km/s tezlikdan oshmaydi.", "3.3 mDj dan 4.9 mDj energiya ajralib chiqish tezligiga teng."], ["Kritik diametr qanday tushuniladi va uning detonatsiyaga ta'siri qanday?", "Kritik diametr shunday diametrki, u yana kamaytirilganda zaryad detonatsiyasining ustivorligi beqaror bo'lib, detonatsiyaning kamayishi (so'nishi) kuzatiladi.", "Kritik diametr shunday diametrki, u oshirilganda detonatsiya tezligi maksimal qiymatga yetadi va undan keyin o'zgarmay qoladi.", "Kritik diametr portlovchi modda turiga bog'liq bo'lmagan doimiy qiymat bo'lib, uning kattaligi hech qanday holatda detonatsiya tezligiga ta'sir qilmaydi.", "Kritik diametr faqatgina qobiqsiz zaryadlar uchun mavjud bo'lib, qobiqli zaryadlarda bu tushuncha ahamiyatsiz hisoblanadi."], ["Chegaraviy diametr deganda nima tushuniladi va uning detonatsiya tezligiga ta'siri qanday?", "Chegaraviy diametr shunday diametrki, har qachon diametrni oshirgan bilan detonatsiya tezligi oshmaydi.", "Chegaraviy diametr shunday diametrki, u kamaytirilganda detonatsiya tezligi oshib boradi.", "Chegaraviy diametr portlovchi modda tarkibidagi kimyoviy birikmalarning maksimal miqdorini ifodalaydi.", "Chegaraviy diametr portlovchi moddaning xavfsizlik talablariga javob berishini belgilaydigan eng kichik hajmdir."], ["Yuqori zichlikka ega individual portlovchi moddalar uchun qobiq detonatsiya tezligiga qanday ta'sir ko'rsatadi?", "Yuqori zichlikka ega bo'lgan individual portlovchi moddalar uchun qobiq detonatsiya tezligiga ta'sir ko'rsatmaydi.", "Yuqori zichlikka ega individual portlovchi moddalar uchun qobiq detonatsiya tezligini oshiradi.", "Yukori zichlikka ega individual portlovchi moddalar uchun qobiq detonatsiya tezligini sezilarli darajada kamaytiradi.", "Qobiqning ta'siri portlovchi moddaning zichligiga to'g'ridan-to'g'ri proportsional bo'lib, tezlikni oshirishga xizmat qiladi."], ["Portlash paytida hosil bo'ladigan asosiy zaharli gazlar qaysilar?", "Uglerod (IV) oksidi va azot oksidlari, shuningdek, agar oltingugurt qo'shilmalari bo'lsa, oltingugurt angidridi va serovodorod ajralib chiqadi.", "Faqatgina kislorod va vodorod gazlari hosil bo'ladi, ular atrof-muhit uchun hech qanday ziyon keltirmaydi.", "Faqatgina karbonat angidrid va suv bug'i ajralib chiqadi, bu gazlar inson sog'lig'iga mutlaqo zararsizdir.", "Ozon va metan gazlari ajralib chiqadi, ammo ularning miqdori va zaharli ta'siri juda ahamiyatsiz hisoblanadi."], ["Kislorod balansi deb nimaga aytiladi?", "PM tarkibidagi kislorod miqdorining uning tarkibida bo'lgan yonuvchi komponentlarning to'la oksidlanishi uchun kerak bo'lgan kislorod miqdoriga nisbatiga aytiladi.", "Kislorod balansi portlovchi moddaning tashqi muhitdan kislorodni qancha miqdorda o'zlashtirishini ko'rsatadigan ko'rsatkichdir.", "Kislorod balansi portlovchi moddaning portlash paytida qancha miqdorda kislorod ajratib chiqarishini ifodalaydigan ko'rsatkichdir.", "Kislorod balansi atrof-muhitdagi kislorod konsentratsiyasining portlovchi modda saqlash sharoitiga ta'sirini o'lchovchi mezon hisoblanadi."], ["Karbonat angidrid gazi (SO₂) ning inson organizmiga ta'siri qanday ekanligi matnda qayd etilgan?", "Er osti kon ishlarida ishlayotgan ishchilarga ziyon etkazib, havodagi yuqori konsentratsiyasi nafas olish ritmini buzib, bosh og'rig'ini keltirib chiqaradi.", "Asosan markaziy nerv sistemasini va buyrak kasalliklarini keltirib chiqaradi, xushdan ketish va tomir tortishlariga sabab bo'ladi.", "O'tkir hidga ega bo'lib, sariq-qo'ng'ir rangli bo'ladi, namlik bilan aralashganida azotli kislota shakliga o'tadi.", "Rangsiz, o'tkir, qattiq bezovta qiluvchi, nordon ta'mli, juda zaharli gaz bo'lib, namlik bilan oltingugurt kislotasini hosil qiladi."], ["Portlovchi moddalarning detonatsiya jarayonida 'n' politrop ko`rsatkichi asosan nimani anglatadi?", "Politrop ko`rsatkichi moddaning boshlang'ich qattiqligiga bog'liqligini ko`rsatadi.", "Politrop ko`rsatkichi moddaning umumiy kimyoviy tarkibini belgilaydi va o`zgaruvchandir.", "Politrop ko`rsatkichi detonatsiya to`lqini kengligini ta'minlaydigan koeffitsientdir.", "Politrop ko`rsatkichi portlash mahsulotlarining haroratini ifodalovchi parametr."], ["Portlovchi moddalarning detonatsiya tezligini (D) belgilashda, boshqa zichlikdagi zaryadlar uchun qaysi ifoda ishlatiladi?", "D = D₀ + 3500 ⋅ (ρᵥ - 1), bu yerda D₀ etalon tezlik, ρᵥ esa zaryadlash zichligi hisoblanadi.", "D = D₀ - 3500 ⋅ (ρᵥ + 1), bu yerda D₀ boshlang'ich tezlik, ρᵥ esa zaryadlash zichligi hisoblanadi.", "D = D₀ ⋅ (3500 + ρᵥ - 1), bu yerda D₀ boshlang'ich tezlik, ρᵥ esa zichlik koeffitsientidir.", "D = D₀ / (3500 ⋅ (ρᵥ - 1)), bu yerda D₀ etalon tezlik, ρᵥ esa zaryadlash zichligi koeffitsienti."], ["Etalon (standart) portlovchi modda hisoblangan ammonit №6 JV uchun berilgan portlash energiyasi qancha?", "4315.7 kJ/kg", "3600.0 kJ/kg", "1.0 kJ/kg", "3500.0 kJ/kg"], ["Portlovchi moddalarni sanoatda qo`llashdan avval ularning detonatsiya parametrlarini aniqlashdan asosiy maqsad nima?", "Moddalarning portlatish ishlariga va saqlash uchun yaroqliligini sinash usullarini o`rganish.", "Moddalarning kimyoviy tarkibini o`zgartirish va yangi sintez usullarini tadqiq qilish.", "Portlovchi moddalarni ishlab chiqarish jarayonini tezlashtirish va xarajatlarni kamaytirish.", "Portlovchi moddalarning atrof-muhitga ta'sirini o`rganish va ekologik xavfsizligini oshirish."], ["Detonatsiya tezligini Dotrish usuli bilan aniqlashda, patron (truba) qanday xususiyatlarga ega bo`lishi kerak?", "Diametri 31±1 mm, uzunligi 300 mm bo`lgan qog`ozdan yoki metalldan yasalgan silindr.", "Diametri 50±2 mm, uzunligi 500 mm bo`lgan, faqat metalldan yasalgan prizma.", "Diametri 20±1 mm, uzunligi 100 mm bo`lgan, shishadan yasalgan kubik shaklidagi idish.", "Diametri 15±0.5 mm, uzunligi 200 mm bo`lgan, plastmassadan yasalgan konus."], ["Ostsilografik usulda detonatsiya tezligini (V_PM) hisoblash uchun qaysi formula qo`llaniladi?", "V_PM = S / t formulasi simlar orasidagi masofa S va vaqt t orqali tezlikni aniqlaydi.", "V_PM = S ⋅ t formulasi simlar orasidagi masofa S va vaqt t yordamida tezlikni aniqlaydi.", "V_PM = S + t formulasi simlar orasidagi masofa S va vaqt t orqali tezlikni jamlaydi.", "V_PM = S - t formulasi simlar orasidagi masofa S va vaqt t orqali tezlikni farqlaydi."], ["Ostsilografik usulda uchta simdan uchinchi simning asosiy vazifasi nima?", "Elektrodetonatorga yaqin joydan o`tkazilib, ostsilografni qo`shish uchun xizmat qiladi.", "Detonatsiya tezligini nazorat qilish uchun zaxira o`lchov kanali vazifasini bajaradi.", "Simlar orasidagi masofani kalibrlash uchun qo`shimcha ma'lumotlarni taqdim etadi.", "Atrof-muhitdagi shovqinlarni kamaytirish va o`lchov aniqligini oshirish."], ["Detonatsiya tezligi portlovchi moddaning qaysi fizik xususiyatiga bevosita bog'liq, deb ko'rsatilgan?", "Portlovchi modda zichligiga.", "Portlovchi modda rangiga.", "Portlovchi modda hidiga.", "Portlovchi modda qattiqligiga."], ["Zaryadlash zichligi 900 kg/m³ va portlash energiyasi 5720 kJ/kg bo`lgan grammonal A-45 ning detonatsiya tezligini aniqlash usuli qanday?", "Berilgan formulalar va etalon qiymatlardan foydalanib hisoblash orqali aniqlanadi.", "Maxsus laboratoriya sharoitida faqat optik sensorlar yordamida bevosita o`lchanadi.", "Faqat etalon portlovchi moddaning standart qiymatlariga asoslanib taxmin qilinadi.", "Portlovchi moddaning tarkibini kimyoviy tahlil qilib, jadvaldan o`zgarish aniqlanadi."], ["Portlovchi moddalarning detonatsiya to`lqinlaridagi zichligi qanday formula orqali hisoblanadi?", "Portlovchi moddaning detonatsiya to`lqinlaridagi zichligi ρ' = ρ₀ ⋅ n / (n-1) formulasi bilan aniqlanadi.", "Portlovchi moddaning detonatsiya to`lqinlaridagi zichligi ρ' = ρ₀ + D ⋅ n formulasi bilan aniqlanadi.", "Portlovchi moddaning detonatsiya to`lqinlaridagi zichligi ρ' = Qᵥ ⋅ D / n formulasi bilan aniqlanadi.", "Portlovchi moddaning detonatsiya to`lqinlaridagi zichligi ρ' = (n+1) ⋅ ρ₀ / D formulasi bilan aniqlanadi."], ["Sanoatda qo`llaniladigan portlovchi moddalarning detonatsiyasi parametrlarini hisoblash amaliy ishining asosiy maqsadi nimadan iborat?", "Amaliy ishning asosiy maqsadi portlovchi moddalarni portlatish va saqlashga yaroqliligini sinash usullarini o`rganishdir.", "Amaliy ishning asosiy maqsadi portlovchi moddalarning yangi turlarini sintez qilish jarayonini tushunishdir.", "Amaliy ishning asosiy maqsadi portlovchi moddalarning kimyoviy tarkibini tahlil qilish metodlarini o`rganishdir.", "Amaliy ishning asosiy maqsadi portlovchi moddalarni ishlab chiqarish texnologiyasini optimallashtirishdir."], ["Nazariy qismga ko`ra, portlovchi moddalar qanday shartlarda sinovdan o`tkazilishi shart?", "Barcha portlovchi moddalar omborxonalarga tushirishdan oldin va saqlash davomida vaqti-vaqti bilan sinab turilishi kerak.", "Portlovchi moddalar faqat ishlab chiqarish jarayonidan keyin bir marta sinovdan o'tkazilishi kifoya.", "Portlovchi moddalar faqat har olti oyda bir marta sinovdan o'tkazilishi va natijalarni qayd etish zarur.", "Portlovchi moddalar faqat ulardan foydalanishdan bevosita oldin sinovdan o'tkazilishi kerak bo'ladi."], ["Detonatsiya tezligini Dotrish usuli bilan aniqlashda V_pm ni topish formulasi qaysi?", "V_pm = S ⋅ V_dsh / (L₁ - L₂ - a + 2m) formulasi qo'llaniladi, bu yerda V_dsh detonatsiya shnuri tezligi.", "V_pm = (L₁ + L₂ + a) ⋅ V_dsh / (S - 2m) formulasi qo'llaniladi, bu yerda S detonatsiya tezligi.", "V_pm = (L₁ - a + m) ⋅ V_dsh / (S + L₂ - m) formulasi qo'llaniladi, bu yerda L₁ va L₂ masofalar.", "V_pm = S + V_dsh ⋅ (L₁ - L₂ + a - 2m) formulasi qo'llaniladi, bu yerda m detonator masofasi."], ["Dotrish usulida sinov paytida portlovchi moddaning zichligiga qo'yiladigan asosiy talab qanday?", "Sinov vaqtida portlovchi moddaning sanoat sharoitiga to`g`ri keladigan zichligini ta`minlash maqsadga muvofiq.", "Sinov vaqtida portlovchi moddaning zichligi doimiy ravishda maksimal qiymatda bo'lishi shart, o'zgarishi mumkin emas.", "Sinov vaqtida portlovchi moddaning zichligi minimal darajada bo'lishi kerak, bu xavfsizlikni oshiradi.", "Sinov vaqtida portlovchi moddaning zichligi har doim etalon Ammonit №6 JV zichligiga teng bo'lishi kerak."], ["Detonatsiya tezligini Dotrish usulida aniqlashda erishiladigan aniqlik darajasi qancha?", "Bu tajribada topilgan detonatsiya tezligi ±3% aniqlikda chiqadi, bu usulning samaradorligini bildiradi.", "Bu tajribada topilgan detonatsiya tezligi ±1% aniqlikda chiqadi, bu eng yuqori aniqlikni ta'minlaydi.", "Bu tajribada topilgan detonatsiya tezligi ±5% aniqlikda chiqadi, bu usulning o'rtacha aniqligini ko'rsatadi.", "Bu tajribada topilgan detonatsiya tezligi ±10% aniqlikda chiqadi, bu usulning past aniqligidan dalolat beradi."], ["Detonatsiya tezligini ostsilografik usul yordamida aniqlash formulasida S nimani anglatadi?", "S parametri Dsh lar orasidagi masofani bildiradi, bu detonatsiya tezligini aniqlash bazasi hisoblanadi.", "S parametri detonatsiya tezligini (m/s) ifodalaydi, bu natijaviy o'lchov birligini ko'rsatadi.", "S parametri ostsilograf ekranidagi signallarning amplitudasi (mV) hisoblanadi, bu grafik kattalikdir.", "S parametri portlovchi moddaning qalinligini (mm) bildiradi, bu material xususiyatini ko'rsatadi."], ["Ostsilografik usulda detonatsiya tezligini aniqlashda qaysi formula qo'llaniladi?", "Ostsilografik usulda detonatsiya tezligi V = S / t formulasi yordamida aniqlanadi, bu yerda t vaqtni bildiradi.", "Ostsilografik usulda detonatsiya tezligi V = S ⋅ t formulasi yordamida aniqlanadi, bu yerda S masofani anglatadi.", "Ostsilografik usulda detonatsiya tezligi V = √(S / t) formulasi yordamida aniqlanadi, bu yerda V tezlikdir.", "Ostsilografik usulda detonatsiya tezligi V = t / S formulasi yordamida aniqlanadi, bu yerda t simlar kesilish vaqti."], ["Portlovchi moddalarni sinashda, saqlaydigan omborxonadan qancha masofada o'tkazilishi shart?", "Sinovlar omborxonadan 200 m dan kam bo`lmagan masofada, maxsus ajratilgan kamerada yoki maydonda o`tkazilishi shart.", "Sinovlar omborxonaning ichida, maxsus izolyatsiyalangan xonada o`tkazilishi shart, uzoqlashish shart emas.", "Sinovlar omborxonadan 50 m masofada, ochiq havoda o`tkazilishi shart, bu havo aylanishini ta'minlaydi.", "Sinovlar omborxonadan 100 m dan kam bo`lmagan masofada, har qanday sharoitda o`tkazilishi shart emas."], ["Qattiq portlovchi moddalar uchun keltirilgan tengsizlik holati qanday ifodalanadi?", "p⋅Vⁿ=const, bu yerda p bosim, V hajm, n politrop ko'rsatkichdir.", "p/Vⁿ=const, bu yerda p tezlik, V massa, n detonatsiya tezligidir.", "p+Vⁿ=const, bu yerda p quvvat, V energiya, n samaradorlikdir.", "p-Vⁿ=const, bu yerda p zichlik, V harorat, n issiqlik sig'imidir."], ["CHepmen-Juga nuqtasida detonatsiya to'lqinlari bosimi qaysi formula asosida aniqlanadi?", "Pₐ = (ρ₀⋅D²) / (n+1) formulasi yordamida aniq hisoblab chiqiladi.", "Pₐ = (ρ₀+D²) ⋅ n formulasi yordamida aniq hisoblab chiqiladi.", "Pₐ = D ⋅ n / ρ₀ formulasi yordamida aniq hisoblab chiqiladi.", "Pₐ = (ρ₀²⋅D) / (n-1) formulasi yordamida aniq hisoblab chiqiladi."], ["Ostsilografik usulda detonatsiya tezligini aniqlashning asosiy printsipi nimaga asoslangan?", "Detonatsiya to'lqinlari o'tishi bilan simlarning ketma-ket uzilishi va elektr signallarining o'zgarishi.", "Detonatsiya paytida portlovchi moddaning rang o'zgarishini optik sensorlar bilan qayd etish.", "Portlovchi moddaning detonatsiya paytidagi akustik to'lqinlarini mikrofonlar bilan yozib olish.", "Detonatsiya natijasida hosil bo'lgan gazlarning kimyoviy tarkibini doimiy tahlil qilish."], ["Yangi va etalondagi portlovchi moddalarning detonatsiya tezliklarini taqqoslash uchun qaysi yaqinlashish formulasi berilgan?", "D_n / D_m = (Q_n / Q_et)¹ᐟ² tenglamasi qo'llaniladi.", "D_n ⋅ D_m = (Q_n + Q_et)¹ᐟ² tenglamasi qo'llaniladi.", "D_n - D_m = (Q_n - Q_et)² tenglamasi qo'llaniladi.", "D_n + D_m = (Q_n ⋅ Q_et) / 2 tenglamasi qo'llaniladi."], ["Boshqa zichlikdagi zaryadlar uchun detonatsiya tezligi qaysi formula yordamida aniqlanadi?", "D = D₀ + 3500⋅(ρ_w - 1) formulasi orqali hisoblab chiqiladi.", "D = D₀ - 3500⋅(ρ_w + 1) formulasi orqali hisoblab chiqiladi.", "D = D₀ ⋅ 3500 / (ρ_w - 1) formulasi orqali hisoblab chiqiladi.", "D = D₀ + (ρ_w / 3500) - 1 formulasi orqali hisoblab chiqiladi."], ["Dotrish usulida zaryad joylashtirish uchun patron qanday o'lchamlarda bo'lishi kerak?", "Diametri 31±1 mm, uzunligi 300 mm bo'lgan qog'oz yoki metalldan yasalgan silindr.", "Diametri 50±2 mm, uzunligi 500 mm bo'lgan shisha yoki plastmassa silindr.", "Diametri 20±1 mm, uzunligi 100 mm bo'lgan yog'ochdan yasalgan patron.", "Diametri 40±3 mm, uzunligi 250 mm bo'lgan keramika yoki rezina patron."], ["Ostsilografik usulda, PM patronidagi simlar orasidagi \"S\" masofa nimani anglatadi?", "PM detonatsiya tezligini aniqlash uchun asos bo'lgan bazani ifodalaydi.", "Portlovchi moddaning to'liq yonish masofasini aniqlash uchun ishlatiladi.", "Elektrodetonator joylashgan joydan signal uzatish nuqtasigacha bo'lgan masofa.", "Portlash paytida hosil bo'lgan bosim to'lqinlarining amplitudasini bildiradi."], ["Ostsilografik usulda detonatsiya tezligini aniqlashda uchinchi simning vazifasi nima?", "Uchinchi sim bevosita elektrodetonatorga yaqin joydan o'tkazilib, ostsilografni qo'shish uchun xizmat qiladi.", "Uchinchi sim detonatsiya to'lqinining tezligini mustaqil ravishda o'lchash uchun ikkilamchi sensor vazifasini bajaradi.", "Uchinchi sim portlovchi moddaning kimyoviy tarkibini tahlil qilish uchun namuna olish vazifasini bajaradi.", "Uchinchi sim sinov paytida xavfsizlik choralariga rioya etishni ta'minlovchi himoya elementi sifatida ishlatiladi."], ["\"Amaliy ish №4\" ning nomidan kelib chiqib, mazkur amaliyotning umumiy maqsadi nimadan iborat?", "Sanoatda qo'llaniladigan portlovchi moddalarning detonatsiya parametrlarini hisoblash.", "Yangi portlovchi moddalarni ishlab chiqish va ularning xususiyatlarini tadqiq qilish.", "Portlovchi moddalarning saqlash sharoitlarini optimallashtirish usullarini o'rganish.", "Portlash natijasida atrof-muhitga etkaziladigan zararni minimallashtirish yo'llarini aniqlash."], ["Amaliy mashg‘ulotning asosiy maqsadi maydalanmay qolgan harsangtoshlarni ikkilamchi maydalash uchun portlovchi modda (PM) sarfini va parametrlarini aniqlashdan iborat, bu esa qanday jarayonlarni optimallashtirishga yordam beradi?", "Bularni qayta ishlash texnologiyasini takomillashtirish, operatsion xarajatlarni qisqartirishga yordam beradi.", "Yangi qazib olish usullarini ishlab chiqish, resurslardan samarali foydalanishni oshirishga xizmat qiladi.", "Kon-geologik sharoitlarni baholash va qazish jarayonlarining umumiy samaradorligini oshirishga.", "Atrof-muhitga ta'sirni kamaytirish, portlatish ishlarining ekologik me'yorlarga mosligini ta'minlashga."], ["Shpurli zaryad usuli qanday texnologik operatsiyalardan tashkil topgan bo'lib, uning ketma-ketligi qanday bosqichlarni o'z ichiga oladi, ayniqsa xavfli zonani o'rash bilan bog'liq?", "Shpurni parmalash, portlovchi moddani joylash, zaboyka qilish, xavfli zonani o'rash va portlatishni o'z ichiga oladi.", "Skvajinani parmalash, detonatsiya piligini tayyorlash, portlovchi moddani joylash, zaboyka qilish.", "Transheyani o'tish, detonatorlarni joylashtirish, tuproq bilan zaboyka qilish, xavfli zonani o'rash.", "Qozon xosil qilish, portlovchi moddani tushirish, zaboyka qilish, xavfli masofani o'rash va portlatish."], ["Transheya zaryadi usuli qaysi sohalarda keng qo'llaniladi va u asosan qanday turdagi qurilish yoki qazib olish ishlarida samarali hisoblanadi?", "Kanal, kollektor va boshqa qurilish ishlarida, shuningdek foydali qazilma konlarining yuqori qatlamidagi qoplamani irg'itishda.", "Yer osti konchilikda, tor kon laxmlarini o'tishda va rudalarni maydalashda asosan qo'llaniladi.", "Shaxtalarda chuqur shpurlarni parmalashda va qimmatbaho minerallarni ajratib olishda eng ko'p qo'llaniladi.", "Shahar sharoitidagi tor joylarda, eski temir beton asoslarini portlatishda samarali hisoblanadi."], ["Kamerali zaryadlar usuli qaysi sharoitlarda qo'llaniladi va u asosan nima maqsadda, qanday turdagi ishlarni bajarishda samarali hisoblanadi?", "Noo'lcham blok va bo'laklarni maydalashda, shuningdek borish qiyin bo'lgan joylardagi yordamchi ishlarda.", "Katta hajmli kon massalarini tezkorlik bilan qazib olishda va transport yo'llarini qurishda.", "Yuqori balandlikdagi pog'onalarni qulatishda, ayniqsa pogonalarning pastki qismlarini maydalashda.", "Foydali qazilmalarni yer osti usulida qazib olishda, vertikal va gorizontal kon laxamlarni o'tishda."], ["Skvajinali zaryad usulining burg'ulash va portlatish ishlaridagi mehnat unumdorligi shpurli usulga nisbatan qanchaga yuqori bo'lishi mumkinligi qayd etilgan?", "Skvajinali usulda mehnat unumdorligi shpurli usulga nisbatan 4-5 marta yuqori bo'ladi.", "Skvajinali usulda mehnat unumdorligi shpurli usulga nisbatan 2-3 marta yuqori bo'ladi.", "Skvajinali usulda mehnat unumdorligi shpurli usulga nisbatan 6-7 marta yuqori bo'ladi.", "Skvajinali usulda mehnat unumdorligi shpurli usulga nisbatan 8-10 marta yuqori bo'ladi."], ["Maydalanmay qolgan harsangtoshlarni ichki zaryadlar ta'siri yordamida maydalashda shpurlar qanday diametrda burg'ulanadi va ularning qalinligi bo'lakning qaysi qismiga to'g'ri kelishi kerak?", "Diametri 28-30 mm bo'lgan shpurlar 1/3 qism qalinligida burg'ulanadi.", "Diametri 15-20 mm bo'lgan shpurlar 1/2 qism qalinligida burg'ulanadi.", "Diametri 35-40 mm bo'lgan shpurlar 1/4 qism qalinligida burg'ulanadi.", "Diametri 22-25 mm bo'lgan shpurlar 2/3 qism qalinligida burg'ulanadi."], ["Skvajina uzunligi (l_c) qaysi formula yordamida aniqlanadi va undagi H_y qaysi kattalikni ifodalaydi?", "l_c = H_y + l_переб formula bilan aniqlanadi, H_y pog'ona balandligini (m) ifodalaydi.", "l_c = 11·d_c formula bilan aniqlanadi, d_c skvajina diametrini (m) ifodalaydi.", "l_c = l_зар + l_заб formula bilan aniqlanadi, l_зар zaryad uzunligini (m) ifodalaydi.", "l_c = Q_зар/ρ formula bilan aniqlanadi, Q_зар zaryad massasini (kg) ifodalaydi."], ["Zaboyka uzunligi (l_заб) qaysi formula yordamida aniqlanadi va undagi l_c nimani anglatadi?", "l_заб = 0,27·l_c formula bilan aniqlanadi, l_c skvajina uzunligini (m) anglatadi.", "l_заб = H_y + l_переб formula bilan aniqlanadi, H_y pog'ona balandligini (m) anglatadi.", "l_заб = l_c - l_зар formula bilan aniqlanadi, l_зар portlovchi modda zaryadi uzunligini anglatadi.", "l_заб = 11·d_c formula bilan aniqlanadi, d_c skvajina diametrini (m) anglatadi."], ["Qattaligini tekshirish quyidagi shart bo'yicha bajariladi: l_переб ≤ 0,3·W. Agar l_переб &gt; 0,3·W bo'lsa, u holda qanday chora ko'riladi?", "l_переб = 0,3·W deb qabul qilinadi va barcha kattaliklari qayta hisoblanadi.", "W = H_y·ctgα + 2 deb qabul qilinadi va faqat W kattaligi qayta hisoblanadi.", "d_c = d_d·K_разб deb qabul qilinadi va faqat d_c kattaligi qayta hisoblanadi.", "Q_зар = ρ·l_зар deb qabul qilinadi va faqat Q_зар kattaligi qayta hisoblanadi."], ["Ochiq usulda foydali qazilmalarni qazib olishda shpurli zaryadlar quyidagi ishlarning qaysi birida qo'llanilmaydi?", "Katta hajmdagi tog' jinslarini yirik bloklarga ajratib olish maqsadida portlatish ishlarida.", "Noo'lcham tog' jinslarini maydalash va yo'l qurilishi ishlarida samarali foydalanish.", "Pog'ona qismlarida qolgan qismlarni maydalash vazifasida keng qo'llanilishi.", "Chuqurligi 5 m dan oshmagan kanavalar qazish kabi yumushlarda qo'llaniladi."], ["Portlatish natijasida hosil bo'lgan tog' jinslariga qo'yiladigan umumiy talablardan qaysi biri to'g'ri emas?", "Maydalanmagan toshlar soni maksimal darajada bo'lishi talab qilinadi.", "Portlatilgan jinslarning bir tekisda joylashishi ta'minlanishi kerak.", "Yuklash va tashish transporti o'lchamlariga mos kelishi shartdir.", "Maydalanishning bir tekisda amalga oshirilishi muhim ahamiyatga ega."], ["Kamerali zaryadlar usuli qanday ob'ektlarga nisbatan qo'llaniladi?", "Og'irligi bir necha yuz tonnadan iborat bo'lgan, yemirilishi kerak bo'lgan ob'ektlar.", "Chuqur joylashgan, yuqori bosimli suvli qatlamlarni portlatish uchun qo'llaniladi.", "Er osti konlarida tor va murakkab geometriyali laxmlarni ochishda ishlatiladi.", "Diametri kichik, ammo uzun shpurlar talab qiladigan maxsus joylarda tatbiq etiladi."], ["SHpurlar yordamida maydalash uchun sarflanadigan portlovchi modda (PM) zaryadining umumiy og'irligi (Q) qaysi formula bilan aniqlanadi?", "Q = qᵥ ⋅ V, bu yerda qᵥ – ichki zaryadlar ta'siri uchun PM nisbiy sarfi, V – harsangtosh hajmi.", "Q = (πd² / 4) ⋅ Δ ⋅ lₘ ⋅ k, bu yerda d – shpur diametri, Δ – zaryadlash zichligi.", "N = Q / Q₁, bu yerda N – shpurlar soni, Q₁ – bitta shpurdagi zaryad og'irligi.", "Q = qₙ ⋅ V, bu yerda qₙ – tashqi zaryadlar ta'siri uchun PM nisbiy sarfi, V – harsangtosh hajmi."], ["Skvajina uzunligi (l𝒸) formulasida (l𝒸 = Hᵧ + lₙₑₚ) 'Hᵧ' parametri nimani anglatadi?", "Pog'onaning balandligi, ya'ni portlatilayotgan qatlamning vertikal o'lchami hisoblanadi.", "Skvajina diametri, burg'ulash teshigining gorizontal kesimining kattaligi darajasi.", "Perebur uzunligi, ya'ni skvajinaning chuqurlikdagi ortiqcha qismi hajmi.", "Zaboyka uzunligi, portlovchi modda ustidagi to'ldirish qismining hajmi miqdori."], ["Etalondagi portlovchi moddaning solishtirma sarfini aniqlash formulasidagi 'κᵦᵦ' koeffitsienti nimani anglatadi?", "Portlovchi moddaning turini hisobga oluvchi maxsus koeffitsientni ifodalaydi.", "Tog' jinsining portlanuvchanlik darajasini ifodalovchi o'zgaruvchi qiymat.", "Skvajina diametrini metrda ko'rsatish uchun ishlatiladigan o'lcham birligi.", "Zaryadlash zichligini hisoblashda qo'llaniladigan doimiy sonni bildirishi."], ["Shpurli zaryad usuli qanday texnologik operatsiyalarni o'z ichiga oladi, ayniqsa portlash oldidan xavfli hududni cheklashga qaratilgan?", "Shpurni parmalash, portlovchi moddani joylash, zaboyka qilish, xavfli zonasini o'rab olish va zaryadlarni portlatish kabilarni o'z ichiga oladi.", "Faqat tog' jinslarini maydalash va pog'ona qismlarini yumshatish kabi tayyorgarlik ishlarini bajarish jarayonini bildiradi.", "Asosan portlovchi moddalarni mexanizatsiyalash va portlashdan keyin hosil bo'lgan uyum balandligini aniqlashni o'z ichiga oladi.", "Detonatsiya piligi yordamida patron-detonatorni tayyorlash va skvajinaga tushirish hamda umumiy PM sarfini hisoblashdir."], ["Transheya zaryadi usuli qanday turdagi qurilish va qazish ishlarida keng qo'llaniladi, ayniqsa konchilik sohasida ham?", "Kanal, kollektor va boshqa qurilish ishlarida, hamda foydali qazilmalarni ochiq usulda qazib olishda yuqori qatlamdagi tog' jinslarini irg'itib tashlashda.", "Asosan noo'lcham tog' jinslarini maydalash, pog'onaning yuqorigi va pastki qismlarini portlatishda samarali qo'llaniladi.", "Yer osti kon laxmlarini o'tishda, foydali qazilma rudalarini maydalash va boshqa murakkab vazifalarda qo'llaniladi.", "Portlovchi moddani skvajinaga tushirish, zaboyka va qozonli zaryadni portlatish, maydalangan tog' jinsini tekshirishda."], ["Qozonli zaryad usulining eng asosiy kamchiligi nimada, ayniqsa tog' jinslarining maydalanishi darajasini boshqarish nuqtai nazaridan?", "Tog' jinslarining maydalanish darajasin
